name: Cloudflare Pages

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.160.1"
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check private data boundary
        run: npm run check:data-boundary

      - name: Build
        run: npm run build:prod

      - name: Check SEO files
        run: npm run check:seo

      - name: Check global release structure
        run: npm run check:release

      - name: Check MCP data snapshot
        run: npm run check:mcp

      - name: MCP function tests
        run: npm run test:mcp && npm run test:mcp-auth

      - name: Public library boundary tests
        env:
          TRAVEL_LIBRARY_TEST_ROOT: ${{ runner.temp }}/entrycardguide-boundary-tests
        run: npm run test:data-boundary

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.160.1"
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check private data boundary
        run: npm run check:data-boundary

      - name: Build
        run: npm run build:prod

      - name: Check MCP deployment configuration
        run: npx --yes --package=wrangler@4.85.0 -- npm run check:release -- --deployment

      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "Missing Cloudflare API token. Add CLOUDFLARE_API_TOKEN or CF_API_TOKEN in GitHub repository secrets."
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "Missing Cloudflare account ID. Add CLOUDFLARE_ACCOUNT_ID or CF_ACCOUNT_ID in GitHub repository secrets."
            exit 1
          }

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.85.0"
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public-release --project-name=entrycardguide --branch=${{ github.ref_name }} --commit-dirty=true

      - name: Verify production revision and live MCP boundary
        run: node scripts/check-live-release.mjs

      - name: Save production readback
        uses: actions/upload-artifact@v4
        with:
          name: entrycardguide-production-readback
          path: release-live.json
          if-no-files-found: error
          retention-days: 3

      # Runs after the deploy: IndexNow fetches the key file and the submitted
      # URLs, so they have to be live first. A search engine being down must not
      # fail a deploy that already succeeded.
      - name: Notify IndexNow
        run: npm run submit:indexnow
        continue-on-error: true
