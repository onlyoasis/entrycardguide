# Indonesia changelog. Append to this file when customs or immigration policy changes.

[[entries]]
date = "2026-06-11"
summary = "Updated Indonesia official URLs to All Indonesia and the current e-VOA portal"
summary_zh = "更新印尼 All Indonesia 和当前 e-VOA 官方入口"
summary_zh_hant = "更新印尼 All Indonesia 和當前 e-VOA 官方入口"
detail = "molina.imigrasi.go.id no longer resolved during audit. The guide now points e-VOA travelers to evisa.imigrasi.go.id and uses allindonesia.imigrasi.go.id as the current unified arrival declaration entry point."

[[entries]]
date = "2026-04-26"
summary = "Initial Indonesia e-CD coverage published"
summary_zh = "印尼 e-CD 海关申报指南首版上线"
summary_zh_hant = "印尼 e-CD 海關申報指南首版上線"
detail = "Covers the electronic customs declaration and related iVisa/non-official site confusion."

[[entries]]
date = "2026-10-15"
summary = "Checker follows the All Indonesia form: DD/MM/YYYY dates, arrival yesterday to 2 days ahead"
summary_zh = "本地检查器按 All Indonesia 表单更新：日期 DD/MM/YYYY，抵达日为昨天到后天"
summary_zh_hant = "本地檢查器按 All Indonesia 表單更新：日期 DD/MM/YYYY，抵達日為昨天到後天"
detail = "Read the All Indonesia form script. Dates are DD/MM/YYYY; date of birth from 1920 to today; arrival date yesterday, today or the next 2 days. Full name keeps letters and spaces and is turned into capitals."
