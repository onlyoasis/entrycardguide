# Sri Lanka changelog. Append to this file when Department policy changes.

[[entries]]
date = "2026-08-30"
summary = "Initial Sri Lanka ETA coverage published"
summary_zh = "斯里兰卡 ETA 指南首版上线"
detail = "Covers the free tourist ETA scheme in force since 25 May 2026 for 40 nationalities plus Maldives, Seychelles and Singapore, the USD 20 SAARC and USD 50 other-passport online fees, the government application at eta.gov.lk, and the published passport, return-ticket and funds requirements."
