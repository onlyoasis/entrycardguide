summary = "Initial Jordan Pass coverage published"
summary_zh = "约旦通票（Jordan Pass）指南首版上线"
detail = "Covers the official jordanpass.jo purchase form, the JD 70 / 75 / 80 packages, the two-whole-nights visa fee waiver, the JD 40 single-entry visa it waives against the Tourism Ministry fee table, the Queen Alia, Sheikh Hussein, Wadi Araba and Aqaba arrival rules, the 53 restricted nationalities on the Interior Ministry list, and the account-based Interior Ministry e-visa service for applications filed from outside the Kingdom."
