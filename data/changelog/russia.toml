# Russia changelog. Append to this file when unified e-visa policy changes.

[[entries]]
date = "2026-08-30"
summary = "Initial unified e-visa coverage published"
summary_zh = "俄罗斯统一电子签证指南首版上线"
detail = "Covers the 64-state eligibility list, the 120-day validity with a 30-day stay that replaced the earlier 60-day and 16-day rules on 23 August 2025, the 86-to-4-day application window, 4-calendar-day processing, the machine-readable passport and 35x45 photo requirements, entry and exit through approved crossing points only, and the non-refundable consular fee paid with non-Russian cards."
