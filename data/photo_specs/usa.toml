# United States — ESTA.
# Checked 2026-10-15. ESTA asks for a photo of the passport biographic page;
# the ESTA Mobile app also takes a live face photo. Federal Register notice
# 2025-22461 (10 December 2025) proposes a face photo for every applicant and
# app-only applications. This guide found no final rule.

