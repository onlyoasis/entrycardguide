[[forms.items]]
kind = "face"
capture = "live"
note_en = "The official mobile guide includes a live-photograph step. Follow the capture prompt."
note_zh = "官方手机指南里有现场拍照这一步，按提示拍。"
note_zh_hant = "官方手機指南里有現場拍照這一步，按提示拍。"

[[forms.items]]
kind = "passport"
capture = "upload"
tool = false
note_en = "Upload the passport document the current screen asks for. No pixel or file-size limit is published."
note_zh = "按当前页面要求上传护照文件。官方没有公布像素和文件大小上限。"
note_zh_hant = "按當前頁面要求上傳護照文件。官方沒有公佈像素和文件大小上限。"
