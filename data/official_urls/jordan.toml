fields_intro_en = "The live purchase form publishes maxlengths (100 on the name and both email fields, 150 on the telephone, 250 on the address), one email regex inside its validator script, dropdown-only choices for purpose, accommodation, city, nights, airline, travel party, month and ticket type, and real error strings such as Full name required and Nights is required. This page documents exactly those values and mounts no local validator, because most of the form is dropdown-based."
