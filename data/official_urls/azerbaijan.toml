notes = "Read 2026-08-30. Lists passports accepted by the ASAN e-Visa system and flags temporary visa-free arrangements that override the normal e-Visa route for specified passports and entry counts."

[conditions]
url = "https://www.evisa.gov.az/en/conditions"
name = "Conditions for issuing electronic visas"
agency = "State Agency for Public Service and Social Innovations under the President of the Republic of Azerbaijan"
last_verified = "2026-08-30"
notes = "Read 2026-08-30. A standard application must be filed at least 3 working days before arrival; urgent service is 3 hours. The e-Visa is valid for 90 days, permits a stay up to 30 days and is single entry. The travel document must remain valid for 3 months after the e-Visa expires."

[information]
url = "https://www.evisa.gov.az/en/information"
name = "ASAN e-Visa information and fees"
agency = "State Agency for Public Service and Social Innovations under the President of the Republic of Azerbaijan"
last_verified = "2026-08-30"
notes = "Read 2026-08-30. The standard e-Visa carries a USD 20 state fee plus a USD 5 service fee. Payment is non-refundable. The portal accepts Visa, Mastercard and UnionPay, and emails the result to the applicant."

