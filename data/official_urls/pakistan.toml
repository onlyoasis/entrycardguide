# Pakistan — official government visa URLs
# Last verified: 2026-08-30

[vpa]
url = "https://visa.nadra.gov.pk/"
name = "Pakistan Online Visa System — Visa Prior to Arrival"
agency = "National Database and Registration Authority for the Ministry of Interior, Government of Pakistan"
last_verified = "2026-08-30"
notes = "Read through the current official DGI&P and Ministry of Foreign Affairs pages on 2026-08-30. Open the government portal and select Visa Prior to Arrival for Tourism only after confirming passport eligibility. DGI&P currently says citizens of 120 countries may use VPA for tourism, business or Sikh pilgrimage. The portal blocks some automated requests with HTTP 403, so no unverified live-form regex or character limit is claimed."

[eligibility]
url = "https://dgip.gov.pk/home/"
name = "Pakistan Online Visa Eligibility Notice"
agency = "Directorate General of Immigration & Passports, Ministry of Interior, Government of Pakistan"
last_verified = "2026-08-30"
notes = "Read 2026-08-30. The current DGI&P home page says the online system is open to 192 countries, VPA is available to citizens of 120 countries for tourism, business or Sikh pilgrimage, and six GCC countries are visa-exempt for these categories. It also says regular visa fees are reciprocal."

[vpa_information]
url = "https://mofa.gov.pk/news/visa-prior-to-arrival-vpa-facility?mission=tunis"
