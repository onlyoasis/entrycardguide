first_observed = "2026-07-14"
evidence = "Observed 2026-07-14: the iVisa United Kingdom page advertised UK ETA prices starting from USD $100.99 and 'Get it as fast as 15 minutes.' GOV.UK charged £20 and stated that another website or app cannot provide a faster decision."

[[scam_sites]]
domain = "eta-united-kingdom.com"
path = "/terms-and-conditions"
first_observed = "2026-07-14"
evidence = "Observed 2026-07-14: the terms page listed a EUR 69.00 service fee including VAT for a new UK ETA. This service fee was separate from the £20 government application fee shown on GOV.UK."

[[scam_sites]]
domain = "application-eta.uk"
path = "/uk-eta-fees-processing-time/"
first_observed = "2026-07-14"
evidence = "Observed 2026-07-14: the pricing page listed totals of EUR 69 Regular, EUR 119 Priority, and EUR 169 Dedicated Agent, including handling fees of EUR 46, EUR 96, or EUR 146. GOV.UK charged £20 and stated that another website cannot provide a faster decision."

