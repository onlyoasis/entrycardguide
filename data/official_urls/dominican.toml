# Used by the is-ivisa layout. Three cases for "what happened to your money."
# Dominican is unusual: the E-Ticket is dual-purpose (entry + exit), so case 2
# centers on travelers paying twice when one ticket would cover both legs.
[[outcomes]]
case = "Case 1"
tag_en = "Most common"
tag_zh = "最常见"
tag_zh_hant = "最常見"
headline_en = "iVisa filed the real E-Ticket and kept the fee."
headline_zh = "iVisa 替你提交了真实 E-Ticket，把费用收走了。"
headline_zh_hant = "iVisa 替你提交了真實 E-Ticket，把費用收走了。"
body_en = "Your E-Ticket QR works at PUJ / SDQ / POP; you overpaid for a free form. Dispute the charge with your card issuer."
body_zh = "你的 E-Ticket 二维码在 PUJ / SDQ / POP 都能用；只是免费表单付了冤枉钱。和发卡行申诉这笔费用。"
body_zh_hant = "你的 E-Ticket QR Code 在 PUJ / SDQ / POP 都能用；只是免費表單付了冤枉錢。和發卡行申訴這筆費用。"

[[outcomes]]
case = "Case 2"
tag_en = "Watch for"
tag_zh = "需留意"
tag_zh_hant = "需留意"
headline_en = "iVisa charged you twice — once for arrival, once for departure."
headline_zh = "iVisa 收了你两次钱——入境一次、离境一次。"
headline_zh_hant = "iVisa 收了你兩次錢——入境一次、離境一次。"
body_en = "The official E-Ticket covers both legs of one trip in a single submission. If iVisa billed two charges, dispute both — one ticket would have sufficed."
body_zh = "官方 E-Ticket 一次提交就涵盖往返两程。iVisa 收了两笔的话，两笔都申诉——一张票就够。"
body_zh_hant = "官方 E-Ticket 一次提交就涵蓋往返兩程。iVisa 收了兩筆的話，兩筆都申訴——一張票就夠。"

[[outcomes]]
case = "Case 3"
tag_en = "Rare"
tag_zh = "罕见"
tag_zh_hant = "罕見"
headline_en = "iVisa filed nothing and you arrive without an E-Ticket."
headline_zh = "iVisa 什么也没提交，你抵达时没有 E-Ticket。"
headline_zh_hant = "iVisa 什麼也沒提交，你抵達時沒有 E-Ticket。"
body_en = "DGM lets you fill the form on a kiosk at arrivals, but it's slow. File at eticket.migracion.gob.do yourself before flying."
body_zh = "DGM 会让你在到达大厅自助机上现填，但很慢。出行前自己到 eticket.migracion.gob.do 提交。"
body_zh_hant = "DGM 會讓你在到達大廳自助機上現填，但很慢。出行前自己到 eticket.migracion.gob.do 提交。"

# Known scam / middleman domains (for scam-site shortcode)
# Every entry must:
#   1. Resolve via DNS (we audit this with `dig`)
#   2. Have documented evidence we have personally observed
#   3. Reference public news / government warnings where available
[[scam_sites]]
domain = "eticket-dominican.com"
first_observed = "2023-08-01"
evidence = "Observed 2026-07-24: sells a paid service for the free E-Ticket. Its footer states in Spanish that the site is not affiliated with the government and that an application can be submitted for less through the government website. Runs the same page template and disclaimer wording as mexicofmm.com and indonesia-evoa.com."

[[scam_sites]]
domain = "ivisa.com"
path = "/dominican-republic"
first_observed = "2023-06-01"
evidence = "Commercial visa middleman charging fees for the free E-Ticket."

