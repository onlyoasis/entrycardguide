# Bahamas Customs C17 — public portal and form-section fields.
# No [[errors]] array: the public pages expose no complete official error set.

[[fields]]
n = "01"
key = "traveller_route"
section_en = "Before the form · Check whether C17 is required"
section_zh = "填表前 · 判断是否需要 C17"
example = "Returning resident"
mistake = "Sending every visitor to C17"
mistake_why_en = "the government says a visitor with only used personal belongings makes an oral baggage declaration"
mistake_why_zh = "政府说明，只携带自用旧物的访客作口头行李申报"
copy_en = "Returning residents use C17 whether or not they have goods to declare. Visitors use it when bringing other items."
copy_zh = "返程居民无论有无物品都填 C17；访客携带自用旧物之外的物品时填写。"

[[fields]]
n = "02"
key = "passport_profile"
section_en = "Passenger Information"
section_zh = "旅客信息"
example = "Scan the passport used for arrival"
mistake = "Scanning a different passport"
mistake_why_en = "the portal requires passport information in the user profile before submission"
mistake_why_zh = "门户要求提交前在用户资料中扫描护照信息"
copy_en = "Scan the same valid passport that will be presented at the border."
copy_zh = "扫描入境时会出示的同一本有效护照。"

[[fields]]
n = "03"
key = "passenger_identity"
section_en = "Passenger Information"
section_zh = "旅客信息"
example = "Name from the scanned passport"
mistake = "Using a nickname"
mistake_why_en = "the declaration should match the travel document"
mistake_why_zh = "申报信息应与出行证件一致"
copy_en = "Compare the passenger details with the scanned passport. No public regex or name length is claimed."
copy_zh = "将旅客信息与扫描护照核对。公开页面没有姓名正则或长度规则，本页不编。"

[[fields]]
n = "04"
key = "passport_number"
section_en = "Passenger Information"
section_zh = "旅客信息"
example = "Number from the bio page"
mistake = "A number from another document"
mistake_why_en = "customs reviews the submission against the passport profile"
mistake_why_zh = "海关会按护照资料核对提交内容"
copy_en = "Use the passport number carried for this arrival."
copy_zh = "填写本次入境所持护照号码。"

[[fields]]
n = "05"
key = "residence_status"
section_en = "Passenger Information"
section_zh = "旅客信息"
example = "Visitor or returning resident"
mistake = "Choosing visitor to avoid C17"
mistake_why_en = "all returning residents are required to complete C17"
mistake_why_zh = "所有返程居民都必须填写 C17"
copy_en = "Answer the status truthfully; it controls the filing route."
copy_zh = "如实选择身份；它会影响申报路径。"

[[fields]]
n = "06"
key = "travel_information"
section_en = "Travel Information"
section_zh = "行程信息"
example = "Actual arriving flight or vessel"
mistake = "A departure after The Bahamas"
mistake_why_en = "the declaration is for this arrival"
mistake_why_zh = "这份申报对应本次抵达"
copy_en = "Enter the carrier and arrival details requested for this journey."
copy_zh = "填写本次行程所要求的承运人和抵达信息。"

[[fields]]
n = "07"
key = "baggage_information"
section_en = "Baggage Information"
section_zh = "行李信息"
example = "Baggage arriving with or for this passenger"
mistake = "Leaving out separately shipped baggage"
mistake_why_en = "customs needs the baggage attached to the arrival declaration"
mistake_why_zh = "海关需要核对与本次入境相关的行李"
copy_en = "Report the baggage requested by the live C17 section."
copy_zh = "按实时 C17 行李分段如实填写。"

[[fields]]
n = "08"
key = "invoice_information"
section_en = "Invoice Information"
section_zh = "发票信息"
example = "Receipt and purchase value"
mistake = "Discarding receipts before customs"
mistake_why_en = "the portal can upload purchase receipts and calculate duties"
mistake_why_zh = "门户支持上传购物收据并计算关税"
copy_en = "Keep readable receipts for goods being declared and enter their actual values."
copy_zh = "保留需申报物品的清晰收据，并填写真实价值。"

[[fields]]
n = "09"
key = "alcohol_information"
section_en = "Alcohol Information"
section_zh = "酒类信息"
example = "Actual amount carried"
mistake = "Omitting a bottle in checked baggage"
mistake_why_en = "the C17 has a dedicated alcohol section"
mistake_why_zh = "C17 有单独的酒类分段"
copy_en = "Report the amount carried wherever it is packed. No allowance number is invented here."
copy_zh = "无论装在哪里都如实申报携带量。本页不编免税数量。"

[[fields]]
n = "10"
key = "tobacco_information"
section_en = "Tobacco Information"
section_zh = "烟草信息"
example = "Actual amount carried"
mistake = "Assuming duty-free means no declaration"
mistake_why_en = "the C17 asks for tobacco information separately"
mistake_why_zh = "C17 单独询问烟草信息"
copy_en = "Report the actual tobacco amount. No allowance number is claimed without a current official quote."
copy_zh = "如实填写烟草数量。没有现行官方原文支持时，本页不写免税数量。"

[[fields]]
n = "11"
key = "customs_goods"
section_en = "Goods and declaration"
section_zh = "物品与申报"
example = "Every item beyond used personal belongings"
mistake = "Hiding goods to avoid duty"
mistake_why_en = "a visitor bringing other items must make a C17 baggage declaration"
mistake_why_zh = "访客携带其他物品时必须作 C17 行李申报"
copy_en = "Describe every applicable item and attach the available receipt. Customs duty, if any, is separate from the free form."
copy_zh = "描述所有适用物品并附现有收据。可能产生的关税与免费表单分开。"

[[fields]]
n = "12"
key = "submission_qr"
section_en = "Submission Information"
section_zh = "提交信息"
example = "Saved QR code"
mistake = "Closing before saving the QR"
mistake_why_en = "the portal says the QR is scanned in the designated Exempt lane"
mistake_why_zh = "门户说明要在 Exempt 指定通道扫描二维码"
copy_en = "Submit the C17, save the issued QR code and keep the same passport ready for customs review."
copy_zh = "提交 C17，保存生成的二维码，并准备同一本护照供海关核对。"
