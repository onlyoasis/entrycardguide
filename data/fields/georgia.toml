# Georgia e-Visa — preparation items from the live first screen and official FAQ.
# No [[errors]] array is included because later form error text was not readable.

[[fields]]
n = "01"
key = "visa_free_status"
section_en = "Section 1 · Need"
section_zh = "第 1 段 · 是否需要"
example = "Passport appears in the current ordinance"
mistake = "Starting the paid form first"
mistake_why_en = "many listed passports can stay without a visa for one full year"
mistake_why_zh = "名单内大量护照可免签停留完整一年"
copy_en = "Open the current government ordinance and find the passport country. If it is listed and the trip fits the rule, there is no e-Visa form to file."
copy_zh = "打开当前政府法令，查找护照签发国。名单内且行程符合规则，就没有 eVisa 表要填。"

[[fields]]
n = "02"
key = "citizenship"
section_en = "Section 1 · Need"
section_zh = "第 1 段 · 是否需要"
example = "Country shown on the passport"
mistake = "Country of residence"
mistake_why_en = "the portal checks the travel document, not where you live"
mistake_why_zh = "官网按旅行证件判断，不按居住地判断"
copy_en = "Choose citizenship according to the passport you will use at the border. Dual citizens should apply and travel with the same document."
copy_zh = "国籍按口岸会使用的护照选择。双重国籍旅客应使用同一本证件申请和出行。"

[[fields]]
n = "03"
key = "travel_document_type"
section_en = "Section 1 · Need"
section_zh = "第 1 段 · 是否需要"
example = "The exact passport type you will carry"
mistake = "A different document type"
mistake_why_en = "e-Visa eligibility is limited to the document types shown by the portal"
mistake_why_zh = "eVisa 资格受官网列出的证件类型限制"
copy_en = "Select the actual travel document. The information box says the e-Visa is available only to holders of the document types shown after this choice."
copy_zh = "选择实际携带的旅行证件。官网提示，只有下拉结果列出的证件类型才有 eVisa 资格。"

[[fields]]
n = "04"
key = "purpose_of_visit"
section_en = "Section 2 · Trip"
section_zh = "第 2 段 · 行程"
example = "The short-stay purpose supported by your evidence"
mistake = "A purpose that does not match the documents"
mistake_why_en = "purpose evidence may be checked at the border"
mistake_why_zh = "旅行目的证明可能在口岸被核对"
copy_en = "Choose the real purpose. The portal limits e-Visas to short stays of less than 90 days and asks for a document proving the purpose."
copy_zh = "选择真实目的。官网把 eVisa 限定为少于 90 天的短期访问，并要求准备旅行目的证明。"

[[fields]]
n = "05"
key = "passport_validity"
section_en = "Section 2 · Trip"
section_zh = "第 2 段 · 行程"
example = "Valid 3 months beyond the requested visa"
mistake = "Three months after arrival"
mistake_why_en = "the official buffer starts after the visa validity period"
mistake_why_zh = "官方余量从签证有效期结束后开始计算"
copy_en = "The passport must remain valid for at least 3 months after the requested visa expires. It also needs at least 2 free pages and must have been issued within the previous 10 years."
copy_zh = "护照要在所申请签证到期后至少再有效 3 个月，还要有至少 2 页空白页，并在过去 10 年内签发。"

[[fields]]
n = "06"
key = "photo"
section_en = "Section 3 · Uploads"
section_zh = "第 3 段 · 上传材料"
example = "Recent front-facing photo"
mistake = "Mobile snapshot"
mistake_why_en = "the FAQ expressly rejects mobile-device photos and document scans"
mistake_why_zh = "FAQ 明确拒绝手机随拍和从其他证件扫描的照片"
copy_en = "Use a photo taken within 6 months, facing the camera. The FAQ rejects snapshots, mobile-device photos and images copied from another official document."
copy_zh = "使用 6 个月内拍摄、正对镜头的照片。FAQ 明确不接受随拍、手机照片或从其他官方证件复制的图片。"

[[fields]]
n = "07"
key = "supporting_documents"
section_en = "Section 3 · Uploads"
section_zh = "第 3 段 · 上传材料"
example = "Readable passport PDF and trip evidence"
mistake = "Only a passport photo"
mistake_why_en = "the live checklist also asks for accommodation, ticket, insurance, funds and purpose"
mistake_why_zh = "实时清单还要求住宿、往返票、保险、资金和目的证明"
copy_en = "Prepare the passport as one PDF plus proof of accommodation, a round ticket, travel insurance, financial means and travel purpose. Add the supporting document when it applies to your route."
copy_zh = "把护照扫描成单个 PDF，并准备住宿、往返票、旅行保险、资金和旅行目的证明。适用时再附支持性证件。"

[[fields]]
n = "08"
key = "email_verification"
section_en = "Section 4 · Submit"
section_zh = "第 4 段 · 递交"
example = "Inbox available for the next 24 hours"
mistake = "An address you cannot open"
mistake_why_en = "the first verification expires in 1 hour and the second step arrives by email"
mistake_why_zh = "首封验证 1 小时失效，第二步也通过邮件发送"
copy_en = "Use an inbox you control. Verify the first message within 1 hour and pay within 5 hours of the payment notice."
copy_zh = "填写自己能登录的邮箱。首封邮件 1 小时内验证，付款通知送达后 5 小时内完成付款。"

[[fields]]
n = "09"
key = "duverify"
section_en = "Section 4 · Submit"
section_zh = "第 4 段 · 递交"
example = "Complete the emailed link within 24 hours"
mistake = "Stopping after the USD 20 payment"
mistake_why_en = "the live portal calls DuVerify a mandatory second step"
mistake_why_zh = "实时官网把 DuVerify 写成强制第二步"
copy_en = "After the first application and consular payment, follow the emailed DuVerify link within 24 hours. The portal lists an additional USD 15 fee for each applicant."
copy_zh = "完成第一段申请和领事费后，在 24 小时内打开邮件中的 DuVerify 链接。官网列明每位申请人另付 15 美元。"
