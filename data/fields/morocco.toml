# Morocco eVisa — eligibility and official briefing-note fields.
# No [[errors]] array: authenticated live validation error text is not public.

[[fields]]
n = "01"
key = "eligibility_result"
section_en = "Section 1 · Eligibility first"
section_zh = "第 1 段 · 资格优先"
section_zh_hant = "第 1 段 · 資格優先"
example = "No visa required"
mistake = "Opening eVisa before checking"
mistake_why_en = "the live checker may route the passport to no visa, a consulate or AEVM instead"
mistake_why_zh = "实时检查器可能把这本护照分流到免签、领馆或 AEVM"
mistake_why_zh_hant = "實時檢查器可能把這本護照分流到免簽、領館或 AEVM"
copy_en = "Run the live Accès Maroc checker. Stop if it says no visa is required; there is no paid eVisa form for that trip."
copy_zh = "先跑 Accès Maroc 实时检查器。结果为免签就停止，本次行程没有付费 eVisa 表要填。"
copy_zh_hant = "先跑 Accès Maroc 實時檢查器。結果為免簽就停止，本次行程沒有付費 eVisa 表要填。"

[[fields]]
n = "02"
key = "nationality"
section_en = "Section 1 · Eligibility first"
section_zh = "第 1 段 · 资格优先"
section_zh_hant = "第 1 段 · 資格優先"
example = "Citizenship of the travel passport"
mistake = "Country of residence"
mistake_why_en = "nationality and residence are separate checker questions"
mistake_why_zh = "国籍和居住国是检查器中的两个不同问题"
mistake_why_zh_hant = "國籍和居住國是檢查器中的兩個不同問題"
copy_en = "Select the nationality of the ordinary passport that will be presented at the border."
copy_zh = "选择入境时会出示的普通护照国籍。"
copy_zh_hant = "選擇入境時會出示的普通護照國籍。"

[[fields]]
n = "03"
key = "country_of_residence"
section_en = "Section 1 · Eligibility first"
section_zh = "第 1 段 · 资格优先"
section_zh_hant = "第 1 段 · 資格優先"
example = "Current country of usual residence"
mistake = "Passport country again"
mistake_why_en = "Category B depends on residence and a qualifying permit"
mistake_why_zh = "B 类资格取决于居住地和符合要求的居留许可"
mistake_why_zh_hant = "B 類資格取決於居住地和符合要求的居留許可"
copy_en = "Choose the current country of usual residence. If Category B is offered, prepare the qualifying residence card or permit."
copy_zh = "选择当前通常居住国。若检查器给出 B 类资格，准备符合要求的居留卡或许可。"
copy_zh_hant = "選擇當前通常居住國。若檢查器給出 B 類資格，準備符合要求的居留卡或許可。"

[[fields]]
n = "04"
key = "passport_type"
section_en = "Section 1 · Eligibility first"
section_zh = "第 1 段 · 资格优先"
section_zh_hant = "第 1 段 · 資格優先"
example = "Ordinary passport"
mistake = "Diplomatic passport"
mistake_why_en = "the eVisa terms accept ordinary passports only"
mistake_why_zh = "电子签条款只接受普通护照"
mistake_why_zh_hant = "電子簽條款只接受普通護照"
copy_en = "Use eVisa only with an ordinary passport. Other travel-document holders are directed to an embassy or consulate."
copy_zh = "电子签只接受普通护照。其他旅行证件持有人应转向使领馆。"
copy_zh_hant = "電子簽只接受普通護照。其他旅行證件持有人應轉向使領館。"

[[fields]]
n = "05"
key = "purpose"
section_en = "Section 1 · Eligibility first"
section_zh = "第 1 段 · 资格优先"
section_zh_hant = "第 1 段 · 資格優先"
example = "Tourism"
mistake = "Work"
mistake_why_en = "the eVisa is issued for Tourism or Business, not employment"
mistake_why_zh = "电子签用于旅游或商务，不是工作许可"
mistake_why_zh_hant = "電子簽用於旅遊或商務，不是工作許可"
copy_en = "Choose the real trip purpose and answer the separate event question. The current eVisa terms cover Tourism and Business."
copy_zh = "选择真实出行目的，并回答独立的活动问题。现行电子签条款覆盖旅游和商务。"
copy_zh_hant = "選擇真實出行目的，並回答獨立的活動問題。現行電子簽條款覆蓋旅遊和商務。"

[[fields]]
n = "06"
key = "supporting_status"
section_en = "Section 2 · Category evidence"
section_zh = "第 2 段 · 类别证明"
section_zh_hant = "第 2 段 · 類別證明"
example = "Eligible residence permit valid 180+ days"
mistake = "A renewal receipt"
mistake_why_en = "the terms reject receipts and require the qualifying document itself"
mistake_why_zh = "条款不接受回执，必须提供符合要求的证件本身"
mistake_why_zh_hant = "條款不接受回執，必須提供符合要求的證件本身"
copy_en = "Category B uses a qualifying residence card or permit valid at least 180 days. Category C uses an eligible multiple-entry non-electronic visa valid at least 90 days."
copy_zh = "B 类使用至少还有效 180 天的合资格居留卡或许可。C 类使用至少还有效 90 天的合资格多次非电子签证。"
copy_zh_hant = "B 類使用至少還有效 180 天的合資格居留卡或許可。C 類使用至少還有效 90 天的合資格多次非電子簽證。"

[[fields]]
n = "07"
key = "name_and_birth"
section_en = "Section 3 · Application"
section_zh = "第 3 段 · 申请资料"
section_zh_hant = "第 3 段 · 申請資料"
example = "Passport surname, given name and birth date"
mistake = "A nickname"
mistake_why_en = "the official note tells applicants to transcribe passport data correctly"
mistake_why_zh = "官方说明要求正确抄写护照资料"
mistake_why_zh_hant = "官方說明要求正確抄寫護照資料"
copy_en = "Copy surname, given name and date of birth from the ordinary passport used for travel."
copy_zh = "从本次出行使用的普通护照抄写姓、名和出生日期。"
copy_zh_hant = "從本次出行使用的普通護照抄寫姓、名和出生日期。"

[[fields]]
n = "08"
key = "document_details"
section_en = "Section 3 · Application"
section_zh = "第 3 段 · 申请资料"
section_zh_hant = "第 3 段 · 申請資料"
example = "Number and validity from each document"
mistake = "Expired supporting visa"
mistake_why_en = "eligibility depends on the document validity at application"
mistake_why_zh = "资格取决于提交申请时的证件有效期"
mistake_why_zh_hant = "資格取決於提交申請時的證件有效期"
copy_en = "Enter nationality, number and validity from the passport and any residence card or supporting visa used for eligibility."
copy_zh = "填写护照，以及用于资格认定的居留卡或附加签证的国籍、号码和有效期。"
copy_zh_hant = "填寫護照，以及用於資格認定的居留卡或附加簽證的國籍、號碼和有效期。"

[[fields]]
n = "09"
key = "email"
section_en = "Section 3 · Application"
section_zh = "第 3 段 · 申请资料"
section_zh_hant = "第 3 段 · 申請資料"
example = "One accessible email in both fields"
mistake = "Different confirmation spelling"
mistake_why_en = "the secure form link and tracking use this address"
mistake_why_zh = "安全表单链接和状态跟踪都使用这个地址"
mistake_why_zh_hant = "安全表單連結和狀態跟蹤都使用這個地址"
copy_en = "Enter and confirm one email you control. The portal sends a secure application link to it."
copy_zh = "填写并确认一个自己掌握的邮箱。门户会把安全申请链接发到这里。"
copy_zh_hant = "填寫並確認一個自己掌握的信箱。門戶會把安全申請連結發到這裡。"

[[fields]]
n = "10"
key = "photo"
section_en = "Section 4 · Attachments"
section_zh = "第 4 段 · 附件"
section_zh_hant = "第 4 段 · 附件"
example = "35 x 45 mm colour photo, under 6 months old"
mistake = "An old social-media photo"
mistake_why_en = "the official note requires a recent ICAO-style image"
mistake_why_zh = "官方说明要求近期 ICAO 规格照片"
mistake_why_zh_hant = "官方說明要求近期 ICAO 規格照片"
copy_en = "Use a good-quality 35 x 45 mm colour photo taken within the last 6 months with facial features clearly shown."
copy_zh = "使用 6 个月内拍摄的 35 × 45 毫米高质量彩色照片，面部特征要清晰。"
copy_zh_hant = "使用 6 個月內拍攝的 35 × 45 毫米高質量彩色照片，面部特徵要清晰。"

[[fields]]
n = "11"
key = "passport_copy"
section_en = "Section 4 · Attachments"
section_zh = "第 4 段 · 附件"
section_zh_hant = "第 4 段 · 附件"
example = "Clear colour identity and validity pages"
mistake = "A black-and-white crop"
mistake_why_en = "the terms require a clear colour copy showing identity and validity"
mistake_why_zh = "条款要求清晰彩色副本，并显示身份和有效期"
mistake_why_zh_hant = "條款要求清晰彩色副本，並顯示身份和有效期"
copy_en = "Attach clear colour copies of the valid ordinary passport pages that show identity and validity."
copy_zh = "上传有效普通护照中显示身份和有效期页面的清晰彩色副本。"
copy_zh_hant = "上傳有效普通護照中顯示身份和有效期頁面的清晰彩色副本。"

[[fields]]
n = "12"
key = "attachments"
section_en = "Section 4 · Attachments"
section_zh = "第 4 段 · 附件"
section_zh_hant = "第 4 段 · 附件"
example = "JPG, JPEG or PDF, no more than 1 MB"
mistake = "A 4 MB attachment"
mistake_why_en = "the official note caps each scanned attachment at 1 MB"
mistake_why_zh = "官方说明把扫描附件上限设为 1 MB"
mistake_why_zh_hant = "官方說明把掃描附件上限設為 1 MB"
copy_en = "Attach the Category B, Category C or Business evidence that applies. Scan as JPG, JPEG or PDF no larger than 1 MB."
copy_zh = "按实际类别上传 B 类、C 类或商务证明。扫描为 JPG、JPEG 或 PDF，不超过 1 MB。"
copy_zh_hant = "按實際類別上傳 B 類、C 類或商務證明。掃描為 JPG、JPEG 或 PDF，不超過 1 MB。"
