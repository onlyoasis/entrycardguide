# Indonesia e-CD — field-by-field display data for the how-to-fill layout.
# Bilingual fields use `_en` / `_zh`. `key` links to data/rules/indonesia.json
# for the validator regex / max length (single source of truth).

# Six high-error fields shown on the page; the form has 12 total
# (see meta.field_count in data/official_urls/indonesia.toml).

[[fields]]
n = "01"
key = "passport"
section_en = "Section 1 · Traveler identity"
section_zh = "第 1 段 · 旅客身份"
section_zh_hant = "第 1 段 · 旅客身份"
example = "A12345678"
mistake = "A 12345678"
mistake_why_en = "space — e-CD strips it on submit but the validator flags it first"
mistake_why_zh = "空格——e-CD 提交时会去掉但校验器会先标红"
mistake_why_zh_hant = "空格——e-CD 提交時會去掉但校驗器會先標紅"
copy_en = "The string next to \"Passport No.\" on the photo page. 6 to 12 alphanumeric characters. Do not paste from the MRZ at the bottom — those rows include check digits."
copy_zh = "护照照片页 \"Passport No.\" 那栏，6 到 12 位字母+数字。不要从底部 MRZ 复制——那两行包含校验位。"
copy_zh_hant = "護照照片頁 \"Passport No.\" 那欄，6 到 12 位字母+數字。不要從底部 MRZ 複製——那兩行包含校驗位。"

[[fields]]
n = "02"
key = "full_name"
section_en = "Section 1 · Traveler identity"
section_zh = "第 1 段 · 旅客身份"
section_zh_hant = "第 1 段 · 旅客身份"
example = "BUDI SANTOSO"
mistake = "Budi Santoso, S.E."
mistake_why_en = "academic titles (S.E., M.M.) not on passport — leave them out"
mistake_why_zh = "护照上没有的学位/职称（如 S.E.、M.M.）不要写"
mistake_why_zh_hant = "護照上沒有的學位/職稱（如 S.E.、M.M.）不要寫"
copy_en = "Single field — type your full name exactly as on the passport photo page. The form keeps letters and spaces only, in capitals. Leave out any academic or professional titles that aren't printed on the passport itself."
copy_zh = "单字段——完整名字按护照照片页原样填。表单只保留字母和空格，并转成大写。护照上没印的学位/职称不要加。"
copy_zh_hant = "單欄位——完整名字按護照照片頁原樣填。表單只保留字母和空格，並轉成大寫。護照上沒印的學位/職稱不要加。"

[[fields]]
n = "03"
key = "date_of_birth"
section_en = "Section 1 · Traveler identity"
section_zh = "第 1 段 · 旅客身份"
section_zh_hant = "第 1 段 · 旅客身份"
example = "22/08/1991"
mistake = "08/22/1991"
mistake_why_en = "US order — the All Indonesia date picker is DD/MM/YYYY"
mistake_why_zh = "美式顺序——All Indonesia 的日期选择器是 DD/MM/YYYY"
mistake_why_zh_hant = "美式順序——All Indonesia 的日期選擇器是 DD/MM/YYYY"
copy_en = "DD/MM/YYYY, as the date picker shows it. The calendar runs from January 1920 to today."
copy_zh = "DD/MM/YYYY，与日期选择器显示一致。日历范围是 1920 年 1 月到今天。"
copy_zh_hant = "DD/MM/YYYY，與日期選擇器顯示一致。日曆範圍是 1920 年 1 月到今天。"

[[fields]]
n = "04"
key = "flight_number"
section_en = "Section 2 · Trip"
section_zh = "第 2 段 · 行程"
section_zh_hant = "第 2 段 · 行程"
example = "GA715"
mistake = "GA 715"
mistake_why_en = "space in the flight code"
mistake_why_zh = "航班代码里有空格"
mistake_why_zh_hant = "航班代碼裡有空格"
copy_en = "Two boxes: the airline code (GA for Garuda Indonesia, QZ for AirAsia Indonesia, SQ, CX — up to 3 characters) and the flight number (up to 8), letters and digits. For small regional carriers the dropdown sometimes misses entries — type the number manually if the dropdown rejects a valid flight."
copy_zh = "分两格：航空公司代码（GA 鹰航、QZ 亚航印尼、SQ、CX，最多 3 个字符）和航班号（最多 8 个字符），字母和数字。小航司有时下拉漏掉，下拉拒了就手动键入。"
copy_zh_hant = "分兩格：航空公司代碼（GA 鷹航、QZ 亞航印尼、SQ、CX，最多 3 個字符）和航班號（最多 8 個字符），字母和數字。小航司有時下拉漏掉，下拉拒了就手動鍵入。"

[[fields]]
n = "05"
key = "arrival_date"
section_en = "Section 2 · Trip"
section_zh = "第 2 段 · 行程"
section_zh_hant = "第 2 段 · 行程"
example = "14/05/2026"
mistake = "13/05/2026"
mistake_why_en = "used departure date — use the date you land in Indonesia local time"
mistake_why_zh = "用了起飞日期——要用印尼本地落地日期"
mistake_why_zh_hant = "用了起飛日期——要用印尼本地落地日期"
copy_en = "Date you land in Indonesia, local time, as DD/MM/YYYY. The form offers yesterday, today and the next 2 days, so fill it in within 2 days of arrival. Bali red-eyes from Australia often roll into the next day, watch for that."
copy_zh = "在印尼本地时间落地的那天，格式 DD/MM/YYYY。表单提供昨天、今天和之后 2 天的选项，所以要在抵达前 2 天内填写。澳洲飞巴厘的红眼经常跨日，要留意。"
copy_zh_hant = "在印尼本地時間落地的那天，格式 DD/MM/YYYY。表單提供昨天、今天和之後 2 天的選項，所以要在抵達前 2 天內填寫。澳洲飛巴釐的紅眼經常跨日，要留意。"

[[fields]]
n = "06"
key = "accommodation"
section_en = "Section 3 · Stay in Indonesia"
section_zh = "第 3 段 · 印尼住宿"
section_zh_hant = "第 3 段 · 印尼住宿"
example = "JL. SUNSET ROAD NO. 89 KUTA"
mistake = "HOTEL INDIGO"
mistake_why_en = "typed into Name of Hotel but no result picked — the form stops with \"Name of Hotel is required\""
mistake_why_zh = "在 Name of Hotel 里打了字却没点选结果——表单会报 \"Name of Hotel is required\""
mistake_why_zh_hant = "在 Name of Hotel 裡打了字卻沒點選結果——表單會報 \"Name of Hotel is required\""
copy_en = "Pick Type of Accommodation first. Hotel: type 4+ characters of the name and pick a result; if it is not listed, choose the unlisted option, type the name and pick the city. Villa, Airbnb or a friend's home: pick Province and City, then type the street address. The address box has no length limit and keeps letters, digits, dots, hyphens and spaces only, in capitals, so commas and slashes disappear. For multiple stops, use the first place you stay."
copy_zh = "先选 Type of Accommodation。酒店：输入酒店名至少 4 个字符，再从结果里点选；找不到就选未列出酒店的选项，手动输入酒店名并选城市。别墅、Airbnb 或朋友家：先选 Province 和 City，再写街道地址。地址栏没有长度上限，只保留字母、数字、点、横线和空格并转成大写，逗号和斜杠会被删掉。多地行程填第一站住的地方。"
copy_zh_hant = "先選 Type of Accommodation。酒店：輸入酒店名至少 4 個字符，再從結果裡點選；找不到就選未列出酒店的選項，手動輸入酒店名並選城市。別墅、Airbnb 或朋友家：先選 Province 和 City，再寫街道地址。地址欄沒有長度上限，只保留字母、數字、點、橫線和空格並轉成大寫，逗號和斜槓會被刪掉。多地行程填第一站住的地方。"

[[errors]]
code = "Invalid passport number"
why_en = "Space, dash, or pasted from the MRZ. Use the short number above the MRZ."
why_zh = "空格、短横，或从 MRZ 复制。用 MRZ 上方的短号。"
why_zh_hant = "空格、短橫，或從 MRZ 複製。用 MRZ 上方的短號。"

[[errors]]
code = "Invalid date of arrival"
why_en = "Used MM/DD/YYYY or YYYY-MM-DD, or a date outside the offered range. Use the date picker; it fills DD/MM/YYYY."
why_zh = "用了 MM/DD/YYYY 或 YYYY-MM-DD，或日期不在可选范围内。用日期选择器，它会填成 DD/MM/YYYY。"
why_zh_hant = "用了 MM/DD/YYYY 或 YYYY-MM-DD，或日期不在可選範圍內。用日期選擇器，它會填成 DD/MM/YYYY。"

[[errors]]
code = "Flight number not recognized"
why_en = "Codeshare carrier mismatch. Check your boarding pass for the operating carrier. Small airlines sometimes drop from the dropdown — type manually."
why_zh = "代码共享航司不匹配。看登机牌上的 operating carrier。小航司有时下拉里没有——手动键入。"
why_zh_hant = "代碼共享航司不匹配。看登機牌上的 operating carrier。小航司有時下拉里沒有——手動鍵入。"

[[errors]]
code = "Email already submitted for this date"
why_en = "You filed for the same arrival date. Open the existing record by passport number — update it instead of refiling."
why_zh = "同一到达日期已经提交过。用护照号打开旧记录修改，别重新提交。"
why_zh_hant = "同一到達日期已經提交過。用護照號打開舊記錄修改，別重新提交。"

[[errors]]
code = "No QR after 1 hour"
why_en = "Check spam. Indonesian customs occasionally drops emails to Outlook.com — try refiling with a Gmail address as backup."
why_zh = "查垃圾箱。印尼海关有时给 Outlook.com 邮箱送不到——用 Gmail 重提一次作备份。"
why_zh_hant = "查垃圾箱。印尼海關有時給 Outlook.com 信箱送不到——用 Gmail 重提一次作備份。"
