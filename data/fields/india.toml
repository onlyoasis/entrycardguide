# India e-Arrival Card — field-by-field display data for the how-to-fill layout.

[[fields]]
n = "01"
key = "full_name"
section_en = "Section 1 · Identity"
section_zh = "第 1 段 · 身份"
section_zh_hant = "第 1 段 · 身份"
example = "TARO KEN YAMADA"
mistake = "TARO YAMADA"
mistake_why_en = "middle given name omitted"
mistake_why_zh = "漏填了护照上的中间名"
mistake_why_zh_hant = "漏填了護照上的中間名"
copy_en = "Copy the complete Latin-script name from the passport used for this trip. The form keeps letters and spaces only, up to 200 characters."
copy_zh = "按本次旅行使用的护照，填写完整 Latin 字母姓名。表单只保留字母和空格，最多 200 个字符。"
copy_zh_hant = "按本次旅行使用的護照，填寫完整 Latin 字母姓名。表單只保留字母和空格，最多 200 個字符。"

[[fields]]
n = "02"
key = "nationality"
section_en = "Section 1 · Identity"
section_zh = "第 1 段 · 身份"
section_zh_hant = "第 1 段 · 身份"
example = "Japan"
mistake = "Singapore"
mistake_why_en = "transit country selected instead of passport nationality"
mistake_why_zh = "把转机国家选成了护照国籍"
mistake_why_zh_hant = "把轉機國家選成了護照國籍"
copy_en = "Select the nationality or region of the passport presented at Indian immigration."
copy_zh = "选择入境印度时出示护照所载的国籍或地区。"
copy_zh_hant = "選擇入境印度時出示護照所載的國籍或地區。"

[[fields]]
n = "03"
key = "passport_number"
section_en = "Section 1 · Identity"
section_zh = "第 1 段 · 身份"
section_zh_hant = "第 1 段 · 身份"
example = "A12345678"
mistake = "A12345678<"
mistake_why_en = "MRZ filler mark copied with the passport number"
mistake_why_zh = "把机读区填充符和护照号一起复制了"
mistake_why_zh_hant = "把機讀區填充符和護照號一起複製了"
copy_en = "Copy only the passport number from the photo page: letters and digits, 6 to 15 characters. Do not add spaces or MRZ filler marks."
copy_zh = "只填写资料页上的护照号：字母和数字，6 到 15 位。不要加入空格或机读区填充符。"
copy_zh_hant = "只填寫資料頁上的護照號：字母和數字，6 到 15 位。不要加入空格或機讀區填充符。"

[[fields]]
n = "04"
key = "visa_or_oci_number"
section_en = "Section 1 · Identity"
section_zh = "第 1 段 · 身份"
section_zh_hant = "第 1 段 · 身份"
example = "ETA or OCI number"
mistake = "e-Arrival reference"
mistake_why_en = "arrival-card reference entered instead of visa, e-Visa, or OCI record"
mistake_why_zh = "把入境卡参考编号当成签证、e-Visa 或 OCI 编号"
mistake_why_zh_hant = "把入境卡參考編號當成簽證、e-Visa 或 OCI 編號"
copy_en = "Use the visa or e-Visa reference that permits this trip, or the OCI number if travelling as an OCI cardholder."
copy_zh = "签证旅客填写本次签证或 e-Visa 编号；OCI 持有人填写 OCI 编号。"
copy_zh_hant = "簽證旅客填寫本次簽證或 e-Visa 編號；OCI 持有人填寫 OCI 編號。"

[[fields]]
n = "05"
key = "purpose"
section_en = "Section 2 · Visit"
section_zh = "第 2 段 · 访问"
section_zh_hant = "第 2 段 · 訪問"
example = "Tourist"
mistake = "Business"
mistake_why_en = "business selected for a holiday trip"
mistake_why_zh = "旅游行程误选成商务"
mistake_why_zh_hant = "旅遊行程誤選成商務"
copy_en = "Choose the purpose that matches the travel permission and the activity planned in India."
copy_zh = "按旅行许可和在印度的实际活动选择访问目的。"
copy_zh_hant = "按旅行許可和在印度的實際活動選擇訪問目的。"

[[fields]]
n = "06"
key = "arrival_date"
section_en = "Section 2 · Visit"
section_zh = "第 2 段 · 访问"
section_zh_hant = "第 2 段 · 訪問"
example = "15/09/2026"
mistake = "14/09/2026"
mistake_why_en = "departure date entered instead of India arrival date"
mistake_why_zh = "填了出发日期，没有填抵达印度日期"
mistake_why_zh_hant = "填了出發日期，沒有填抵達印度日期"
copy_en = "Use the local date the flight reaches India, as DD/MM/YYYY — the format the form's label shows. The form's calendar offers only the next few days: today through 4 days ahead when checked on 15 October 2026."
copy_zh = "填写航班抵达印度的当地日期，格式 DD/MM/YYYY，与表单标签一致。表单日历只开放接下来几天：2026 年 10 月 15 日核对时为今天到 4 天后。"
copy_zh_hant = "填寫航班抵達印度的當地日期，格式 DD/MM/YYYY，與表單標籤一致。表單日曆只開放接下來幾天：2026 年 10 月 15 日核對時為今天到 4 天后。"

[[fields]]
n = "07"
key = "flight_number"
section_en = "Section 2 · Visit"
section_zh = "第 2 段 · 访问"
section_zh_hant = "第 2 段 · 訪問"
example = "AI302"
mistake = "Q7AB2C"
mistake_why_en = "booking reference entered instead of the arriving flight number"
mistake_why_zh = "把订位编号填成了抵达航班号"
mistake_why_zh_hant = "把訂位編號填成了抵達航班號"
copy_en = "Enter the airline code and number of the flight landing in India."
copy_zh = "填写落地印度航班的航空公司代码和航班号。"
copy_zh_hant = "填寫落地印度航班的航空公司代碼和航班號。"

[[fields]]
n = "08"
key = "countries_visited_last_6_days"
section_en = "Section 2 · Visit"
section_zh = "第 2 段 · 访问"
section_zh_hant = "第 2 段 · 訪問"
example = "Singapore, Thailand"
mistake = "No Country Visited"
mistake_why_en = "a recent stop outside India was omitted"
mistake_why_zh = "漏报了近 6 日内到过的国家"
mistake_why_zh_hant = "漏報了近 6 日內到過的國家"
copy_en = "Report every country requested for the previous 6 days. Select No Country Visited only when it is true."
copy_zh = "按官网要求申报过去 6 日到过的国家。确实没有时才选择 No Country Visited。"
copy_zh_hant = "按官網要求申報過去 6 日到過的國家。確實沒有時才選擇 No Country Visited。"

[[fields]]
n = "09"
key = "india_address"
section_en = "Section 3 · India address"
section_zh = "第 3 段 · 印度地址"
section_zh_hant = "第 3 段 · 印度地址"
example = "The Imperial, Janpath, New Delhi"
mistake = "Delhi"
mistake_why_en = "city entered without the hotel or street address"
mistake_why_zh = "只填了城市，没有酒店或街道地址"
mistake_why_zh_hant = "只填了城市，沒有酒店或街道地址"
copy_en = "Enter the first full hotel, host, or residence address in India. Up to 500 characters; the form drops anything other than letters, digits, spaces and - # @ : ( ) / . , & _"
copy_zh = "填写抵达后的第一个完整酒店、亲友或住所地址。最多 500 个字符；表单会删掉字母、数字、空格和 - # @ : ( ) / . , & _ 以外的字符。"
copy_zh_hant = "填寫抵達後的第一個完整酒店、親友或住所地址。最多 500 個字符；表單會刪掉字母、數字、空格和 - # @ : ( ) / . , & _ 以外的字符。"

[[fields]]
n = "10"
key = "state"
section_en = "Section 3 · India address"
section_zh = "第 3 段 · 印度地址"
section_zh_hant = "第 3 段 · 印度地址"
example = "Delhi"
mistake = "Uttar Pradesh"
mistake_why_en = "nearby state selected instead of the address jurisdiction"
mistake_why_zh = "选择了邻近邦，没有按住宿地址选择"
mistake_why_zh_hant = "選擇了鄰近邦，沒有按住宿地址選擇"
copy_en = "Select the state or union territory shown in the accommodation address."
copy_zh = "按住宿地址选择对应的邦或中央直辖区。"
copy_zh_hant = "按住宿地址選擇對應的邦或中央直轄區。"

[[fields]]
n = "11"
key = "district"
section_en = "Section 3 · India address"
section_zh = "第 3 段 · 印度地址"
section_zh_hant = "第 3 段 · 印度地址"
example = "New Delhi"
mistake = "Central Delhi"
mistake_why_en = "district guessed without checking the hotel address"
mistake_why_zh = "没有核对酒店地址，凭感觉选择了区"
mistake_why_zh_hant = "沒有核對酒店地址，憑感覺選擇了區"
copy_en = "Confirm the district with the hotel or host when it is not clear from the address."
copy_zh = "地址里看不出所属区时，向酒店或接待人确认。"
copy_zh_hant = "地址裡看不出所屬區時，向酒店或接待人確認。"

[[fields]]
n = "12"
key = "email"
section_en = "Section 4 · Contact"
section_zh = "第 4 段 · 联系方式"
section_zh_hant = "第 4 段 · 聯繫方式"
example = "travel@gmail.com"
mistake = "travel@gmial.com"
mistake_why_en = "domain typo may block the confirmation message"
mistake_why_zh = "邮箱域名拼错，可能收不到确认"
mistake_why_zh_hant = "信箱域名拼錯，可能收不到確認"
copy_en = "Use an inbox you control and check the domain before submitting."
copy_zh = "使用自己掌握的邮箱，提交前再核对一次域名。"
copy_zh_hant = "使用自己掌握的信箱，提交前再核對一次域名。"

[[fields]]
n = "13"
key = "contact_number"
section_en = "Section 4 · Contact"
section_zh = "第 4 段 · 联系方式"
section_zh_hant = "第 4 段 · 聯繫方式"
example = "81 · 9012345678"
mistake = "+81 90 1234 5678"
mistake_why_en = "code typed into the number box — the ISD code has its own box, and the number box takes 5 to 15 digits, no + or spaces"
mistake_why_zh = "把区号也打进了号码栏——国际区号另有一栏，号码栏只收 5 到 15 位数字，不能有 + 或空格"
mistake_why_zh_hant = "把區號也打進了號碼欄——國際區號另有一欄，號碼欄只收 5 到 15 位數字，不能有 + 或空格"
copy_en = "The form has an ISD code box (digits only, up to 4) and a number box (5 to 15 digits). Use a number where you can be reached."
copy_zh = "表单分国际区号栏（只收数字，最多 4 位）和号码栏（5 到 15 位数字）。填写可以联系到你的号码。"
copy_zh_hant = "表單分國際區號欄（只收數字，最多 4 位）和號碼欄（5 到 15 位數字）。填寫可以聯繫到你的號碼。"

[[fields]]
n = "14"
key = "emergency_contact_number"
section_en = "Section 4 · Contact"
section_zh = "第 4 段 · 联系方式"
section_zh_hant = "第 4 段 · 聯繫方式"
example = "81 · 8098765432"
mistake = "81 · 9012345678"
mistake_why_en = "traveller's own number repeated as the emergency contact"
mistake_why_zh = "把旅客本人的号码重复填成紧急联系人"
mistake_why_zh_hant = "把旅客本人的號碼重複填成緊急聯繫人"
copy_en = "If supplied, use a reachable emergency contact: the ISD code in its own box, then 5 to 15 digits."
copy_zh = "如填写，请使用能接通的紧急联系人号码：国际区号填在单独一栏，号码填 5 到 15 位数字。"
copy_zh_hant = "如填寫，請使用能接通的緊急聯繫人號碼：國際區號填在單獨一欄，號碼填 5 到 15 位數字。"

[[fields]]
n = "15"
key = "declaration"
section_en = "Section 5 · Declaration"
section_zh = "第 5 段 · 声明"
section_zh_hant = "第 5 段 · 聲明"
example = "Confirmed after review"
mistake = "Confirmed before checking"
mistake_why_en = "truth declaration accepted before the answers were reviewed"
mistake_why_zh = "没有核对答案就确认真实性声明"
mistake_why_zh_hant = "沒有核對答案就確認真實性聲明"
copy_en = "Confirm only after checking every answer. False information may lead to denial of entry or legal consequences."
copy_zh = "核对全部答案后再确认。虚假信息可能导致拒绝入境或法律后果。"
copy_zh_hant = "核對全部答案後再確認。虛假資訊可能導致拒絕入境或法律後果。"
