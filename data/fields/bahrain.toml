# Bahrain Visit eVisa — preparation items from public NPRA and government service pages.
# No [[errors]] array is included because later live-form error text was not publicly readable.

[[fields]]
n = "01"
key = "route_eligibility"
section_en = "Section 1 · Choose the route"
section_zh = "第 1 段 · 选择路径"
example = "Check both official eligibility lists"
mistake = "Assuming online eligibility and on-arrival eligibility are the same"
mistake_why_en = "NPRA publishes separate lists and applies conditions to each"
mistake_why_zh = "NPRA 分别发布两张名单，而且两边都有各自条件"
copy_en = "Check the official online-visa list and the separate visa-on-arrival list. A passport can follow one route, both routes or neither, subject to the conditions shown by NPRA."
copy_zh = "分别查看官方线上签证名单和落地签名单。同一本护照可能适用其中一条、两条或都不适用，最终以 NPRA 显示的条件为准。"

[[fields]]
n = "02"
key = "gcc_status"
section_en = "Section 1 · Choose the route"
section_zh = "第 1 段 · 选择路径"
example = "Current GCC permit or visit visa: Yes"
mistake = "Entering an expired GCC document"
mistake_why_en = "the live screen asks whether the permit or visit visa is current and valid"
mistake_why_zh = "实时页面问的是当前有效的 GCC 居留许可或访问签证"
copy_en = "Answer whether you hold a current valid residence permit or visit visa for a GCC country. If yes, select the country attached to that document."
copy_zh = "如实回答是否持有 GCC 国家当前有效的居留许可或访问签证。回答有时，再选择该证件所属国家。"

[[fields]]
n = "03"
key = "visit_purpose"
section_en = "Section 1 · Choose the route"
section_zh = "第 1 段 · 选择路径"
example = "Visit"
mistake = "Choosing a purpose only because it shows a cheaper product"
mistake_why_en = "the eligibility result depends on the real purpose"
mistake_why_zh = "资格结果取决于真实出行目的"
copy_en = "Choose the real purpose of the trip. The eligibility screen uses it before presenting available visa routes."
copy_zh = "选择真实出行目的。资格页会先读取这一项，再展示可用签证路径。"

[[fields]]
n = "04"
key = "detailed_purpose"
section_en = "Section 1 · Choose the route"
section_zh = "第 1 段 · 选择路径"
example = "Tourism with hotel accommodation"
mistake = "Writing details that conflict with the attachments"
mistake_why_en = "purpose, accommodation and return evidence should describe the same trip"
mistake_why_zh = "目的、住宿和返程材料应描述同一趟行程"
copy_en = "Select the detailed purpose and describe the actual visit. Keep it consistent with the hotel reservation, return ticket and any sponsor information."
copy_zh = "选择细分目的并描述真实行程。内容要与酒店预订、返程票及担保人信息一致。"

[[fields]]
n = "05"
key = "nationality"
section_en = "Section 1 · Choose the route"
section_zh = "第 1 段 · 选择路径"
example = "Nationality printed in the passport"
mistake = "Selecting country of residence"
mistake_why_en = "the live screen asks for nationality as shown in the passport"
mistake_why_zh = "实时页面要求按护照所示国籍填写"
copy_en = "Select nationality as shown in the passport you will use. Eligibility and the issued document are tied to that passport."
copy_zh = "按本次出行护照所示国籍选择。资格和签发文件都与这本护照绑定。"

[[fields]]
n = "06"
key = "visa_product"
section_en = "Section 2 · Product and attachments"
section_zh = "第 2 段 · 产品与材料"
example = "Two-week single-entry Visit eVisa"
mistake = "Choosing by duration without reading the eligibility result"
mistake_why_en = "the four published products have different eligibility, entry counts and fees"
mistake_why_zh = "四种公开产品的资格、入境次数和费用不同"
copy_en = "Choose only a product returned by the official eligibility tool. Current government pages describe a two-week single-entry product and three-month, one-year and five-year multiple-entry products."
copy_zh = "只选择官方资格工具返回的产品。当前政府页面列出两周单次，以及三个月、一年和五年多次产品。"

[[fields]]
n = "07"
key = "passport_copy"
section_en = "Section 2 · Product and attachments"
section_zh = "第 2 段 · 产品与材料"
example = "A clear copy of the travel passport"
mistake = "Uploading a cropped or unreadable page"
mistake_why_en = "the passport copy is a listed attachment and identifies the travel document"
mistake_why_zh = "护照副本是公开材料清单的一项，也用于识别出行证件"
copy_en = "Prepare a clear copy of the passport you will use to enter Bahrain. The NPRA FAQ says the same passport must be used for the application and arrival."
copy_zh = "准备本次进入巴林所用护照的清晰副本。NPRA FAQ 要求申请和抵达使用同一本护照。"

[[fields]]
n = "08"
key = "hotel_reservation"
section_en = "Section 2 · Product and attachments"
section_zh = "第 2 段 · 产品与材料"
example = "Hotel reservation covering the visit"
mistake = "Using a booking for different dates"
mistake_why_en = "the government service pages list the hotel reservation as an attachment"
mistake_why_zh = "政府服务页把酒店预订列为申请材料"
copy_en = "Prepare the hotel reservation listed by the visitor eVisa service. Its dates and guest details should match the application."
copy_zh = "准备访问电子签服务所列的酒店预订。日期和住客信息应与申请一致。"

[[fields]]
n = "09"
key = "return_ticket"
section_en = "Section 2 · Product and attachments"
section_zh = "第 2 段 · 产品与材料"
example = "Return booking matching the stated visit"
mistake = "Submitting an itinerary with unrelated dates"
mistake_why_en = "a return ticket is one of the published attachments"
mistake_why_zh = "返程票是公开材料清单中的一项"
copy_en = "Prepare the return ticket requested on the government service page. Check that the passenger name and dates describe the same trip as the application."
copy_zh = "准备政府服务页要求的返程票。核对乘客姓名和日期，确保与申请描述的是同一趟行程。"

[[fields]]
n = "10"
key = "bank_statement"
section_en = "Section 2 · Product and attachments"
section_zh = "第 2 段 · 产品与材料"
example = "Three months in English with the published means evidence"
mistake = "Uploading a statement with no readable balance or income"
mistake_why_en = "the service page states a financial-evidence test"
mistake_why_zh = "服务页列出了资金证明条件"
copy_en = "Prepare a 3-month statement in English. The covered government pages ask for regular income of BD 300 to BD 500 per month or funds equivalent to BD 150 for each day of the visit."
copy_zh = "准备英文版近 3 个月银行流水。这里覆盖的政府页面要求每月固定收入 300 至 500 巴林第纳尔，或按每天 150 巴林第纳尔准备等值资金。"

[[fields]]
n = "11"
key = "email_and_reference"
section_en = "Section 3 · Decision and retrieval"
section_zh = "第 3 段 · 决定与取回"
example = "An inbox you can access, plus the saved reference number"
mistake = "Deleting the reference email"
mistake_why_en = "NPRA emails the decision and uses the reference for status support"
mistake_why_zh = "NPRA 通过邮件通知决定，状态查询也要用申请编号"
copy_en = "Use an email account you control and save the application reference. NPRA emails the decision; approved applicants retrieve and print the eVisa through the official portal."
copy_zh = "使用自己能登录的邮箱，并保存申请编号。NPRA 通过邮件通知决定；获批后从官方门户取回并打印电子签。"
