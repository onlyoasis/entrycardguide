# Pakistan Visa Prior to Arrival — preparation fields from official notices and the mobile guide.
# No [[errors]] array: no official live-form validation error strings were publicly readable.

[[fields]]
n = "01"
key = "visa_route"
section_en = "Section 1 · Route and eligibility"
section_zh = "第 1 段 · 路径与资格"
example = "VPA-eligible passport"
mistake = "Applying before checking exemption"
mistake_why_en = "six GCC nationalities need no ETA or visa for tourism and business"
mistake_why_zh = "6 个海合会国家的公民因旅游或商务入境无需 ETA 或签证"
copy_en = "Check the passport route first. GCC citizens covered by the exemption need no form; current DGI&P guidance places 120 passport countries on the VPA route."
copy_zh = "先按护照判断路径。适用豁免的海合会国家公民无需填表；DGI&P 当前把 120 个护照国家纳入 VPA 路径。"

[[fields]]
n = "02"
key = "application_category"
section_en = "Section 1 · Route and eligibility"
section_zh = "第 1 段 · 路径与资格"
example = "Visa Prior to Arrival — Tourism"
mistake = "Regular tourist visa or business VPA"
mistake_why_en = "the portal separates product and purpose"
mistake_why_zh = "门户把产品和访问目的分开"
copy_en = "For this guide, choose Visa Prior to Arrival and Tourism. Do not select a regular online visa merely because both routes share the same portal."
copy_zh = "本指南对应 Visa Prior to Arrival 和 Tourism。不要因为两条路径共用门户，就误选常规在线签证。"

