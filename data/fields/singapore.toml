# Singapore SGAC — field-by-field display data for the how-to-fill layout.
# Bilingual fields use `_en` / `_zh`. `key` links to data/rules/singapore.json
# for the validator regex / max length (single source of truth).

# Seven high-error fields shown on the page; the form has 14 total
# (see meta.field_count in data/official_urls/singapore.toml).

[[fields]]
n = "01"
key = "passport"
section_en = "Section 1 · Passport"
section_zh = "第 1 段 · 护照"
section_zh_hant = "第 1 段 · 護照"
example = "A12345678"
mistake = "A12345678<"
mistake_why_en = "MRZ filler copied into the number"
mistake_why_zh = "把 MRZ 填充符复制进了号码"
mistake_why_zh_hant = "把 MRZ 填充符複製進了號碼"
copy_en = "Copy the passport number from your travel document. Check every character; do not append MRZ check digits or filler symbols."
copy_zh = "从旅行证件核对护照号，逐字符检查，不要附加 MRZ 校验位或填充符。"
copy_zh_hant = "從旅行證件核對護照號，逐字符檢查，不要附加 MRZ 校驗位或填充符。"

