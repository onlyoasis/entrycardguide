# Tanzania Online Visa — public start-screen and guideline fields.
# No [[errors]] array: later live-form error text was not read.

[[fields]]
n = "01"
key = "passport_route"
section_en = "Section 1 · Eligibility and visa type"
section_zh = "第 1 段 · 资格与签证类别"
example = "Check the current passport list"
mistake = "Starting before checking exemption"
mistake_why_en = "some passports need no visa and referral passports follow a slower approval route"
mistake_why_zh = "部分护照免签，转报审批护照还要走更慢的审批路径"
copy_en = "Use the current exemption and referral lists. Do not infer the route from residence or a second passport you will not carry."
copy_zh = "先查当前免签名单和转报审批名单。不要按居住地判断，也不要使用本次不会携带的第二本护照。"

[[fields]]
n = "02"
key = "visa_type"
section_en = "Section 1 · Eligibility and visa type"
section_zh = "第 1 段 · 资格与签证类别"
example = "Ordinary Visa for eligible tourism"
mistake = "Transit Visa for a holiday"
mistake_why_en = "Transit Visa is only for onward transit and cannot be used for tourism"
mistake_why_zh = "转机签只允许过境前往第三国，不能用于旅游"
copy_en = "Tourists normally choose Ordinary Visa. United States passport holders use Multiple Visa for tourism. Choose Transit only for onward travel to another country."
copy_zh = "旅游通常选择 Ordinary Visa。美国护照旅游需要选择 Multiple Visa。只有继续前往第三国时才选 Transit。"

[[fields]]
n = "03"
key = "email"
section_en = "Section 2 · Public start screen"
section_zh = "第 2 段 · 公开申请首屏"
example = "travel@example.com"
mistake = "An inbox you cannot open"
mistake_why_en = "the application ID and decision are sent by email"
mistake_why_zh = "申请编号和决定都通过邮件发送"
copy_en = "Use an address you control and check the spelling. The official HTML allows at most 100 characters."
copy_zh = "使用自己能登录的邮箱并核对拼写。官网 HTML 上限为 100 个字符。"

[[fields]]
n = "04"
key = "passport_number"
section_en = "Section 2 · Public start screen"
section_zh = "第 2 段 · 公开申请首屏"
example = "Number from the bio page"
mistake = "Number from another passport"
mistake_why_en = "the application and grant notice must match the travel document"
mistake_why_zh = "申请和批准通知必须与出行证件一致"
copy_en = "Copy the number from the passport you will carry. The public page publishes no character pattern, so this guide does not invent one."
copy_zh = "抄写本次会携带的护照号码。公开页面没有字符格式规则，本页不编造。"

[[fields]]
n = "05"
key = "passport_issue_country"
section_en = "Section 2 · Public start screen"
section_zh = "第 2 段 · 公开申请首屏"
example = "Country printed as issuer"
mistake = "Country of residence"
mistake_why_en = "the field asks who issued the passport, not where the applicant lives"
mistake_why_zh = "该项问护照签发国，不是申请人居住国"
copy_en = "Select the issuing country for the same passport number entered above."
copy_zh = "选择上一步那本护照的签发国。"

[[fields]]
n = "06"
key = "security_question"
section_en = "Section 2 · Public start screen"
section_zh = "第 2 段 · 公开申请首屏"
example = "A question with a stable answer"
mistake = "A fact likely to change"
mistake_why_en = "the answer is used to resume the application"
mistake_why_zh = "答案用于恢复申请"
copy_en = "Choose one of the portal questions and keep the exact question with the application ID."
copy_zh = "从门户提供的问题中选择一个，并把问题原文和申请编号一起保存。"

[[fields]]
n = "07"
key = "security_answer"
section_en = "Section 2 · Public start screen"
section_zh = "第 2 段 · 公开申请首屏"
example = "Exact answer saved privately"
mistake = "A different spelling later"
mistake_why_en = "the recovery screen expects the same answer"
mistake_why_zh = "恢复申请时需要输入同一个答案"
copy_en = "Use an answer you can reproduce exactly. The official HTML sets a 100-character maximum."
copy_zh = "填写以后能逐字复现的答案。官网 HTML 上限为 100 个字符。"

[[fields]]
n = "08"
key = "passport_validity"
section_en = "Section 3 · Documents"
section_zh = "第 3 段 · 材料"
example = "6+ months left and one unused visa page"
mistake = "No blank visa page"
mistake_why_en = "the guideline requires both validity and an unused page"
mistake_why_zh = "官方指南同时要求有效期和一页未使用签证页"
copy_en = "Before submitting, confirm at least six months of validity and at least one unused visa page."
copy_zh = "提交前确认护照至少还有 6 个月有效期，并至少留有一页未使用签证页。"

[[fields]]
n = "09"
key = "photo"
section_en = "Section 3 · Documents"
section_zh = "第 3 段 · 材料"
example = "Colour JPG, plain background, up to 500 KB"
mistake = "A 2 MB holiday photo"
mistake_why_en = "the guideline caps the image at 500 KB and requires a full-face passport photo"
mistake_why_zh = "官方上限为 500 KB，并要求正面证件照"
copy_en = "Use a colour full-face photo on a plain background. Maximum 45 mm by 35 mm, maximum 500 KB, JPG or JPEG."
copy_zh = "使用纯色背景的彩色正面照片。最大 45 × 35 毫米、最大 500 KB，格式为 JPG 或 JPEG。"

[[fields]]
n = "10"
key = "travel_document"
section_en = "Section 3 · Documents"
section_zh = "第 3 段 · 材料"
example = "Return ticket for Ordinary Visa"
mistake = "No onward proof for Transit"
mistake_why_en = "the required travel document depends on the visa type"
mistake_why_zh = "需要的行程材料取决于签证类别"
copy_en = "Ordinary Visa uses a return ticket. Transit Visa uses an entry visa and/or onward ticket for the destination country."
copy_zh = "普通签证准备返程票。转机签准备第三国入境签证和/或继续行程票。"
