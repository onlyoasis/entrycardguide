# Unified e-Visa — ministry conditions, application windows and photo rules.
# No [[errors]] array: the official pages publish no verbatim validation error text,
# and the application sits behind a personal-account login.
# Each key must exist in data/rules/russia.json.

[[fields]]
n = "01"
key = "eligibility"
section_en = "Section 1 · Route and eligibility"
section_zh = "第 1 段 · 路径与资格"
section_zh_hant = "第 1 段 · 路徑與資格"
example = "Passport appears on the 64-state list"
mistake = "Assuming a paper-visa passport can use the e-visa"
mistake_why_en = "the ministry lists exactly 64 states whose nationals can apply"
mistake_why_zh = "外交部列出的可申请国家正好是 64 个"
mistake_why_zh_hant = "外交部列出的可申請國家正好是 64 個"
copy_en = "Check the ministry's 64-state list for the passport you will carry before you create a personal account. A passport outside that list has to apply for a regular visa at a Russian diplomatic mission or consular post, and no online form exists for it."
copy_zh = "创建个人账户之前，先在外交部 64 国名单里查本次出行使用的护照。名单外的护照必须在俄罗斯驻外使领馆办理普通签证，没有线上表单可用。"
copy_zh_hant = "創建個人賬戶之前，先在外交部 64 國名單裡查本次出行使用的護照。名單外的護照必須在俄羅斯駐外使領館辦理普通簽證，沒有線上表單可用。"

[[fields]]
n = "02"
key = "entry_purpose"
section_en = "Section 1 · Route and eligibility"
section_zh = "第 1 段 · 路径与资格"
section_zh_hant = "第 1 段 · 路徑與資格"
example = "Tourism, or an invited business visit"
mistake = "Choosing transit as the purpose"
mistake_why_en = "the FAQ says there is no transit option in the application"
mistake_why_zh = "FAQ 说明申请表里没有过境这个选项"
mistake_why_zh_hant = "FAQ 說明申請表裡沒有過境這個選項"
copy_en = "The e-visa covers a private or business visit, tourism, and participation in scientific, cultural, socio-political, economic or sporting events. There is no transit purpose to select. Anything else needs a regular visa."
copy_zh = "统一电子签证覆盖私人或商务访问、旅游，以及参加科学、文化、社会政治、经济、体育活动。申请表里没有过境可选，其他目的必须办普通签证。"
copy_zh_hant = "統一電子簽證覆蓋私人或商務訪問、旅遊，以及參加科學、文化、社會政治、經濟、體育活動。申請表裡沒有過境可選，其他目的必須辦普通簽證。"

[[fields]]
n = "03"
key = "children"
section_en = "Section 1 · Route and eligibility"
section_zh = "第 1 段 · 路径与资格"
section_zh_hant = "第 1 段 · 路徑與資格"
example = "One application per child, even if listed in your passport"
mistake = "Adding a child to a parent's application"
mistake_why_en = "the ministry requires a separate e-visa for each minor child"
mistake_why_zh = "俄方要求每个未成年子女单独持有电子签证"
mistake_why_zh_hant = "俄方要求每個未成年子女單獨持有電子簽證"
copy_en = "Every minor child needs a separate application and a separate e-visa, even when the child is registered in your passport. Children under 6 on the date of submission pay no consular fee."
copy_zh = "每个未成年子女都要单独申请、单独持有电子签证，即使孩子登记在你的护照上。递交日不满 6 岁的儿童免收领事费。"
copy_zh_hant = "每個未成年子女都要單獨申請、單獨持有電子簽證，即使孩子登記在你的護照上。遞交日不滿 6 歲的兒童免收領事費。"

[[fields]]
n = "04"
key = "insurance"
section_en = "Section 1 · Route and eligibility"
section_zh = "第 1 段 · 路径与资格"
section_zh_hant = "第 1 段 · 路徑與資格"
example = "A policy valid in Russia for the whole stay"
mistake = "Leaving the insurance question empty and assuming refusal"
mistake_why_en = "the FAQ says missing insurance data alone is not a reason for refusal"
mistake_why_zh = "FAQ 说明仅缺保险信息不构成拒签理由"
mistake_why_zh_hant = "FAQ 說明僅缺保險資訊不構成拒簽理由"
copy_en = "Travellers on a unified e-visa must hold medical insurance valid in Russia for the whole stay. Some nationalities are exempt on the basis of reciprocity. The application asks about it, but the FAQ says missing insurance data alone is not a reason for refusal or for returning the application."
copy_zh = "持统一电子签证入境必须持有在俄罗斯全境、全程有效的医疗保险。部分国籍按对等原则免除此项。申请表会问到保险，但 FAQ 写明仅缺保险信息不会导致拒签或退回申请。"
copy_zh_hant = "持統一電子簽證入境必須持有在俄羅斯全境、全程有效的醫療保險。部分國籍按對等原則免除此項。申請表會問到保險，但 FAQ 寫明僅缺保險資訊不會導致拒簽或退回申請。"

[[fields]]
n = "05"
key = "payment"
section_en = "Section 1 · Route and eligibility"
section_zh = "第 1 段 · 路径与资格"
section_zh_hant = "第 1 段 · 路徑與資格"
example = "A card issued outside Russia"
mistake = "Trying to pay with a Russian bank card"
mistake_why_en = "the FAQ says Russian bank cards cannot be used"
mistake_why_zh = "FAQ 写明不能使用俄罗斯银行发行的银行卡"
mistake_why_zh_hant = "FAQ 寫明不能使用俄羅斯銀行發行的銀行卡"
copy_en = "The amount is shown only at the payment step. Invoices are issued in dirhams or yuan, and the FAQ says only cards issued by banks of other countries work. Confirmation takes 20 to 45 minutes, and the fee is not refunded whatever the outcome."
copy_zh = "具体金额只在付款这一步显示。账单以迪拉姆或人民币开具，FAQ 写明只能用其他国家银行发行的银行卡支付。付款确认需要 20 到 45 分钟，无论结果如何费用不退。"
copy_zh_hant = "具體金額只在付款這一步顯示。賬單以迪拉姆或人民幣開具，FAQ 寫明只能用其他國家銀行發行的銀行卡支付。付款確認需要 20 到 45 分鐘，無論結果如何費用不退。"

[[fields]]
n = "06"
key = "email"
section_en = "Section 2 · Account and documents"
section_zh = "第 2 段 · 账户与材料"
section_zh_hant = "第 2 段 · 賬戶與材料"
example = "A non-Gmail address you actually check"
mistake = "A Gmail address used once and never opened"
mistake_why_en = "the portal warns that Gmail delivery has been unstable and delayed"
mistake_why_zh = "门户提示 Gmail 投递不稳定且延迟"
mistake_why_zh_hant = "門戶提示 Gmail 投遞不穩定且延遲"
copy_en = "Progress and result notifications go to this address and to your personal account. The ministry asks applicants to use an alternative to Gmail because delivery has been unstable and delayed. You will need it to sign in and to track corrections."
copy_zh = "申请进度和结果会发送到这个邮箱，同时显示在个人账户里。俄方建议不要用 Gmail，因为投递不稳定且延迟。后续登录和修改申请都要用到它。"
copy_zh_hant = "申請進度和結果會發送到這個信箱，同時顯示在個人賬戶裡。俄方建議不要用 Gmail，因為投遞不穩定且延遲。後續登入和修改申請都要用到它。"

[[fields]]
n = "07"
key = "passport_number"
section_en = "Section 2 · Account and documents"
section_zh = "第 2 段 · 账户与材料"
section_zh_hant = "第 2 段 · 賬戶與材料"
example = "The number exactly as in the machine-readable zone"
mistake = "Retyping the number from a scanned copy with OCR errors"
mistake_why_en = "the passport must be machine-readable and is checked against the travel document"
mistake_why_zh = "护照必须机读，且号码要与出行护照逐项核对"
mistake_why_zh_hant = "護照必須機讀，且號碼要與出行護照逐項核對"
copy_en = "Type the number from the passport you will carry. The passport must be machine-readable. If the form rejects the number, the official advice is to write to evisa_info@kdmid.ru with a photo of the passport attached; the ministry does not publish the rule the field applies."
copy_zh = "填写出行时使用的那本护照的号码，护照必须机读。如果表单提示号码不符，官方做法是把护照照片发到 evisa_info@kdmid.ru；俄方没有公布该字段的校验规则。"
copy_zh_hant = "填寫出行時使用的那本護照的號碼，護照必須機讀。如果表單提示號碼不符，官方做法是把護照照片發到 evisa_info@kdmid.ru；俄方沒有公佈該欄位的校驗規則。"

[[fields]]
n = "08"
key = "passport_scan"
section_en = "Section 2 · Account and documents"
section_zh = "第 2 段 · 账户与材料"
section_zh_hant = "第 2 段 · 賬戶與材料"
example = "A JPEG of the passport data page"
mistake = "A PDF or a cropped screenshot"
mistake_why_en = "the ministry asks for a digital photo of the passport data in JPEG format"
mistake_why_zh = "俄方要求护照资料页为 JPEG 格式的数码照片"
mistake_why_zh_hant = "俄方要求護照資料頁為 JPEG 格式的數碼照片"
copy_en = "Prepare a digital photo of the passport data page in JPEG format, taken from the passport you will use at the border. Keep the whole data page in frame."
copy_zh = "准备一张护照资料页的 JPEG 数码照片，须与入境时使用的护照一致。资料页要完整入镜。"
copy_zh_hant = "準備一張護照資料頁的 JPEG 數碼照片，須與入境時使用的護照一致。資料頁要完整入鏡。"

[[fields]]
n = "09"
key = "face_photo"
section_en = "Section 2 · Account and documents"
section_zh = "第 2 段 · 账户与材料"
section_zh_hant = "第 2 段 · 賬戶與材料"
example = "35x45 ratio, face 70-80 percent of the frame"
mistake = "A shadowed or tilted holiday photo"
mistake_why_en = "the ministry publishes the full photo specification on the Instruction page"
mistake_why_zh = "俄方在 Instruction 页面公布了完整的照片规格"
mistake_why_zh_hant = "俄方在 Instruction 頁面公佈了完整的照片規格"
copy_en = "Use a photo taken within the last 6 months. Full face, neutral expression, plain light background, no shadows or flash reflections. It must be rectangular with a 35x45 aspect ratio, and the face must take up 70-80 percent of the photo."
copy_zh = "使用 6 个月内拍摄的照片。正脸、中性表情、浅色纯色背景、无阴影和反光。照片必须为矩形，比例 35x45，面部占画面 70% 到 80%。"
copy_zh_hant = "使用 6 個月內拍攝的照片。正臉、中性表情、淺色純色背景、無陰影和反光。照片必須為矩形，比例 35x45，面部佔畫面 70% 到 80%。"

[[fields]]
n = "10"
key = "passport_validity"
section_en = "Section 2 · Account and documents"
section_zh = "第 2 段 · 账户与材料"
section_zh_hant = "第 2 段 · 賬戶與材料"
example = "More than 6 months left from the day you apply"
mistake = "A passport that expires mid-trip"
mistake_why_en = "the rule counts from the date the application is submitted, not from entry"
mistake_why_zh = "有效期从递交申请当天起算，不是从入境日起算"
mistake_why_zh_hant = "有效期從遞交申請當天起算，不是從入境日起算"
copy_en = "The passport must be issued by your country of nationality and machine-readable, valid for at least 6 months from the date the application is submitted, with sufficient space for border crossing stamps. An application that fails this cannot be accepted for processing."
copy_zh = "护照必须由国籍国签发且机读，自递交申请之日起有效期至少 6 个月，并留有足够的盖验讫章空间。不符合就无法受理。"
copy_zh_hant = "護照必須由國籍國簽發且機讀，自遞交申請之日起有效期至少 6 個月，並留有足夠的蓋驗訖章空間。不符合就無法受理。"

[[fields]]
n = "11"
key = "entry_date"
section_en = "Section 3 · Dates and border"
section_zh = "第 3 段 · 日期与口岸"
section_zh_hant = "第 3 段 · 日期與口岸"
example = "10 days ahead, inside the 4-to-86-day window"
mistake = "Applying 2 days before the flight"
mistake_why_en = "applications close 4 days before entry and processing takes up to 4 calendar days"
mistake_why_zh = "申请须在入境前至少 4 天提交，审批最长 4 个日历日"
mistake_why_zh_hant = "申請須在入境前至少 4 天提交，審批最長 4 個日曆日"
copy_en = "The application can be submitted no earlier than 86 days and no later than 4 days before the expected entry date. Processing takes up to 4 calendar days and does not count the day of submission. The site's calculator asks for the date in DD.MM.YYYY format."
copy_zh = "申请可在预计入境日前 86 天到 4 天之间提交。审批最长 4 个日历日，提交当天不计入。官网计算器使用的日期格式是 DD.MM.YYYY。"
copy_zh_hant = "申請可在預計入境日前 86 天到 4 天之間提交。審批最長 4 個日曆日，提交當天不計入。官網計算器使用的日期格式是 DD.MM.YYYY。"

[[fields]]
n = "12"
key = "stay_length"
section_en = "Section 3 · Dates and border"
section_zh = "第 3 段 · 日期与口岸"
section_zh_hant = "第 3 段 · 日期與口岸"
example = "A 29-day trip, exit inside 120 days of issue"
mistake = "Counting 30 nights as 30 days of net hours"
mistake_why_en = "the ministry warns that the arrival day and the departure day both count"
mistake_why_zh = "俄方提示抵达日和离境日都要计入"
mistake_why_zh_hant = "俄方提示抵達日和離境日都要計入"
copy_en = "The stay may not exceed 30 days from the date of entry, and the exit date cannot be later than 120 days after the visa is issued. The ministry warns that the arrival day and the departure day both count, so 30 days is not 720 hours of net time. Its own visa calculator does the arithmetic."
copy_zh = "停留期自入境日起不超过 30 天，离境日不能晚于签证签发后 120 天。俄方提示抵达日和离境日都要计入，30 天不等于 720 小时的纯停留时间。官网自带计算器可以算。"
copy_zh_hant = "停留期自入境日起不超過 30 天，離境日不能晚於簽證簽發後 120 天。俄方提示抵達日和離境日都要計入，30 天不等於 720 小時的純停留時間。官網自帶計算器可以算。"

[[fields]]
n = "13"
key = "exit_checkpoint"
section_en = "Section 3 · Dates and border"
section_zh = "第 3 段 · 日期与口岸"
section_zh_hant = "第 3 段 · 日期與口岸"
example = "Pulkovo in, Pulkovo out"
mistake = "Arriving on an e-visa at a checkpoint outside the list"
mistake_why_en = "the e-visa is valid for entry and exit only at approved crossing points"
mistake_why_zh = "电子签证只能从名单内口岸入境和出境"
mistake_why_zh_hant = "電子簽證只能從名單內口岸入境和出境"
copy_en = "Entry and exit must both use crossing points on the government-approved list. The published list is grouped into air, road, rail, sea and pedestrian points, and includes Moscow's Vnukovo, Domodedovo, Sheremetyevo and Zhukovsky airports, Saint Petersburg Pulkovo and Vladivostok Knevichi. At least one listed road point, Ivangorod, is marked temporarily closed for reconstruction."
copy_zh = "入境和出境都必须使用政府批准的口岸名单。公布名单分为航空、公路、铁路、海运和步行口岸，包括莫斯科的伏努科沃、多莫杰多沃、谢列梅捷沃和茹科夫斯基机场，圣彼得堡普尔科沃，以及符拉迪沃斯托克克涅维奇机场。公路口岸伊万哥罗德标注因改建临时关闭。"
copy_zh_hant = "入境和出境都必須使用政府批准的口岸名單。公佈名單分為航空、公路、鐵路、海運和步行口岸，包括莫斯科的伏努科沃、多莫傑多沃、謝列梅捷沃和茹科夫斯基機場，聖彼得堡普爾科沃，以及符拉迪沃斯托克克涅維奇機場。公路口岸伊萬哥羅德標註因改建臨時關閉。"
