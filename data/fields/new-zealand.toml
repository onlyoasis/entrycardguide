# New Zealand NZTD — field-by-field display data for the how-to-fill layout.

[[fields]]
n = "01"
key = "passport_number"
section_en = "Section 1 · Passport"
section_zh = "第 1 段 · 护照"
section_zh_hant = "第 1 段 · 護照"
example = "A12345678"
mistake = "A12345678<"
mistake_why_en = "MRZ filler mark copied with the passport number"
mistake_why_zh = "把机读区填充符和护照号一起复制了"
mistake_why_zh_hant = "把機讀區填充符和護照號一起複製了"
copy_en = "Copy the number from the passport you will use to enter New Zealand: 3 to 9 letters and digits. Do not add spaces or MRZ filler marks."
copy_zh = "填写入境新西兰时使用的护照号：3 到 9 位字母和数字。不要加入空格或机读区填充符。"
copy_zh_hant = "填寫入境新西蘭時使用的護照號：3 到 9 位字母和數字。不要加入空格或機讀區填充符。"

[[fields]]
n = "02"
key = "passport_expiry"
section_en = "Section 1 · Passport"
section_zh = "第 1 段 · 护照"
section_zh_hant = "第 1 段 · 護照"
example = "2028-09-30"
mistake = "1991-08-22"
mistake_why_en = "date of birth entered instead of passport expiry"
mistake_why_zh = "把出生日期填进了护照到期日"
mistake_why_zh_hant = "把出生日期填進了護照到期日"
copy_en = "Match the passport expiry date. The pre-check takes it as YYYY-MM-DD. The NZTD read on 15 October 2026 did not ask for it."
copy_zh = "按护照填写到期日。预校验按 YYYY-MM-DD 填。2026 年 10 月 15 日核对时，NZTD 没有问这一项。"
copy_zh_hant = "按護照填寫到期日。預校驗按 YYYY-MM-DD 填。2026 年 10 月 15 日核對時，NZTD 沒有問這一項。"

[[fields]]
n = "03"
key = "family_name"
section_en = "Section 1 · Passport"
section_zh = "第 1 段 · 护照"
section_zh_hant = "第 1 段 · 護照"
example = "YAMADA"
mistake = "MR YAMADA"
mistake_why_en = "title added even though it is not part of the passport name"
mistake_why_zh = "护照姓名里没有头衔，却多填了 MR"
mistake_why_zh_hant = "護照姓名裡沒有頭銜，卻多填了 MR"
copy_en = "Enter every surname or family name in the English or Latin spelling shown on the passport: letters, spaces, hyphens and apostrophes, up to 39 characters. With only one name, it goes here."
copy_zh = "按护照上的英文或 Latin 拼写填写全部姓：字母、空格、连字号和撇号，最多 39 个字符。只有一个名字时填在这里。"
copy_zh_hant = "按護照上的英文或 Latin 拼寫填寫全部姓：字母、空格、連字號和撇號，最多 39 個字符。只有一個名字時填在這裡。"

[[fields]]
n = "04"
key = "given_names"
section_en = "Section 1 · Passport"
section_zh = "第 1 段 · 护照"
section_zh_hant = "第 1 段 · 護照"
example = "TARO KEN"
mistake = "TARO"
mistake_why_en = "middle given name omitted"
mistake_why_zh = "漏填了护照上的中间名"
mistake_why_zh_hant = "漏填了護照上的中間名"
copy_en = "Enter all given names from the passport used for the trip, including middle given names, up to 39 characters. The box is optional for people with a single name."
copy_zh = "填写本次旅行护照上的全部名，包括中间名，最多 39 个字符。只有单一名字的人可以留空。"
copy_zh_hant = "填寫本次旅行護照上的全部名，包括中間名，最多 39 個字符。只有單一名字的人可以留空。"

[[fields]]
n = "05"
key = "date_of_birth"
section_en = "Section 1 · Passport"
section_zh = "第 1 段 · 护照"
section_zh_hant = "第 1 段 · 護照"
example = "22 · Aug · 1991"
mistake = "22 · 08 · 1991"
mistake_why_en = "the month box takes the month's short name (Aug), not a number"
mistake_why_zh = "月份格要填英文月份缩写（Aug），不是数字"
mistake_why_zh_hant = "月份格要填英文月份縮寫（Aug），不是數字"
copy_en = "Three boxes on the NZTD: day, month (first three letters, e.g. Aug) and year. The pre-check above takes the same date as YYYY-MM-DD."
copy_zh = "NZTD 上是三格：日、月（英文前三个字母，例如 Aug）、年。上面的预校验按 YYYY-MM-DD 填同一个日期。"
copy_zh_hant = "NZTD 上是三格：日、月（英文前三個字母，例如 Aug）、年。上面的預校驗按 YYYY-MM-DD 填同一個日期。"

[[fields]]
n = "06"
key = "country_of_birth"
section_en = "Section 1 · Passport"
section_zh = "第 1 段 · 护照"
section_zh_hant = "第 1 段 · 護照"
example = "Japan"
mistake = "New Zealand"
mistake_why_en = "destination entered instead of country of birth"
mistake_why_zh = "把目的地填成了出生国家"
mistake_why_zh_hant = "把目的地填成了出生國家"
copy_en = "Use the country of birth requested by NZTD. Answers in the declaration must be in English."
copy_zh = "按 NZTD 要求填写出生国家。申报答案必须使用英文。"
copy_zh_hant = "按 NZTD 要求填寫出生國家。申報答案必須使用英文。"

[[fields]]
n = "07"
key = "nationality"
section_en = "Section 1 · Passport"
section_zh = "第 1 段 · 护照"
section_zh_hant = "第 1 段 · 護照"
example = "Japan"
mistake = "Singapore"
mistake_why_en = "transit country selected instead of passport nationality"
mistake_why_zh = "把转机国家选成了护照国籍"
mistake_why_zh_hant = "把轉機國家選成了護照國籍"
copy_en = "Select the nationality shown on the passport you will present when entering New Zealand."
copy_zh = "选择入境新西兰时出示的护照所载国籍。"
copy_zh_hant = "選擇入境新西蘭時出示的護照所載國籍。"

[[fields]]
n = "08"
key = "arrival_date"
section_en = "Section 2 · Travel"
section_zh = "第 2 段 · 行程"
section_zh_hant = "第 2 段 · 行程"
example = "2026-09-15"
mistake = "2026-09-14"
mistake_why_en = "departure date entered instead of New Zealand arrival date"
mistake_why_zh = "填了出发日期，没有填抵达新西兰日期"
mistake_why_zh_hant = "填了出發日期，沒有填抵達新西蘭日期"
copy_en = "Use the date the flight or vessel reaches New Zealand. Check the local arrival date across time zones. For flights the NZTD offers today, tomorrow and the day after (New Zealand time); a later arrival is too early to start."
copy_zh = "填写航班或船舶抵达新西兰的日期。跨时区旅行要核对当地抵达日。搭机时 NZTD 提供今天、明天、后天（新西兰时间）三个选项；更晚抵达的还不能开始填。"
copy_zh_hant = "填寫航班或船舶抵達新西蘭的日期。跨時區旅行要核對當地抵達日。搭機時 NZTD 提供今天、明天、後天（新西蘭時間）三個選項；更晚抵達的還不能開始填。"

[[fields]]
n = "09"
key = "arrival_method"
section_en = "Section 2 · Travel"
section_zh = "第 2 段 · 行程"
section_zh_hant = "第 2 段 · 行程"
example = "Air"
mistake = "Sea"
mistake_why_en = "sea selected for an arriving flight"
mistake_why_zh = "搭飞机抵达，却选择了海运"
mistake_why_zh_hant = "搭飛機抵達，卻選擇了海運"
copy_en = "Choose air or sea. NZTD then shows either flight fields or vessel and port fields."
copy_zh = "选择空路或海路。NZTD 会据此显示航班字段，或船舶与港口字段。"
copy_zh_hant = "選擇空路或海路。NZTD 會據此顯示航班欄位，或船舶與港口欄位。"

[[fields]]
n = "10"
key = "flight_number"
section_en = "Section 2 · Travel"
section_zh = "第 2 段 · 行程"
section_zh_hant = "第 2 段 · 行程"
example = "NZ1"
mistake = "ABC123"
mistake_why_en = "booking reference entered instead of the arriving flight number"
mistake_why_zh = "把订位编号填成了抵达航班号"
mistake_why_zh_hant = "把訂位編號填成了抵達航班號"
copy_en = "Air travellers should enter the flight that lands in New Zealand: the airline code and up to 4 digits, e.g. NZ1 or NZ 1. Sea travellers use the vessel and port questions instead."
copy_zh = "空路旅客填写落地新西兰的航班号：航空公司代码加最多 4 位数字，例如 NZ1 或 NZ 1。海路旅客改填船舶和港口问题。"
copy_zh_hant = "空路旅客填寫落地新西蘭的航班號：航空公司代碼加最多 4 位數字，例如 NZ1 或 NZ 1。海路旅客改填船舶和港口問題。"

[[fields]]
n = "11"
key = "email"
section_en = "Section 3 · Contact"
section_zh = "第 3 段 · 联系方式"
section_zh_hant = "第 3 段 · 聯繫方式"
example = "travel@gmail.com"
mistake = "travel@gmial.com"
mistake_why_en = "domain typo blocks the NZTD reference email"
mistake_why_zh = "域名拼错，收不到 NZTD 参考编号邮件"
mistake_why_zh_hant = "域名拼錯，收不到 NZTD 參考編號郵件"
copy_en = "Use an inbox you control and check the domain before continuing. NZTD sends the reference number here."
copy_zh = "使用自己掌握的邮箱，继续前核对域名。NZTD 会把参考编号发到这里。"
copy_zh_hant = "使用自己掌握的信箱，繼續前核對域名。NZTD 會把參考編號發到這裡。"

[[fields]]
n = "12"
key = "phone"
section_en = "Section 3 · Contact"
section_zh = "第 3 段 · 联系方式"
section_zh_hant = "第 3 段 · 聯繫方式"
example = "+81 · 90 1234 5678"
mistake = "+81 90 1234 5678"
mistake_why_en = "country code typed into the number box — it has its own box, and the number box rejects +"
mistake_why_zh = "把国家代码打进了号码栏——国家代码有单独一栏，号码栏不接受 +"
mistake_why_zh_hant = "把國家代碼打進了號碼欄——國家代碼有單獨一欄，號碼欄不接受 +"
copy_en = "Pick the country or region code in its own box, then the number: digits, spaces, dashes or one pair of brackets, at least 5 characters."
copy_zh = "先在单独一栏选国家或地区代码，再填号码：数字、空格、连字号或一对括号，至少 5 个字符。"
copy_zh_hant = "先在單獨一欄選國家或地區代碼，再填號碼：數字、空格、連字號或一對括號，至少 5 個字符。"

[[fields]]
n = "13"
key = "nz_address"
section_en = "Section 3 · Contact"
section_zh = "第 3 段 · 联系方式"
section_zh_hant = "第 3 段 · 聯繫方式"
example = "Hotel Britomart, Auckland"
mistake = "Auckland, Rotorua, Wellington"
mistake_why_en = "an itinerary entered instead of the first New Zealand address"
mistake_why_zh = "填了整段行程，没有填抵达后的第一个新西兰地址"
mistake_why_zh_hant = "填了整段行程，沒有填抵達後的第一個新西蘭地址"
copy_en = "Enter the full contact or residential address in New Zealand. If staying in several places, use the first address."
copy_zh = "填写新西兰的完整联系或居住地址。住多个地点时，填写第一个地址。"
copy_zh_hant = "填寫新西蘭的完整聯繫或居住地址。住多個地點時，填寫第一個地址。"

[[fields]]
n = "14"
key = "travel_history"
section_en = "Section 4 · Trip and status"
section_zh = "第 4 段 · 行程与身份"
section_zh_hant = "第 4 段 · 行程與身份"
example = "Japan, Singapore"
mistake = "Japan only"
mistake_why_en = "Singapore airport transit omitted from the last 30 days"
mistake_why_zh = "漏填了过去 30 天内在新加坡机场的过境"
mistake_why_zh_hant = "漏填了過去 30 天內在新加坡機場的過境"
copy_en = "List every country visited outside New Zealand during the previous 30 days, including transit stops."
copy_zh = "列出过去 30 天内到过的所有新西兰以外国家，包括转机或过境。"
copy_zh_hant = "列出過去 30 天內到過的所有新西蘭以外國家，包括轉機或過境。"

[[fields]]
n = "15"
key = "immigration_status"
section_en = "Section 4 · Trip and status"
section_zh = "第 4 段 · 行程与身份"
section_zh_hant = "第 4 段 · 行程與身份"
example = "I do not hold a visa and am applying for a visitor visa on arrival"
mistake = "New Zealand resident"
mistake_why_en = "status selected without holding the matching passport or visa"
mistake_why_zh = "没有对应护照或签证，却选择了新西兰居民身份"
mistake_why_zh_hant = "沒有對應護照或簽證，卻選擇了新西蘭居民身份"
copy_en = "Choose the option that matches your passport and current visa or residence documents. NZeTA and NZTD are separate requirements."
copy_zh = "按护照和当前签证或居留文件选择。NZeTA 与 NZTD 是两项独立要求。"
copy_zh_hant = "按護照和當前簽證或居留文件選擇。NZeTA 與 NZTD 是兩項獨立要求。"

[[fields]]
n = "16"
key = "restricted_items"
section_en = "Section 5 · Declarations"
section_zh = "第 5 段 · 申报"
section_zh_hant = "第 5 段 · 申報"
example = "Yes · NZD 12,000 cash"
mistake = "No"
mistake_why_en = "cash at or above NZD 10,000 not declared"
mistake_why_zh = "携带达到 10,000 新西兰元的现金，却选择了 No"
mistake_why_zh_hant = "攜帶達到 10,000 新西蘭元的現金，卻選擇了 No"
copy_en = "Answer each medicines, restricted-goods, allowance, business-goods, other-person, and cash question separately."
copy_zh = "逐项回答药品、限制品、免税额度、商用品、代他人携带物品和现金问题。"
copy_zh_hant = "逐項回答藥品、限制品、免稅額度、商用品、代他人攜帶物品和現金問題。"

[[fields]]
n = "17"
key = "biosecurity_items"
section_en = "Section 5 · Declarations"
section_zh = "第 5 段 · 申报"
section_zh_hant = "第 5 段 · 申報"
example = "Yes · packaged food"
mistake = "No, because it is sealed"
mistake_why_en = "packaged food treated as exempt from declaration"
mistake_why_zh = "因为食品有密封包装，就误以为不用申报"
mistake_why_zh_hant = "因為食品有密封包裝，就誤以為不用申報"
copy_en = "Declare food, animal or plant products, soil or water, used outdoor equipment, and relevant animal, farm, or wilderness contact. When unsure, declare it."
copy_zh = "申报食品、动植物制品、土壤或水、用过的户外装备，以及相关动物、农场或荒野接触。不确定时就申报。"
copy_zh_hant = "申報食品、動植物製品、土壤或水、用過的戶外裝備，以及相關動物、農場或荒野接觸。不確定時就申報。"

[[fields]]
n = "18"
key = "declaration"
section_en = "Section 5 · Declarations"
section_zh = "第 5 段 · 申报"
section_zh_hant = "第 5 段 · 申報"
example = "Confirmed after review"
mistake = "Confirmed before checking bags"
mistake_why_en = "legal declaration accepted before the answers were checked"
mistake_why_zh = "没有核对答案和行李，就确认了法律声明"
mistake_why_zh_hant = "沒有核對答案和行李，就確認了法律聲明"
copy_en = "Confirm only after reviewing every answer. If you change anything later, resubmit before passport control or border processing."
copy_zh = "核对全部答案后再确认。之后如有修改，要在护照查验或边境处理前重新提交。"
copy_zh_hant = "核對全部答案後再確認。之後如有修改，要在護照查驗或邊境處理前重新提交。"
