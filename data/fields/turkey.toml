# Turkey e-Visa — field-by-field display data for the how-to-fill layout.

[[fields]]
n = "01"
key = "nationality"
section_en = "Section 1 · Eligibility"
section_zh = "第 1 段 · 资格"
section_zh_hant = "第 1 段 · 資格"
example = "India"
mistake = "United Kingdom"
mistake_why_en = "country of residence selected instead of passport nationality"
mistake_why_zh = "把居住国选成了护照国籍"
mistake_why_zh_hant = "把居住國選成了護照國籍"
copy_en = "Choose the nationality or region of the passport used for travel. This answer controls exemption, eligibility, conditions, and price."
copy_zh = "选择本次旅行护照所载国籍或地区。该答案决定免签、申请资格、附加条件和费用。"
copy_zh_hant = "選擇本次旅行護照所載國籍或地區。該答案決定免簽、申請資格、附加條件和費用。"

[[fields]]
n = "02"
key = "travel_document_type"
section_en = "Section 1 · Eligibility"
section_zh = "第 1 段 · 资格"
section_zh_hant = "第 1 段 · 資格"
example = "Ordinary Passport"
mistake = "Official Passport"
mistake_why_en = "passport type guessed from the cover colour"
mistake_why_zh = "按封面颜色猜了护照类型"
mistake_why_zh_hant = "按封面顏色猜了護照類型"
copy_en = "Select the exact document type. Ordinary and official passports can have different visa rules."
copy_zh = "选择准确的证件类型。普通护照和公务类护照可能适用不同签证规则。"
copy_zh_hant = "選擇準確的證件類型。普通護照和公務類護照可能適用不同簽證規則。"

[[fields]]
n = "03"
key = "arrival_date"
section_en = "Section 1 · Eligibility"
section_zh = "第 1 段 · 资格"
section_zh_hant = "第 1 段 · 資格"
example = "15.09.2026"
mistake = "14.09.2026"
mistake_why_en = "departure date entered instead of Türkiye arrival date"
mistake_why_zh = "填了出发日期，没有填抵达土耳其日期"
mistake_why_zh_hant = "填了出發日期，沒有填抵達土耳其日期"
copy_en = "Use the planned first arrival date, DD.MM.YYYY as the e-Visa date picker writes it; the calendar starts at today. The e-Visa validity period starts from the date selected."
copy_zh = "填写计划首次抵达日期，格式 DD.MM.YYYY，与 e-Visa 日期选择器的写法一致；日历从今天开始。e-Visa 有效期从所选日期开始计算。"
copy_zh_hant = "填寫計劃首次抵達日期，格式 DD.MM.YYYY，與 e-Visa 日期選擇器的寫法一致；日曆從今天開始。e-Visa 有效期從所選日期開始計算。"

[[fields]]
n = "04"
key = "given_names"
section_en = "Section 2 · Applicant"
section_zh = "第 2 段 · 申请人"
section_zh_hant = "第 2 段 · 申請人"
example = "TARO KEN"
mistake = "TARO"
mistake_why_en = "middle given name omitted"
mistake_why_zh = "漏填了护照上的中间名"
mistake_why_zh_hant = "漏填了護照上的中間名"
copy_en = "Enter every given name from the passport, in the same order and spelling. Maximum 50 characters."
copy_zh = "按护照顺序和拼写填写全部名，最多 50 个字符。"
copy_zh_hant = "按護照順序和拼寫填寫全部名，最多 50 個字符。"

[[fields]]
n = "05"
key = "surname"
section_en = "Section 2 · Applicant"
section_zh = "第 2 段 · 申请人"
section_zh_hant = "第 2 段 · 申請人"
example = "YAMADA"
mistake = "MR YAMADA"
mistake_why_en = "title added even though it is not part of the passport surname"
mistake_why_zh = "护照姓氏里没有头衔，却多填了 MR"
mistake_why_zh_hant = "護照姓氏裡沒有頭銜，卻多填了 MR"
copy_en = "Copy the surname from the passport. Leave it blank only if the passport has no surname. Maximum 50 characters."
copy_zh = "按护照填写姓。护照确实没有姓时才留空，最多 50 个字符。"
copy_zh_hant = "按護照填寫姓。護照確實沒有姓時才留空，最多 50 個字符。"

[[fields]]
n = "06"
key = "date_of_birth"
section_en = "Section 2 · Applicant"
section_zh = "第 2 段 · 申请人"
section_zh_hant = "第 2 段 · 申請人"
example = "22.08.1991"
mistake = "08.22.1991"
mistake_why_en = "month and day swapped — the date picker writes day.month.year"
mistake_why_zh = "月和日填反了——日期选择器的写法是 日.月.年"
mistake_why_zh_hant = "月和日填反了——日期選擇器的寫法是 日.月.年"
copy_en = "Match the passport date. DD.MM.YYYY, as the e-Visa date picker writes it; the pre-check above takes the same."
copy_zh = "日期要和护照一致。格式 DD.MM.YYYY，与 e-Visa 日期选择器一致；上面的预校验也按这个格式。"
copy_zh_hant = "日期要和護照一致。格式 DD.MM.YYYY，與 e-Visa 日期選擇器一致；上面的預校驗也按這個格式。"

