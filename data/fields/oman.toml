# Oman eVisa — decision and preparation items from current official pages.
# No [[errors]] array is included because the login-gated form's error text was not readable.

[[fields]]
n = "01"
key = "visa_exemption"
section_en = "Section 1 · Need"
section_zh = "第 1 段 · 是否需要"
section_zh_hant = "第 1 段 · 是否需要"
example = "First-list passport, trip of 14 days or less"
mistake = "Opening a paid eVisa first"
mistake_why_en = "more than 100 countries and regions have a current 14-day exemption route"
mistake_why_zh = "当前有 100 多个国家和地区可走 14 天免签路径"
mistake_why_zh_hant = "當前有 100 多個國家和地區可走 14 天免簽路徑"
copy_en = "Check the Foreign Ministry's current two lists. First-group visitors use the exemption directly. Second-group visitors need the extra qualifying visa or residence status listed on the page. GCC citizens need no visa."
copy_zh = "查看外交部当前两组名单。第一组可直接使用免签；第二组还要满足页面列出的签证或居留条件。海合会国家公民无需签证。"
copy_zh_hant = "查看外交部當前兩組名單。第一組可直接使用免簽；第二組還要滿足頁面列出的簽證或居留條件。海合會國家公民無需簽證。"

[[fields]]
n = "02"
key = "nationality"
section_en = "Section 1 · Need"
section_zh = "第 1 段 · 是否需要"
section_zh_hant = "第 1 段 · 是否需要"
example = "Nationality printed in the passport"
mistake = "Country of residence"
mistake_why_en = "the ROP wizard asks for nationality as shown in the passport"
mistake_why_zh = "皇家警察向导要求按护照所示国籍选择"
mistake_why_zh_hant = "皇家警察嚮導要求按護照所示國籍選擇"
copy_en = "Choose the nationality printed in the passport. The wizard uses it to decide which unsponsored visas, if any, are available."
copy_zh = "选择护照上印出的国籍。向导会据此判断可用的无担保签证类型。"
copy_zh_hant = "選擇護照上印出的國籍。嚮導會據此判斷可用的無擔保簽證類型。"

[[fields]]
n = "03"
key = "gcc_residency"
section_en = "Section 1 · Need"
section_zh = "第 1 段 · 是否需要"
section_zh_hant = "第 1 段 · 是否需要"
example = "No, or the actual GCC country of residence"
mistake = "Yes, because of a short visit to Dubai"
mistake_why_en = "the question is about current residence status, not itinerary"
mistake_why_zh = "问题问的是当前居留身份，不是行程"
mistake_why_zh_hant = "問題問的是當前居留身份，不是行程"
copy_en = "Answer whether you currently reside in Bahrain, Kuwait, Qatar, Saudi Arabia or the UAE. If yes, select the country shown on the residence permit."
copy_zh = "回答你当前是否居住在巴林、科威特、卡塔尔、沙特或阿联酋。选择“是”时，再按居留许可选择国家。"
copy_zh_hant = "回答你當前是否居住在巴林、科威特、卡塔爾、沙特或阿聯酋。選擇“是”時，再按居留許可選擇國家。"

[[fields]]
n = "04"
key = "visa_subtype"
section_en = "Section 1 · Need"
section_zh = "第 1 段 · 是否需要"
section_zh_hant = "第 1 段 · 是否需要"
example = "Subtype shown by the eligibility result"
mistake = "A product copied from another traveller"
mistake_why_en = "the fee, stay and conditions depend on the entered answers"
mistake_why_zh = "费用、停留期和条件取决于本人的回答"
mistake_why_zh_hant = "費用、停留期和條件取決於本人的回答"
copy_en = "Use only a subtype shown in your result. The same result page supplies its fee, stay duration and conditions."
copy_zh = "只选择本人结果页显示的签证类型。该结果还会给出费用、停留期和条件。"
copy_zh_hant = "只選擇本人結果頁顯示的簽證類型。該結果還會給出費用、停留期和條件。"

[[fields]]
n = "05"
key = "passport_validity"
section_en = "Section 2 · Files"
section_zh = "第 2 段 · 文件"
section_zh_hant = "第 2 段 · 文件"
example = "At least 6 months before entry"
mistake = "Five months remaining"
mistake_why_en = "the ROP FAQ states a 6-month minimum"
mistake_why_zh = "皇家警察 FAQ 规定至少 6 个月"
mistake_why_zh_hant = "皇家警察 FAQ 規定至少 6 個月"
copy_en = "Check the expiry date before starting. The FAQ says a normal passport should be valid for at least 6 months before entering Oman."
copy_zh = "开始前先看护照到期日。FAQ 写明，普通护照在进入阿曼前应至少还有 6 个月有效期。"
copy_zh_hant = "開始前先看護照到期日。FAQ 寫明，普通護照在進入阿曼前應至少還有 6 個月有效期。"

[[fields]]
n = "06"
key = "passport_scan"
section_en = "Section 2 · Files"
section_zh = "第 2 段 · 文件"
section_zh_hant = "第 2 段 · 文件"
example = "Readable passport file under 512 KB"
mistake = "1.4 MB scan"
mistake_why_en = "the FAQ caps passport uploads at 512 KB"
mistake_why_zh = "FAQ 把护照上传上限设为 512 KB"
mistake_why_zh_hant = "FAQ 把護照上傳上限設為 512 KB"
copy_en = "Prepare a readable passport file no larger than 512 KB. Compress carefully so the name, number and dates remain legible."
copy_zh = "准备不超过 512 KB 的清晰护照文件。压缩后仍要能看清姓名、号码和日期。"
copy_zh_hant = "準備不超過 512 KB 的清晰護照文件。壓縮後仍要能看清姓名、號碼和日期。"

[[fields]]
n = "07"
key = "personal_photo"
section_en = "Section 2 · Files"
section_zh = "第 2 段 · 文件"
section_zh_hant = "第 2 段 · 文件"
example = "Photo file under 512 KB"
mistake = "900 KB photo"
mistake_why_en = "the published limit also applies to the picture"
mistake_why_zh = "公开的 512 KB 上限也适用于照片"
mistake_why_zh_hant = "公開的 512 KB 上限也適用於照片"
copy_en = "Keep the picture upload at or below 512 KB. The public FAQ does not expose a pixel size or regex, so this guide does not invent one."
copy_zh = "照片文件保持在 512 KB 以内。公开 FAQ 没写像素尺寸或正则，本页不补造。"
copy_zh_hant = "照片文件保持在 512 KB 以內。公開 FAQ 沒寫像素尺寸或正則，本頁不補造。"

[[fields]]
n = "08"
key = "email"
section_en = "Section 3 · Submit"
section_zh = "第 3 段 · 递交"
section_zh_hant = "第 3 段 · 遞交"
example = "Inbox available before travel"
mistake = "An address you cannot open"
mistake_why_en = "the receipt, application copy and approved eVisa are sent there"
mistake_why_zh = "收据、申请副本和获批电子签都发到这里"
mistake_why_zh_hant = "收據、申請副本和獲批電子簽都發到這裡"
copy_en = "Use an inbox you control and check the spelling. The ROP sends the payment receipt and application copy there, and emails the electronic visa if approved."
copy_zh = "填写自己能登录的邮箱，并核对拼写。皇家警察会把付款收据、申请副本和获批电子签发到这里。"
copy_zh_hant = "填寫自己能登入的信箱，並核對拼寫。皇家警察會把付款收據、申請副本和獲批電子簽發到這裡。"

[[fields]]
n = "09"
key = "application_timing"
section_en = "Section 3 · Submit"
section_zh = "第 3 段 · 递交"
section_zh_hant = "第 3 段 · 遞交"
example = "At least 4 days before arrival"
mistake = "The evening before travel"
mistake_why_en = "ROP recommends a 4-day lead and says processing varies"
mistake_why_zh = "皇家警察建议提前 4 天，并说明审理时间会变化"
mistake_why_zh_hant = "皇家警察建議提前 4 天，並說明審理時間會變化"
copy_en = "Lodge at least 4 days before arrival. This is a recommendation, not a guaranteed maximum processing time; some applications take longer."
copy_zh = "至少在抵达前 4 天递交。这是建议，不是最长审理时限保证；部分申请会更久。"
copy_zh_hant = "至少在抵達前 4 天遞交。這是建議，不是最長審理時限保證；部分申請會更久。"
