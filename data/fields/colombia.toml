# Colombia Check-Mig — current public form labels and official service guide.
# No readable regexes, maxlengths or field-level validation attributes were available.

[[fields]]
n = "01"
key = "journey_direction"
section_en = "Step 1 · Type of journey"
section_zh = "第 1 步 · 行程方向"
example = "I travel to Colombia"
mistake = "Choosing exit for an arriving trip"
mistake_why_en = "the pre-registration would describe the wrong immigration movement"
mistake_why_zh = "预登记会对应错误的入境或出境方向"
copy_en = "Choose whether this movement is into Colombia or out of Colombia. Check-Mig covers both directions, but the current registration must match the trip being taken."
copy_zh = "选择本次是进入哥伦比亚还是离开哥伦比亚。Check-Mig 同时服务入境和出境，但当前登记必须对应本次方向。"

[[fields]]
n = "02"
key = "transport_type"
section_en = "Step 1 · Type of journey"
section_zh = "第 1 步 · 行程方向"
example = "Air"
mistake = "Air for a maritime arrival"
mistake_why_en = "the transport choice changes the trip information requested"
mistake_why_zh = "交通方式会改变后续要求的行程资料"
copy_en = "Select the transport actually used. The live form displays air, land, maritime and river options."
copy_zh = "选择实际交通方式。实时表单显示航空、陆路、海运和河运选项。"

[[fields]]
n = "03"
key = "checkpoint"
section_en = "Step 2 · Travel information"
section_zh = "第 2 步 · 行程信息"
example = "The airport or checkpoint on the itinerary"
mistake = "The traveller's home city"
mistake_why_en = "the field identifies the Colombian immigration checkpoint"
mistake_why_zh = "该栏要识别哥伦比亚移民检查口岸"
copy_en = "Choose the immigration checkpoint used for this entry or exit. For an air trip, use the airport where Colombian immigration control occurs."
copy_zh = "选择本次入境或出境使用的移民检查口岸。乘飞机时，填写接受哥伦比亚移民检查的机场。"

[[fields]]
n = "04"
key = "travel_date"
section_en = "Step 2 · Travel information"
section_zh = "第 2 步 · 行程信息"
example = "08/30/2026"
mistake = "30/08/2026 typed into the visible US-style control"
mistake_why_en = "the live travel-date prompt displays mm/dd/yyyy"
mistake_why_zh = "实时旅行日期控件显示 mm/dd/yyyy"
copy_en = "Use the date for this immigration movement. The visible control displays mm/dd/yyyy. File no earlier than 72 hours before travel and no later than one hour before."
copy_zh = "填写本次移民通关日期。可见控件显示 mm/dd/yyyy。最早提前 72 小时，最晚在出行前 1 小时提交。"

[[fields]]
n = "05"
key = "flight_number"
section_en = "Step 2 · Travel information"
section_zh = "第 2 步 · 行程信息"
example = "1234"
mistake = "AV1234"
mistake_why_en = "the live CheckMig label asks for the flight number without letters"
mistake_why_zh = "实时 CheckMig 字段明确要求航班号不含字母"
copy_en = "For air travel, enter the numeric flight number without the airline letters, following the live label. Use the current operating itinerary."
copy_zh = "航空行程按实时字段要求，只填不含航司字母的数字航班号，并以当前实际承运行程为准。"

[[fields]]
n = "06"
key = "biographical_information"
section_en = "Step 3 · Personal data"
section_zh = "第 3 步 · 个人资料"
example = "Details from the travel document"
mistake = "Details copied from an expired document"
mistake_why_en = "immigration control uses the document carried for this trip"
mistake_why_zh = "移民检查使用的是本次携带的旅行证件"
copy_en = "Copy the biographical details from the valid passport or other travel document used for this movement. Visa information is separate and appears when applicable."
copy_zh = "按本次使用的有效护照或其他旅行证件抄写个人资料。需要签证时，签证信息另行填写。"

[[fields]]
n = "07"
key = "contact_information"
section_en = "Step 3 · Personal data"
section_zh = "第 3 步 · 个人资料"
example = "An email available during travel"
mistake = "An inbox controlled by a form seller"
mistake_why_en = "the official confirmation goes to the traveller's contact email"
mistake_why_zh = "官方确认会发送到旅客填写的联系邮箱"
copy_en = "Use contact details available during the trip. Migración Colombia sends the confirmation by email and provides an official download tool if the message is missing."
copy_zh = "使用旅途中能访问的联系方式。Migración Colombia 会发送确认邮件；邮件缺失时可用官网工具下载。"

[[fields]]
n = "08"
key = "travel_purpose"
section_en = "Step 3 · Personal data"
section_zh = "第 3 步 · 个人资料"
example = "The actual purpose of this trip"
mistake = "Tourism selected for a paid work trip"
mistake_why_en = "Check-Mig information must be truthful and does not replace the visa required for an activity"
mistake_why_zh = "Check-Mig 资料必须真实，也不能替代某项活动所需的签证"
copy_en = "Select the real purpose. Check-Mig preloads interview data; it does not grant permission for work, study or another visa-controlled activity."
copy_zh = "选择真实目的。Check-Mig 只预载问询资料，不会授予工作、学习或其他受签证约束活动的许可。"

[[fields]]
n = "09"
key = "accommodation"
section_en = "Step 4 · Accommodation"
section_zh = "第 4 步 · 住宿"
example = "Current lodging in Colombia"
mistake = "A hotel from a previous trip"
mistake_why_en = "the official service asks for accommodation details for the current trip when applicable"
mistake_why_zh = "官网要求在适用时填写本次行程的住宿资料"
copy_en = "For an entry where accommodation applies, use the current lodging details in Colombia. Follow the live form when this section changes for the selected route."
copy_zh = "入境且需要住宿资料时，填写本次在哥伦比亚的住宿。所选行程导致该段变化时，以实时表单为准。"

[[fields]]
n = "10"
key = "health_information"
section_en = "Step 5 · Questions"
section_zh = "第 5 步 · 问题"
example = "Current truthful answers"
mistake = "Answers reused from an older registration"
mistake_why_en = "the questions belong to the current movement and may change"
mistake_why_zh = "问题对应当前行程，且内容可能变化"
copy_en = "Answer the current health questions truthfully. Do not rely on an old screenshot; read the live questions shown for this trip."
copy_zh = "如实回答当前健康问题。不要照抄旧截图，以本次行程显示的实时问题为准。"
