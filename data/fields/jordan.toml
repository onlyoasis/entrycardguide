# Jordan Pass — live purchase form (buynow.aspx) and the pass conditions.
# Error codes below are strings that appear on the live form page, read 2026-08-30.
# Each key must exist in data/rules/jordan.json.

[[fields]]
n = "01"
key = "eligibility"
section_en = "Section 1 · Route and pass conditions"
section_zh = "第 1 段 · 路径与通票条件"
section_zh_hant = "第 1 段 · 路徑與通票條件"
example = "Ordinary passport not on the Interior Ministry restricted list"
mistake = "Buying a pass for a nationality it is not sold to"
mistake_why_en = "the FAQ says the pass is not available for Arabic nationality holders"
mistake_why_zh = "FAQ 写明约旦通票不向阿拉伯国籍持有人发售"
mistake_why_zh_hant = "FAQ 寫明約旦通票不向阿拉伯國籍持有人發售"
copy_en = "Check the passport first. The Interior Ministry lists 53 restricted nationalities that need prior approval, the FAQ lists South Africa, Malaysia, Hong Kong, Japan and Vatican City as exempt from visa fees, and arriving at Aqaba Airport is a separate rule for non-restricted nationalities. Do all of this before paying for anything."
copy_zh = "先查护照。内政部列出 53 个需事先批准的受限国籍，FAQ 列出南非、马来西亚、香港、日本和梵蒂冈免签证费，而从安曼阿利亚皇后机场以外的阿卡巴机场入境另有规定。付款之前先把这些查清楚。"
copy_zh_hant = "先查護照。內政部列出 53 個需事先批准的受限國籍，FAQ 列出南非、馬來西亞、香港、日本和梵蒂岡免簽證費，而從安曼阿利亞皇后機場以外的阿卡巴機場入境另有規定。付款之前先把這些查清楚。"

[[fields]]
n = "02"
key = "buy_before_arrival"
section_en = "Section 1 · Route and pass conditions"
section_zh = "第 1 段 · 路径与通票条件"
section_zh_hant = "第 1 段 · 路徑與通票條件"
example = "Purchased online before the flight"
mistake = "Buying the pass after landing"
mistake_why_en = "the terms say buying after arrival does not allow the visa exemption"
mistake_why_zh = "条款写明抵达后才购买不能享受签证费减免"
mistake_why_zh_hant = "條款寫明抵達後才購買不能享受簽證費減免"
copy_en = "Buy the pass before you enter Jordan. A purchase made after arrival still gets you into the sites, but the JD 40 visa fee is no longer waived."
copy_zh = "在进入约旦之前完成购买。落地后再买仍可进景点，但 40 约旦第纳尔的签证费不再减免。"
copy_zh_hant = "在進入約旦之前完成購買。落地後再買仍可進景點，但 40 約旦第納爾的簽證費不再減免。"

[[fields]]
n = "03"
key = "nights_minimum"
section_en = "Section 1 · Route and pass conditions"
section_zh = "第 1 段 · 路径与通票条件"
section_zh_hant = "第 1 段 · 路徑與通票條件"
example = "2 whole nights (3 days) or more"
mistake = "A one-night stopover"
mistake_why_en = "the FAQ says the waiver needs a minimum of 2 whole nights and the exit system checks it"
mistake_why_zh = "FAQ 写明至少要住 2 个整晚，出境系统会核对"
mistake_why_zh_hant = "FAQ 寫明至少要住 2 個整晚，出境系統會核對"
copy_en = "The waiver needs a minimum of 2 whole nights (3 days). The FAQ says you do not have to prove it in advance: the immigration system checks the nights when you leave, and short stays are sent to an office to pay."
copy_zh = "签证费减免要求至少住 2 个整晚（3 天）。FAQ 说明无需提前证明：出境时移民系统会核对晚数，不足者会被引导到办公室补缴。"
copy_zh_hant = "簽證費減免要求至少住 2 個整晚（3 天）。FAQ 說明無需提前證明：出境時移民系統會核對晚數，不足者會被引導到辦公室補繳。"

[[fields]]
n = "04"
key = "visa_fee_covered"
section_en = "Section 1 · Route and pass conditions"
section_zh = "第 1 段 · 路径与通票条件"
section_zh_hant = "第 1 段 · 路徑與通票條件"
example = "Single-entry tourist visa on arrival"
mistake = "Expecting the JD 60 or JD 120 embassy visa to be covered"
mistake_why_en = "the FAQ says the pass waives only a single entry visa fee"
mistake_why_zh = "FAQ 写明通票只免单次入境签证费"
mistake_why_zh_hant = "FAQ 寫明通票只免單次入境簽證費"
copy_en = "The pass waives the single-entry visa fee only. The Tourism Ministry prices that visa at JD 40 for one month on arrival at the airport, while JD 60 double-entry and JD 120 multiple-entry visas come from an embassy and are not covered."
copy_zh = "通票只免单次入境签证费。旅游部定价为落地机场停留 1 个月 40 约旦第纳尔；60 约旦第纳尔的两次入境和 120 约旦第纳尔的多次入境签证需在使馆办理，不在减免范围。"
copy_zh_hant = "通票只免單次入境簽證費。旅遊部定價為落地機場停留 1 個月 40 約旦第納爾；60 約旦第納爾的兩次入境和 120 約旦第納爾的多次入境簽證需在使館辦理，不在減免範圍。"

[[fields]]
n = "05"
key = "full_name"
section_en = "Section 2 · Buyer details"
section_zh = "第 2 段 · 购买人信息"
section_zh_hant = "第 2 段 · 購買人資訊"
example = "Name exactly as in the passport"
mistake = "A nickname or a shortened form"
mistake_why_en = "officers check the pass against the passport at the visa office and at site entrances"
mistake_why_zh = "官员会在签证办公室和景点入口把通票与护照核对"
mistake_why_zh_hant = "官員會在簽證辦公室和景點入口把通票與護照核對"
copy_en = "Copy the name from the passport you will present at the border. The field allows 100 characters and the form shows Full name required when it is empty."
copy_zh = "按入境时出示的护照抄姓名。该字段上限 100 字符，留空时表单提示 Full name required。"
copy_zh_hant = "按入境時出示的護照抄姓名。該欄位上限 100 字符，留空時表單提示 Full name required。"

[[fields]]
n = "06"
key = "email"
section_en = "Section 2 · Buyer details"
section_zh = "第 2 段 · 购买人信息"
section_zh_hant = "第 2 段 · 購買人資訊"
example = "The inbox you check before the trip"
mistake = "A work address you cannot open while travelling"
mistake_why_en = "the pass is delivered as a PDF and an image to this address"
mistake_why_zh = "通票以 PDF 和图片发送到这个邮箱"
mistake_why_zh_hant = "通票以 PDF 和圖片發送到這個信箱"
copy_en = "Use an inbox you can open on the road. The field allows 100 characters, and the page validator rejects a malformed address with Not Valid Email. The FAQ says to check the spam folder if nothing arrives."
copy_zh = "用一个旅途中能打开的邮箱。字段上限 100 字符，格式不对时页面校验提示 Not Valid Email。FAQ 建议收不到时先查垃圾邮件。"
copy_zh_hant = "用一個旅途中能打開的信箱。欄位上限 100 字符，格式不對時頁面校驗提示 Not Valid Email。FAQ 建議收不到時先查垃圾郵件。"

[[fields]]
n = "07"
key = "confirm_email"
section_en = "Section 2 · Buyer details"
section_zh = "第 2 段 · 购买人信息"
section_zh_hant = "第 2 段 · 購買人資訊"
example = "The same address typed again"
mistake = "A typo that still looks like an email"
mistake_why_en = "the form compares the two fields before payment"
mistake_why_zh = "表单在付款前会比较两个字段"
mistake_why_zh_hant = "表單在付款前會比較兩個欄位"
copy_en = "Type the same address twice. A mismatch stops the purchase, and a wrong but matching pair sends your pass to someone else's inbox."
copy_zh = "两次输入同一个地址。不一致会卡住购买流程；而两个一致但错误的地址会把通票发到别人的邮箱。"
copy_zh_hant = "兩次輸入同一個地址。不一致會卡住購買流程；而兩個一致但錯誤的地址會把通票發到別人的信箱。"

[[fields]]
