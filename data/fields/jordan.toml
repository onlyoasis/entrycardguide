mistake_why_zh = "该字段必填，校验提示 Telephone is required"
mistake_why_zh_hant = "該欄位必填，校驗提示 Telephone is required"
copy_en = "Enter a number that can receive a call while you are travelling, with the country code. The field allows 150 characters."
copy_zh = "填写旅途中能接通的电话号码，并带国家区号。该字段上限 150 字符。"
copy_zh_hant = "填寫旅途中能接通的電話號碼，並帶國家區號。該欄位上限 150 字符。"

[[fields]]
