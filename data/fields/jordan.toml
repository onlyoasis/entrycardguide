[[fields]]
n = "15"
key = "ticket_type"
section_en = "Section 4 · Ticket and delivery"
section_zh = "第 4 段 · 票种与交付"
section_zh_hant = "第 4 段 · 票種與交付"
example = "Jordan Wanderer - 70JD"
mistake = "Paying JD 80 for a one-day Petra visit"
mistake_why_en = "the packages differ only in consecutive Petra days: 1, 2 or 3"
mistake_why_zh = "三档票的差别只在佩特拉连续入场天数：1 天、2 天或 3 天"
mistake_why_zh_hant = "三檔票的差別只在佩特拉連續入場天數：1 天、2 天或 3 天"
copy_en = "Choose Wanderer (JD 70, 1 day in Petra), Explorer (JD 75, 2 consecutive days) or Expert (JD 80, 3 consecutive days). Petra days must be consecutive, Petra by Night is not included, and the pass scans only at the Petra Visitor's Center."
copy_zh = "选择 Wanderer（70 约旦第纳尔，佩特拉 1 天）、Explorer（75，连续 2 天）或 Expert（80，连续 3 天）。佩特拉入场日必须连续，佩特拉之夜不含在内，且通票只能在佩特拉游客中心扫码。"
copy_zh_hant = "選擇 Wanderer（70 約旦第納爾，佩特拉 1 天）、Explorer（75，連續 2 天）或 Expert（80，連續 3 天）。佩特拉入場日必須連續，佩特拉之夜不含在內，且通票只能在佩特拉遊客中心掃碼。"

