mistake_why_zh = "下拉项必填，未选择时提示 Purpose visit is required"
mistake_why_zh_hant = "下拉項必填，未選擇時提示 Purpose visit is required"
copy_en = "Choose the option that matches the trip. The dropdown includes Medical treatment, Wellness Spa, Walking Hiking Biking, Business, Religious, Experiencing local culture, Visit historical sites and Extreme Adventure."
copy_zh = "选择与行程相符的选项。下拉列表包含就医、水疗、徒步骑行、商务、宗教、体验当地文化、参观历史古迹和极限探险等。"
copy_zh_hant = "選擇與行程相符的選項。下拉列表包含就醫、水療、徒步騎行、商務、宗教、體驗當地文化、參觀歷史古蹟和極限探險等。"

[[fields]]
