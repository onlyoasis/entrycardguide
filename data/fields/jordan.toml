copy_zh = "按实际预订的住宿类型选择。选项从五星酒店到一星酒店，另有 Airbnb 和酒店式公寓。"
copy_zh_hant = "按實際預訂的住宿類型選擇。選項從五星酒店到一星酒店，另有 Airbnb 和酒店式公寓。"

[[fields]]
