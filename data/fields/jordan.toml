copy_zh_hant = "選擇實際停留的省。列表包含安曼、伊爾比德、扎爾卡、巴爾卡、馬弗拉克、卡拉克、塔菲拉、馬安、馬代巴、傑拉什、阿杰隆和亞喀巴。"

