# Sri Lanka ETA — preparation checks drawn from public Department of
# Immigration and Emigration pages. The live form publishes no readable
# validation attributes, so this file contains no [[errors]] array.
# Each `key` must exist in data/rules/sri-lanka.json.

[[fields]]
n = "01"
key = "fee_category"
section_en = "Section 1 · Fee and eligibility"
section_zh = "第 1 段 · 费用与资格"
section_zh_hant = "第 1 段 · 費用與資格"
example = "Free-scheme passport, fee shows zero"
mistake = "Paying a quoted price without checking"
mistake_why_en = "40 nationalities plus Maldives, Seychelles and Singapore currently pay nothing"
mistake_why_zh = "40 个国籍加马尔代夫、塞舌尔、新加坡当前费用为零"
mistake_why_zh_hant = "40 個國籍加馬爾代夫、塞舌爾、新加坡當前費用為零"
copy_en = "Check the fee for your exact passport before paying anyone. Since 25 May 2026 the tourist ETA is free for 40 named nationalities plus Maldives, Seychelles and Singapore. Free still means you apply for the ETA."
copy_zh = "付款前先核对自己护照的费用。2026 年 5 月 25 日起，40 个国籍加马尔代夫、塞舌尔、新加坡的旅游 ETA 免费。免费仍然要申请 ETA。"
copy_zh_hant = "付款前先核對自己護照的費用。2026 年 5 月 25 日起，40 個國籍加馬爾代夫、塞舌爾、新加坡的旅遊 ETA 免費。免費仍然要申請 ETA。"

[[fields]]
n = "02"
key = "nationality"
section_en = "Section 1 · Fee and eligibility"
section_zh = "第 1 段 · 费用与资格"
section_zh_hant = "第 1 段 · 費用與資格"
example = "As printed in the travel document"
mistake = "Country of residence"
mistake_why_en = "the fee and the permitted stay follow the document, not where you live"
mistake_why_zh = "费用和停留期按证件判断，不按居住地"
mistake_why_zh_hant = "費用和停留期按證件判斷，不按居住地"
copy_en = "Enter nationality exactly as written in the travel document. Maldivian nationals in the free scheme receive 90 days. Other free-scheme tourists receive 30 days and double entry."
copy_zh = "国籍按旅行证件原样填写。免费方案中的马尔代夫国民可停留 90 天，其他免费方案旅客为 30 天、两次入境。"
copy_zh_hant = "國籍按旅行證件原樣填寫。免費方案中的馬爾代夫國民可停留 90 天，其他免費方案旅客為 30 天、兩次入境。"

[[fields]]
n = "03"
key = "passport_number"
section_en = "Section 2 · Travel document"
section_zh = "第 2 段 · 旅行证件"
section_zh_hant = "第 2 段 · 旅行證件"
example = "Copy the exact passport value"
mistake = "A number typed from memory"
mistake_why_en = "the Department lists a correct passport number as an application requirement"
mistake_why_zh = "移民局把正确的护照号列为申请要求"
mistake_why_zh_hant = "移民局把正確的護照號列為申請要求"
copy_en = "Copy the passport number from the passport itself. A value taken from a booking confirmation or an old visa is the common source of a mismatch at the border."
copy_zh = "护照号从护照本身抄写。从订单确认或旧签证上抄来的号码，是过关时对不上的常见原因。"
copy_zh_hant = "護照號從護照本身抄寫。從訂單確認或舊簽證上抄來的號碼，是過關時對不上的常見原因。"

[[fields]]
n = "04"
key = "date_of_birth"
section_en = "Section 2 · Travel document"
section_zh = "第 2 段 · 旅行证件"
section_zh_hant = "第 2 段 · 旅行證件"
example = "Copy the exact travel document value"
mistake = "A guessed date order"
mistake_why_en = "the live form shows its own date format on screen"
mistake_why_zh = "实时表单会在页面上显示自己的日期格式"
mistake_why_zh_hant = "實時表單會在頁面上顯示自己的日期格式"
copy_en = "Match the date printed in the travel document, and use the date format the application screen shows. This guide does not restate a format the Department has not published."
copy_zh = "按旅行证件上的日期填写，并使用申请页面显示的日期格式。移民局没有公开的格式，本页不代为声称。"
copy_zh_hant = "按旅行證件上的日期填寫，並使用申請頁面顯示的日期格式。移民局沒有公開的格式，本頁不代為聲稱。"

[[fields]]
n = "05"
key = "passport_validity"
section_en = "Section 2 · Travel document"
section_zh = "第 2 段 · 旅行证件"
section_zh_hant = "第 2 段 · 旅行證件"
example = "Valid at least 6 months"
mistake = "Expires 2 months after arrival"
mistake_why_en = "shorter than the published 6-month requirement"
mistake_why_zh = "短于公开的 6 个月要求"
mistake_why_zh_hant = "短於公開的 6 個月要求"
copy_en = "The passport must be valid for at least 6 months. Check the expiry date before applying. Renewing the passport later means applying for a new ETA."
copy_zh = "护照有效期至少 6 个月。申请前先看到期日。之后换发护照就要重新申请 ETA。"
copy_zh_hant = "護照有效期至少 6 個月。申請前先看到期日。之後換發護照就要重新申請 ETA。"

[[fields]]
n = "06"
key = "same_document"
section_en = "Section 2 · Travel document"
section_zh = "第 2 段 · 旅行证件"
section_zh_hant = "第 2 段 · 旅行證件"
example = "The same document as in the application"
mistake = "Travelling on a second passport"
mistake_why_en = "the approval is tied to the document used in the application"
mistake_why_zh = "批准与申请时使用的证件绑定"
mistake_why_zh_hant = "批准與申請時使用的證件綁定"
copy_en = "Present the same travel document at arrival that you used in the application. Dual nationals should pick one document and use it for both the ETA and the flight."
copy_zh = "抵达时出示与申请时相同的旅行证件。双重国籍旅客先选定一本证件，ETA 和航班都用它。"
copy_zh_hant = "抵達時出示與申請時相同的旅行證件。雙重國籍旅客先選定一本證件，ETA 和航班都用它。"

[[fields]]
n = "07"
key = "return_ticket"
section_en = "Section 3 · Trip conditions"
section_zh = "第 3 段 · 行程条件"
section_zh_hant = "第 3 段 · 行程條件"
example = "Confirmed onward or return booking"
mistake = "An unpaid hold"
mistake_why_en = "the requirement is a confirmed ticket"
mistake_why_zh = "要求的是已确认的机票"
mistake_why_zh_hant = "要求的是已確認的機票"
copy_en = "A confirmed return or onward ticket is a published entry requirement. Keep it retrievable offline, because airport wifi is not guaranteed at the counter."
copy_zh = "已确认的返程或续程机票是公开的入境要求。最好能离线打开，机场柜台不一定有可用网络。"
copy_zh_hant = "已確認的返程或續程機票是公開的入境要求。最好能離線打開，機場櫃檯不一定有可用網路。"

[[fields]]
n = "08"
key = "funds"
section_en = "Section 3 · Trip conditions"
section_zh = "第 3 段 · 行程条件"
section_zh_hant = "第 3 段 · 行程條件"
example = "Evidence you can support the stay"
mistake = "Assuming approval ends the checks"
mistake_why_en = "funds can still be checked at the port of entry"
mistake_why_zh = "资金在口岸仍可能被查验"
mistake_why_zh_hant = "資金在口岸仍可能被查驗"
copy_en = "Sufficient funds for the stay are a published requirement. An approved ETA does not close the door on questions at the port of entry."
copy_zh = "停留期间的充足资金是公开要求。ETA 获批不代表口岸不会再问。"
copy_zh_hant = "停留期間的充足資金是公開要求。ETA 獲批不代表口岸不會再問。"
