# Philippines eTravel — field-by-field display data for the how-to-fill layout.
#
# Labels, date-format hints, notices and error strings below are verbatim from
# official eTravel properties, captured 2026-09-04:
#   - https://etravel.gov.ph/data-policy — the 28 data items eTravel collects
#   - https://etravel.gov.ph declaration form page (embedded i18n catalog) —
#     wizard step names, field labels, "(MM/DD/YYYY)" date hint, flight notice
#   - https://etravel.gov.ph/frequently-asked-questions — QR colors, 72-hour
#     window, lost-QR recovery, free-of-charge, duplicate registration
#
# [[fields]] is the high-error shortlist shown on the page; the form total
# (28 items) lives in meta.field_count in data/official_urls/philippines.toml,
# same convention as malaysia.toml. Step numbers follow the wizard order in the
# i18n catalog: 1 Personal Information, 2 Permanent Country of Residence,
# 3 Travel Details, 4 Health Declaration. Steps 2 and 4 are dropdowns and
# yes/no questions, so no high-error text card carries them.

[[fields]]
n = "01"
key = "email"
section_en = "Step 1 · Personal Information"
section_zh = "第 1 步 · 个人信息"
section_zh_hant = "第 1 步 · 個人資訊"
example = "travel@gmail.com"
mistake = "travel@gmial.com"
mistake_why_en = "domain typo — the 6-digit OTP never arrives and registration cannot finish"
mistake_why_zh = "域名打错——6 位验证码永远收不到，注册走不完"
mistake_why_zh_hant = "域名打錯——6 位驗證碼永遠收不到，註冊走不完"
copy_en = "Official label: Email address, the first item in the Data Policy's list of what eTravel collects. Sign-up emails a 6-digit one-time password (OTP) to this address; the site says to wait at least 3 minutes for it. Use an inbox you can open on your phone at check-in."
copy_zh = "官方字段名「Email address」，在 Data Policy 的收集清单里排第 1 位。注册时官方向这个邮箱发 6 位一次性验证码（OTP），并提示至少等 3 分钟。填你在值机时用手机打得开的邮箱。"
copy_zh_hant = "官方欄位名「Email address」，在 Data Policy 的收集清單裡排第 1 位。註冊時官方向這個信箱發 6 位一次性驗證碼（OTP），並提示至少等 3 分鐘。填你在值機時用手機打得開的信箱。"

[[fields]]
n = "02"
key = "full_name"
section_en = "Step 1 · Personal Information"
section_zh = "第 1 步 · 个人信息"
section_zh_hant = "第 1 步 · 個人資訊"
example = "First Name MARIA · Last Name SANTOS"
mistake = "First Name SANTOS · Last Name MARIA"
mistake_why_en = "names swapped between boxes — the eTravel record stops matching the passport"
mistake_why_zh = "姓和名填反——eTravel 记录和护照对不上"
mistake_why_zh_hant = "姓和名填反——eTravel 記錄和護照對不上"
copy_en = "Four separate boxes, not one: First Name, Middle Name, Last Name, Suffix, in the order the Data Policy lists them. Type each part exactly as printed on the passport photo page, and keep each passport name in its own box."
copy_zh = "官方是 4 个独立输入框，不是一整栏：「First Name」「Middle Name」「Last Name」「Suffix」，Data Policy 也按这个顺序列出。每一段按护照资料页的印刷拼写逐框填，不调换顺序。"
copy_zh_hant = "官方是 4 個獨立輸入框，不是一整欄：「First Name」「Middle Name」「Last Name」「Suffix」，Data Policy 也按這個順序列出。每一段按護照資料頁的印刷拼寫逐框填，不調換順序。"

[[fields]]
n = "03"
key = "passport"
section_en = "Step 1 · Personal Information"
section_zh = "第 1 步 · 个人信息"
section_zh_hant = "第 1 步 · 個人資訊"
example = "A12345678"
mistake = "A 12345678"
mistake_why_en = "space copied from the photo page layout or an airline profile"
mistake_why_zh = "照照片页版式或航司资料复制时带进了空格"
mistake_why_zh_hant = "照照片頁版式或航司資料複製時帶進了空格"
copy_en = "Official label: Passport Number. Type the number from the photo page as one string. Do not paste the two long lines at the bottom of the data page: that is the MRZ, with check digits, not the number itself."
copy_zh = "官方字段名「Passport Number」。照资料页逐位输入，作为一个连续字符串。别把资料页底部那两长串粘进来：那是 MRZ，含校验位，不是护照号。"
copy_zh_hant = "官方欄位名「Passport Number」。照資料頁逐位輸入，作為一個連續字符串。別把資料頁底部那兩長串粘進來：那是 MRZ，含校驗位，不是護照號。"

[[fields]]
n = "04"
key = "date_of_birth"
section_en = "Step 1 · Personal Information"
section_zh = "第 1 步 · 个人信息"
section_zh_hant = "第 1 步 · 個人資訊"
example = "08/22/1991"
mistake = "22/08/1991"
mistake_why_en = "day-first order — there is no month 22 in (MM/DD/YYYY)"
mistake_why_zh = "日在前的写法——（MM/DD/YYYY）里没有第 22 个月"
mistake_why_zh_hant = "日在前的寫法——（MM/DD/YYYY）裡沒有第 22 個月"
copy_en = "Official label: Birth Date, and the form marks every date field (MM/DD/YYYY): month, then day, then year. 08/22/1991 means August 22, 1991. The local checker below is the opposite — it takes YYYY-MM-DD."
copy_zh = "官方字段名「Birth Date」。表单所有日期栏都标注（MM/DD/YYYY）：先月、再日、后年。08/22/1991 是 1991 年 8 月 22 日。下方本地校验器相反，输入格式是 YYYY-MM-DD。"
copy_zh_hant = "官方欄位名「Birth Date」。表單所有日期欄都標註（MM/DD/YYYY）：先月、再日、後年。08/22/1991 是 1991 年 8 月 22 日。下方本地校驗器相反，輸入格式是 YYYY-MM-DD。"

[[fields]]
n = "05"
key = "mobile_number"
section_en = "Step 1 · Personal Information"
section_zh = "第 1 步 · 个人信息"
section_zh_hant = "第 1 步 · 個人資訊"
example = "+639171234567"
mistake = "0917-123-4567"
mistake_why_en = "local format with dashes and no country code — unreachable from abroad"
mistake_why_zh = "只有本地格式，带连字符没区号——从国外打不通"
mistake_why_zh_hant = "只有本地格式，帶連字符沒區號——從國外打不通"
copy_en = "Official label: Mobile Number, item 11 in the Data Policy list, between Nationality and Address. Include your country code (+86 for China, +63 for a Philippine SIM). The local checker below accepts a + followed by 7 to 15 digits."
copy_zh = "官方字段名「Mobile Number」，Data Policy 清单第 11 项，排在「Nationality」和「Address」之间。带国家区号（中国 +86，菲律宾卡 +63）。下方本地校验器接受 + 加 7 到 15 位数字。"
copy_zh_hant = "官方欄位名「Mobile Number」，Data Policy 清單第 11 項，排在「Nationality」和「Address」之間。帶國家區號（中國 +86，菲律賓卡 +63）。下方本地校驗器接受 + 加 7 到 15 位數字。"

[[fields]]
n = "06"
key = "arrival_date"
section_en = "Step 3 · Travel Details"
section_zh = "第 3 步 · 行程信息"
section_zh_hant = "第 3 步 · 行程資訊"
example = "07/14/2026"
mistake = "landed 07/14 · typed 07/13"
mistake_why_en = "departure-city date — the form wants the arrival date in Philippine local time"
mistake_why_zh = "填了出发地日期——表单要的是菲律宾当地的抵达日期"
mistake_why_zh_hant = "填了出發地日期——表單要的是菲律賓當地的抵達日期"
copy_en = "Official label: Date of Arrival, marked (MM/DD/YYYY) like every date field. Use the date you land in Philippine local time; red-eye flights often arrive the next calendar day. This date also controls the registration window — see the error decoder below."
copy_zh = "官方字段名「Date of Arrival」，和其他日期栏一样按（MM/DD/YYYY）填。用菲律宾当地落地日期；红眼航班常常跨到第二天。这个日期还决定注册窗口，见下方错误解码。"
copy_zh_hant = "官方欄位名「Date of Arrival」，和其他日期欄一樣按（MM/DD/YYYY）填。用菲律賓當地落地日期；紅眼航班常常跨到第二天。這個日期還決定註冊窗口，見下方錯誤解碼。"

[[fields]]
n = "07"
key = "flight_number"
section_en = "Step 3 · Travel Details"
section_zh = "第 3 步 · 行程信息"
section_zh_hant = "第 3 步 · 行程資訊"
example = "PR103"
mistake = "PAL 103"
mistake_why_en = "airline name instead of the two-letter carrier code"
mistake_why_zh = "写了航司名，不是两位航司代码"
mistake_why_zh_hant = "寫了航司名，不是兩位航司代碼"
copy_en = "Official label: Flight Number, in the Travel Details step. The form auto-fills your terminal from it, and after the NAIA terminal reassignments the site posts a notice: fill in the correct flight number in your scheduled travel, and disregard the auto-filled terminal. Sea travelers get Voyage Number and Vessel Name fields instead."
copy_zh = "官方字段名「Flight Number」，在行程（Travel Details）步骤。表单会按它自动带出航站楼；NAIA 航站楼调整后，官网专门公告：请填正确航班号（fill in the correct flight number in your scheduled travel），忽略自动带出的航站楼。乘船旅客对应的是「Voyage Number」和「Vessel Name」。"
copy_zh_hant = "官方欄位名「Flight Number」，在行程（Travel Details）步驟。表單會按它自動帶出航站樓；NAIA 航站樓調整後，官網專門公告：請填正確航班號（fill in the correct flight number in your scheduled travel），忽略自動帶出的航站樓。乘船旅客對應的是「Voyage Number」和「Vessel Name」。"

# Error decoder — every code is an official string, verbatim.
# Sources: form i18n catalog (Validation), site banner, FAQ. Official typos
# ("regisration", "incovenience") are kept as printed.

[[errors]]
code = "Please make sure to fill out all required fields."
why_en = "The form's own validation banner. Skipping a box and submitting anyway is the incomplete half of what earns a red QR; the FAQ pairs incomplete with incorrect."
why_zh = "表单自带的必填校验提示。漏填硬交，正是 FAQ 里红码成因的「不完整」那一半，另一半是填错。"
why_zh_hant = "表單自帶的必填校驗提示。漏填硬交，正是 FAQ 裡紅碼成因的「不完整」那一半，另一半是填錯。"

[[errors]]
code = "The green QR code is issued when your submission of required information is proper and complete."
why_en = "Green means straight through. The FAQ says with a green QR you may directly proceed with immigration inspection upon arrival. Screenshot it and go."
why_zh = "绿码直通。FAQ 原文说拿到绿码可直达入境查验（directly proceed with immigration inspection upon arrival）。截图走人。"
why_zh_hant = "綠碼直通。FAQ 原文說拿到綠碼可直達入境查驗（directly proceed with immigration inspection upon arrival）。截圖走人。"

[[errors]]
code = "The red QR code is issued when the data submitted is incomplete/incorrect, and/or if for the past 30 days, you are sick or have a history of exposure to a person who is sick or known to have communicable/infectious disease prior to travel."
why_en = "Red is not a refusal. You are routed to further inspection by the Bureau of Quarantine (BOQ) before immigration formalities. The triggers are incomplete or wrong data, or the 30-day health questions, which the Health Declaration step asks verbatim."
why_zh = "红码不等于拒入境，而是先接受检疫局（BOQ）进一步检查再办入境。触发原因是资料不完整或填错，或 30 天健康问题，健康申报步骤问的就是这几条原文。"
why_zh_hant = "紅碼不等於拒入境，而是先接受檢疫局（BOQ）進一步檢查再辦入境。觸發原因是資料不完整或填錯，或 30 天健康問題，健康申報步驟問的就是這幾條原文。"

[[errors]]
code = "You may only register within 72 hours prior to your arrival or departure in the Philippines."
why_en = "The announcement banner on the site itself. Registration opens only 3 days before your flight, so a Date of Arrival further out is not accepted. Do not file weeks early."
why_zh = "官网公告横幅原文。只能在航班前 3 天内注册，太远的抵达日期不被接受。别提前几周填。"
why_zh_hant = "官網公告橫幅原文。只能在航班前 3 天內註冊，太遠的抵達日期不被接受。別提前幾週填。"

[[errors]]
code = "To open your profile, go to: https://etravel.gov.ph/search and enter your reference number and date of birth then press continue."
why_en = "Lost the QR screenshot? This is the FAQ's official recovery path: reference number plus date of birth at etravel.gov.ph/search."
why_zh = "二维码截图丢了？FAQ 给的官方找回路径：到 etravel.gov.ph/search，用参考号加出生日期打开记录。"
why_zh_hant = "QR Code 截圖丟了？FAQ 給的官方找回路徑：到 etravel.gov.ph/search，用參考號加出生日期打開記錄。"

[[errors]]
code = "No. eTravel regisration/update is absolutely free of charge, hence, it does not collect or require any form of online payment."
why_en = "The typo is the FAQ's own — regisration, as printed. Anyone demanding payment for eTravel registration is not the official site; the same answer warns against fake sites that require payment."
why_zh = "错字是 FAQ 自己的——原文就拼作 regisration，照抄。任何要你为 eTravel 注册付钱的都不是官方；同一条答案还警告了要求付款的假冒网站。"
why_zh_hant = "錯字是 FAQ 自己的——原文就拼作 regisration，照抄。任何要你為 eTravel 註冊付錢的都不是官方；同一條答案還警告了要求付款的假冒網站。"

[[errors]]
code = "Presenting different QR codes may cause delay or incovenience."
why_en = "Another FAQ typo, kept as printed (incovenience). If you registered twice, pick one QR and present only that one. To fix a mistake, use the Edit Registration tab instead of filing again."
why_zh = "又一条 FAQ 错字，照原文保留（incovenience）。注册了两次就固定出示一个二维码。要改错误，用「Edit Registration」标签页，别重新提交。"
why_zh_hant = "又一條 FAQ 錯字，照原文保留（incovenience）。註冊了兩次就固定出示一個 QR Code。要改錯誤，用「Edit Registration」標籤頁，別重新提交。"
