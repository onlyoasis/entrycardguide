# Jamaica Electronic Passenger Declaration (C5) — live public form fields.
# No [[errors]] array: the page does not publish a complete official error set.

[[fields]]
n = "01"
key = "email"
section_en = "Section 1 · Email gate"
section_zh = "第 1 段 · 邮箱验证"
example = "travel@example.com"
mistake = "An inbox you cannot open"
mistake_why_en = "the portal verifies the address before opening the form and sends confirmation after submission"
mistake_why_zh = "门户会先验证邮箱，提交后也向该地址发送确认"
copy_en = "Use an address you can open during the application. The public verification input has a 6-character minimum."
copy_zh = "使用申请时能打开的邮箱。公开验证输入的最小长度为 6 个字符。"

[[fields]]
n = "02"
key = "last_name"
section_en = "Section 2 · Personal information"
section_zh = "第 2 段 · 个人信息"
example = "Family name from passport"
mistake = "A shortened family name"
mistake_why_en = "the form asks for the passport name"
mistake_why_zh = "表单要求按护照姓名填写"
copy_en = "Copy the last name from the travel passport."
copy_zh = "照本次出行护照抄写姓氏。"

[[fields]]
n = "03"
key = "first_name"
section_en = "Section 2 · Personal information"
section_zh = "第 2 段 · 个人信息"
example = "Given name from passport"
mistake = "A nickname"
mistake_why_en = "the entry record should match the passport"
mistake_why_zh = "入境记录应与护照一致"
copy_en = "Copy the first name from the travel passport."
copy_zh = "照本次出行护照抄写名字。"

[[fields]]
n = "04"
key = "middle_name"
section_en = "Section 2 · Personal information"
section_zh = "第 2 段 · 个人信息"
example = "Middle name from passport, if any"
mistake = "Inventing a middle name"
mistake_why_en = "the live HTML leaves this input optional"
mistake_why_zh = "实时页面没有把该项标成必填"
copy_en = "Enter it only when it appears in the passport."
copy_zh = "只有护照上有中间名时才填写。"

[[fields]]
n = "05"
key = "birth_date"
section_en = "Section 2 · Personal information"
section_zh = "第 2 段 · 个人信息"
example = "Day, month and year from passport"
mistake = "Typing an estimated date"
mistake_why_en = "the form says the date must appear as on the passport"
mistake_why_zh = "页面要求与护照所示日期一致"
copy_en = "Choose day, month and year from the controls and compare them with the passport."
copy_zh = "分别选择日、月、年，再与护照核对。"

[[fields]]
n = "06"
key = "gender"
section_en = "Section 2 · Personal information"
section_zh = "第 2 段 · 个人信息"
example = "Matching passport details"
mistake = "Skipping the select"
mistake_why_en = "the public HTML marks the select required"
mistake_why_zh = "公开 HTML 把该选择项标为必填"
copy_en = "Select the option that matches the travel document."
copy_zh = "选择与出行证件一致的选项。"

[[fields]]
n = "07"
key = "family_members"
section_en = "Section 2 · Personal information"
section_zh = "第 2 段 · 个人信息"
example = "0 to 5"
mistake = "Counting unrelated passengers"
mistake_why_en = "the field asks for family members travelling with this passenger"
mistake_why_zh = "该项只问与本旅客同行的家庭成员"
copy_en = "Choose the number shown by the live select. It currently lists 0 through 5."
copy_zh = "按实时下拉框选择人数；当前选项为 0 至 5。"

[[fields]]
n = "08"
key = "home_address"
section_en = "Section 3 · Address and passport"
section_zh = "第 3 段 · 地址与护照"
example = "Street, city, region, postal code, country"
mistake = "Only entering a country"
mistake_why_en = "the form separates the home address into five required parts"
mistake_why_zh = "表单把家庭地址拆成 5 个必填部分"
copy_en = "Complete every address part with the current home address."
copy_zh = "用当前家庭地址填完每个地址部分。"

[[fields]]
n = "09"
key = "occupation"
section_en = "Section 3 · Address and passport"
section_zh = "第 3 段 · 地址与护照"
example = "Current occupation"
mistake = "A long work history"
mistake_why_en = "the field asks only for occupation"
mistake_why_zh = "该项只问当前职业"
copy_en = "Use a short description of the current occupation."
copy_zh = "简短填写当前职业。"

[[fields]]
n = "10"
key = "passport_number"
section_en = "Section 3 · Address and passport"
section_zh = "第 3 段 · 地址与护照"
example = "Number from the bio page"
mistake = "Using a different passport"
mistake_why_en = "the C5 and travel document must refer to the same passenger"
mistake_why_zh = "C5 和出行证件必须对应同一旅客"
copy_en = "Copy the number from the passport you will present. No public pattern or length is claimed."
copy_zh = "抄写入境时会出示的护照号码。公开页面没有格式或长度规则，本页不编。"

[[fields]]
n = "11"
key = "passport_issue_country"
section_en = "Section 3 · Address and passport"
section_zh = "第 3 段 · 地址与护照"
example = "Country printed as issuer"
mistake = "Country of residence"
mistake_why_en = "the form asks which country issued the passport"
mistake_why_zh = "表单问的是护照签发国"
copy_en = "Enter the issuing country for the same passport number."
copy_zh = "填写上述护照号码对应的签发国。"

[[fields]]
n = "12"
key = "jamaica_address"
section_en = "Section 4 · Trip"
section_zh = "第 4 段 · 行程"
example = "Hotel name or residential address"
mistake = "Only writing Jamaica"
mistake_why_en = "the form asks for the address in Jamaica"
mistake_why_zh = "该项要求牙买加境内地址"
copy_en = "Use the first hotel, rental or host address for this stay."
copy_zh = "填写本次停留的首家酒店、民宿或接待人地址。"

[[fields]]
n = "13"
key = "countries_visited"
section_en = "Section 4 · Trip"
section_zh = "第 4 段 · 行程"
example = "Select the requested recent travel"
mistake = "Selecting the residence country only"
mistake_why_en = "this is a travel-history multi-select"
mistake_why_zh = "这是行程历史多选项"
copy_en = "Read the prompt on the live form and select every applicable country."
copy_zh = "按实时页面提示选择所有符合的国家。"

[[fields]]
n = "14"
key = "flight_number"
section_en = "Section 4 · Trip"
section_zh = "第 4 段 · 行程"
example = "Airline selected + 0090"
mistake = "Typing the whole airline name in the number box"
mistake_why_en = "the form separates airline selection from a number box capped at 4 characters"
mistake_why_zh = "页面把航空公司和航班数字拆开，数字框最多 4 个字符"
copy_en = "Select the airline, then enter only the number portion shown in the booking."
copy_zh = "先选航空公司，再抄写订单中的航班数字部分。"

[[fields]]
n = "15"
key = "departure_port"
section_en = "Section 4 · Trip"
section_zh = "第 4 段 · 行程"
example = "Miami"
mistake = "Final destination after Jamaica"
mistake_why_en = "the field asks where the arriving leg departed"
mistake_why_zh = "该项问抵达牙买加这一程从哪里出发"
copy_en = "Enter the port immediately before arrival in Jamaica."
copy_zh = "填写抵达牙买加前一程的出发口岸。"

[[fields]]
n = "16"
key = "travel_date"
section_en = "Section 4 · Trip"
section_zh = "第 4 段 · 行程"
example = "mm/dd/yyyy"
mistake = "Using dd/mm/yyyy"
mistake_why_en = "the live input displays Travel Date (mm/dd/yyyy)"
mistake_why_zh = "实时输入框显示 Travel Date (mm/dd/yyyy)"
copy_en = "Use the official date picker and confirm month, day and year against the booking."
copy_zh = "使用官网日期选择器，并按订单核对月、日、年。"

[[fields]]
n = "17"
key = "visit_purpose"
section_en = "Section 4 · Trip"
section_zh = "第 4 段 · 行程"
example = "Vacation"
mistake = "Choosing transit for a holiday"
mistake_why_en = "the purpose should describe this trip"
mistake_why_zh = "目的选项应描述本次行程"
copy_en = "Choose the listed purpose that fits this journey; use Other only when none does."
copy_zh = "选择符合本次行程的现有选项；都不符合时才用 Other。"

[[fields]]
n = "18"
key = "stay_length"
section_en = "Section 4 · Trip"
section_zh = "第 4 段 · 行程"
example = "Number of days"
mistake = "Entering a departure date"
mistake_why_en = "the live field asks for length of stay in days"
mistake_why_zh = "实时字段要求填写停留天数"
copy_en = "Calculate the planned stay in days from the itinerary."
copy_zh = "按行程计算计划停留天数。"

[[fields]]
n = "19"
key = "luggage_counts"
section_en = "Section 5 · Customs"
section_zh = "第 5 段 · 海关"
example = "Accompanied 2; unaccompanied 0"
mistake = "Combining both counts"
mistake_why_en = "the form separates checked and hand luggage from freight luggage"
mistake_why_zh = "页面把随身及托运行李与另行空运或海运的行李分开"
copy_en = "Count accompanied and unaccompanied pieces separately."
copy_zh = "分别统计随行行李和另行运输行李。"

[[fields]]
n = "20"
key = "customs_declaration"
section_en = "Section 5 · Customs"
section_zh = "第 5 段 · 海关"
example = "Truthful answer to every declaration item"
mistake = "Choosing No to avoid inspection"
mistake_why_en = "the form warns that an incomplete declaration can lead to fines, forfeiture and imprisonment"
mistake_why_zh = "表单警告，不完整申报可能导致罚款、没收和监禁"
copy_en = "Read every goods, currency and allowance question. If in doubt, declare the goods to the customs officer."
copy_zh = "逐项阅读物品、货币和免税额度问题。有疑问就向海关人员申报。"
