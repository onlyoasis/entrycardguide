mistake_why_zh_hant = "簽證有效期從計劃入境日開始"
copy_en = "Use the planned entry date in the official date control. Do not use the submission date."
copy_zh = "在官网日期控件中选择计划入境日，不要填写提交申请的日期。"
copy_zh_hant = "在官網日期控件中選擇計劃入境日，不要填寫提交申請的日期。"

