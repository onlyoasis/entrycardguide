# Ethiopia Tourist eVisa — public application and tourist-information fields.
# No [[errors]] array: the official page exposes no live validation error text.

[[fields]]
n = "01"
key = "visa_route"
section_en = "Section 1 · Route and duration"
section_zh = "第 1 段 · 路径与时长"
example = "Check exemption and on-arrival eligibility"
mistake = "Paying before checking the route"
mistake_why_en = "Kenya and Djibouti passport holders are exempt, and a separate on-arrival list exists"
mistake_why_zh = "肯尼亚和吉布提护照免签，官网另有落地签资格名单"
copy_en = "Start on the official visa-on-arrival page. It also states the two passport exemptions. Use the paid online route only when it fits the passport."
copy_zh = "先看官网落地签页面。该页也列出两种护照免签。只有本次护照适合在线路径时才付款。"

[[fields]]
n = "02"
key = "visa_duration"
section_en = "Section 1 · Route and duration"
section_zh = "第 1 段 · 路径与时长"
example = "Single entry, 30 days, USD 62"
mistake = "Choosing 90 days without checking the USD 152 fee"
mistake_why_en = "the two tourist durations have different current fees"
mistake_why_zh = "两档旅游签的现行费用不同"
copy_en = "Choose between the official 30-day and 90-day single-entry products. The current page lists USD 62 and USD 152 respectively."
copy_zh = "在官方 30 天和 90 天单次入境产品之间选择。现行页面分别列出 62 和 152 美元。"

[[fields]]
n = "03"
key = "arrival_date"
section_en = "Section 2 · Arrival and stay"
section_zh = "第 2 段 · 入境与住宿"
example = "The intended date of entry"
mistake = "The application date"
mistake_why_en = "visa validity starts from the intended entry date"
mistake_why_zh = "签证有效期从计划入境日开始"
copy_en = "Use the planned entry date in the official date control. Do not use the submission date."
copy_zh = "在官网日期控件中选择计划入境日，不要填写提交申请的日期。"

[[fields]]
n = "04"
key = "departure_country"
section_en = "Section 2 · Arrival and stay"
section_zh = "第 2 段 · 入境与住宿"
example = "Country and city of the flight to Ethiopia"
mistake = "Home country despite a connection elsewhere"
mistake_why_en = "the section asks for the actual departure country, city, airline and flight"
mistake_why_zh = "该段要求实际出发国、城市、航司和航班"
copy_en = "Use the flight sector that brings you into Ethiopia. Keep the airline and flight number from the same booking segment."
copy_zh = "按实际飞入埃塞俄比亚的航段填写，航司和航班号也取自同一段订单。"

[[fields]]
n = "05"
key = "address_in_ethiopia"
section_en = "Section 2 · Arrival and stay"
section_zh = "第 2 段 · 入境与住宿"
example = "Hotel name, city, street and telephone"
mistake = "Only Addis Ababa"
mistake_why_en = "the form asks for accommodation details, not only a city"
mistake_why_zh = "表单要求住宿详情，不只是一座城市"
copy_en = "Prepare accommodation type, name, city, street address and telephone exactly as shown on the booking."
copy_zh = "按订单准备住宿类型、名称、城市、街道地址和电话。"

[[fields]]
n = "06"
key = "given_name"
section_en = "Section 3 · Personal information"
section_zh = "第 3 段 · 个人信息"
example = "All given names from the passport"
mistake = "Dropping a middle given name"
mistake_why_en = "the application record must match the travel passport"
mistake_why_zh = "申请记录必须与出行护照一致"
copy_en = "Copy the given names from the passport. The page publishes no length or character rule, so none is claimed here."
copy_zh = "按护照抄写全部名。页面没有公开长度或字符规则，本页不自行补充。"

[[fields]]
n = "07"
key = "surname"
section_en = "Section 3 · Personal information"
section_zh = "第 3 段 · 个人信息"
example = "Surname from the passport"
mistake = "A married name not on this passport"
mistake_why_en = "the visa is tied to the submitted passport details"
mistake_why_zh = "签证绑定申请中提交的护照资料"
copy_en = "Copy the surname from the passport used for the application."
copy_zh = "抄写申请所用护照上的姓。"

[[fields]]
n = "08"
key = "citizenship"
section_en = "Section 3 · Personal information"
section_zh = "第 3 段 · 个人信息"
example = "Citizenship of the travel passport"
mistake = "Citizenship of a second passport"
mistake_why_en = "the official information tells multiple nationals to use the passport chosen for travel"
mistake_why_zh = "官网要求多重国籍者按本次出行使用的护照选择"
copy_en = "Select citizenship according to the passport you intend to present for this trip."
copy_zh = "按本次出行准备出示的护照选择国籍。"

[[fields]]
n = "09"
key = "date_of_birth"
section_en = "Section 3 · Personal information"
section_zh = "第 3 段 · 个人信息"
example = "Match the passport date"
mistake = "Day and month guessed from memory"
mistake_why_en = "the application should reproduce the travel document"
mistake_why_zh = "申请内容要与旅行证件一致"
copy_en = "Use the official date control and match the passport. No text format is published on the public page."
copy_zh = "使用官网日期控件并与护照核对。公开页面没有给出文本日期格式。"

[[fields]]
n = "10"
key = "email"
section_en = "Section 4 · Contact"
section_zh = "第 4 段 · 联系方式"
example = "An inbox you can check"
mistake = "Two email fields with different spelling"
mistake_why_en = "the form asks for email and confirmation"
mistake_why_zh = "表单要求邮箱与确认邮箱一致"
copy_en = "Enter the same accessible address in the email and confirmation fields."
copy_zh = "邮箱和确认邮箱填写同一个自己能登录的地址。"

[[fields]]
n = "11"
key = "passport_number"
section_en = "Section 5 · Passport"
section_zh = "第 5 段 · 护照"
example = "Number on the uploaded passport"
mistake = "Number from an old passport"
mistake_why_en = "the typed data and uploaded copy must describe the same document"
mistake_why_zh = "手填资料和上传副本必须是同一本证件"
copy_en = "Copy the passport number from the bio page that will be uploaded. No public regex or length is claimed."
copy_zh = "从准备上传的资料页抄护照号。公开页面没有正则或长度，本页不编。"

[[fields]]
n = "12"
key = "passport_expiry"
section_en = "Section 5 · Passport"
section_zh = "第 5 段 · 护照"
example = "At least 6 months after intended entry"
mistake = "6 months from application date"
mistake_why_en = "the official requirement counts from the intended entry date"
mistake_why_zh = "官方要求从计划入境日开始计算"
copy_en = "Confirm at least 6 months of passport validity from the intended date of entry."
copy_zh = "从计划入境日开始，确认护照至少还有 6 个月有效期。"

[[fields]]
n = "13"
key = "photo_and_passport_copy"
section_en = "Section 6 · Uploads"
section_zh = "第 6 段 · 上传材料"
example = "Recent photo and clear colour passport copy"
mistake = "A PDF upload"
mistake_why_en = "the public upload note accepts JPEG, JPG and PNG image files"
mistake_why_zh = "公开上传提示只接受 JPEG、JPG 和 PNG 图片"
copy_en = "Prepare the mandatory recent passport-size photo and scanned colour passport copy as JPEG, JPG or PNG images."
copy_zh = "把必需的近期证件照和护照彩色扫描件准备为 JPEG、JPG 或 PNG 图片。"
