# Ethiopia Tourist eVisa — public application and tourist-information fields.
# No [[errors]] array: the official page exposes no live validation error text.

[[fields]]
n = "01"
key = "visa_route"
section_en = "Section 1 · Route and duration"
section_zh = "第 1 段 · 路径与时长"
section_zh_hant = "第 1 段 · 路徑與時長"
example = "Check exemption and on-arrival eligibility"
mistake = "Paying before checking the route"
mistake_why_en = "Kenya and Djibouti passport holders are exempt, and a separate on-arrival list exists"
mistake_why_zh = "肯尼亚和吉布提护照免签，官网另有落地签资格名单"
mistake_why_zh_hant = "肯尼亞和吉布提護照免簽，官網另有落地簽資格名單"
copy_en = "Start on the official visa-on-arrival page. It also states the two passport exemptions. Use the paid online route only when it fits the passport."
copy_zh = "先看官网落地签页面。该页也列出两种护照免签。只有本次护照适合在线路径时才付款。"
copy_zh_hant = "先看官網落地簽頁面。該頁也列出兩種護照免簽。只有本次護照適合線上路徑時才付款。"

[[fields]]
n = "02"
key = "visa_duration"
section_en = "Section 1 · Route and duration"
section_zh = "第 1 段 · 路径与时长"
section_zh_hant = "第 1 段 · 路徑與時長"
example = "Single entry, 30 days, USD 62"
mistake = "Choosing 90 days without checking the USD 152 fee"
mistake_why_en = "the two tourist durations have different current fees"
mistake_why_zh = "两档旅游签的现行费用不同"
mistake_why_zh_hant = "兩檔旅遊簽的現行費用不同"
copy_en = "Choose between the official 30-day and 90-day single-entry products. The current page lists USD 62 and USD 152 respectively."
copy_zh = "在官方 30 天和 90 天单次入境产品之间选择。现行页面分别列出 62 和 152 美元。"
copy_zh_hant = "在官方 30 天和 90 天單次入境產品之間選擇。現行頁面分別列出 62 和 152 美元。"

