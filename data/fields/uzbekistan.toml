# Uzbekistan eVisa — fields and executable image constraints from the live official portal.
# No [[errors]] array: image errors are quoted in field guidance, while no stable official text-field errors were exposed.

[[fields]]
n = "01"
key = "visa_free_status"
section_en = "Section 1 · Route and eligibility"
section_zh = "第 1 段 · 路径与资格"
example = "Confirmed visa-free under the current MFA list"
mistake = "Opening a paid application first"
mistake_why_en = "many passports have a visa-free route with different durations and conditions"
mistake_why_zh = "很多护照有免签路径，但期限和条件不同"
copy_en = "Start with the current MFA visa-free list. If the passport and trip meet that entry, no eVisa form or fee is needed."
copy_zh = "先查外交部当前免签清单。护照和行程满足对应条目时，无需电子签表单或费用。"

[[fields]]
n = "02"
key = "evisa_eligibility"
section_en = "Section 1 · Route and eligibility"
section_zh = "第 1 段 · 路径与资格"
example = "Passport appears in current Appendix 1"
mistake = "Assuming every non-exempt passport can use eVisa"
mistake_why_en = "the eVisa has its own eligibility appendix"
mistake_why_zh = "电子签另有自己的资格附录"
copy_en = "If visa-free entry does not apply, confirm the passport in current Appendix 1. The portal tells other applicants to contact an Uzbekistan foreign mission."
copy_zh = "不适用免签时，再确认护照是否在当前附录 1。其他申请人会被门户提示联系乌兹别克斯坦驻外机构。"

[[fields]]
n = "03"
key = "travel_document"
section_en = "Section 1 · Route and eligibility"
section_zh = "第 1 段 · 路径与资格"
example = "Citizenship and ordinary passport used for entry"
mistake = "Applying with a different passport"
mistake_why_en = "the eVisa is valid only with the submitted travel document"
mistake_why_zh = "电子签只与提交的旅行证件配套有效"
copy_en = "Choose the citizenship and document type from the passport that will be shown at the border."
copy_zh = "按入境时会出示的护照选择国籍和证件类型。"

[[fields]]
n = "04"
key = "entry_type"
section_en = "Section 1 · Route and eligibility"
section_zh = "第 1 段 · 路径与资格"
example = "Single entry — USD 20"
mistake = "Paying for more entries than the itinerary needs"
mistake_why_en = "single, double and multiple entry have different fees"
mistake_why_zh = "单次、两次和多次入境费用不同"
copy_en = "Choose single, double or multiple entry from the itinerary. Current fees are USD 20, USD 35 and USD 50."
copy_zh = "按行程选择单次、两次或多次入境。当前费用分别为 20、35 和 50 美元。"

[[fields]]
n = "05"
key = "purpose_dates"
section_en = "Section 1 · Route and eligibility"
section_zh = "第 1 段 · 路径与资格"
example = "Tourism; stay of 14 days"
mistake = "Using eVisa for a non-tourism purpose"
mistake_why_en = "the portal directs non-tourism invitations to the MFA route"
mistake_why_zh = "门户把非旅游邀请引导到外交部路径"
copy_en = "Select tourism and the intended dates. The eVisa stay may not exceed 30 days."
copy_zh = "选择旅游目的和计划日期。电子签停留期不得超过 30 天。"

[[fields]]
n = "06"
key = "passport_name"
section_en = "Section 2 · Personal and passport data"
section_zh = "第 2 段 · 个人与护照资料"
example = "English name from the passport"
mistake = "Local-script spelling or nickname"
mistake_why_en = "the portal requires English data from the valid travel document"
mistake_why_zh = "门户要求按有效旅行证件用英文填写"
copy_en = "Enter surname, given name and patronymic in English as the passport presents them."
copy_zh = "按护照所列英文填写姓、名和父名。"

[[fields]]
n = "07"
key = "birth_details"
section_en = "Section 2 · Personal and passport data"
section_zh = "第 2 段 · 个人与护照资料"
example = "31.12.1990; passport place of birth"
mistake = "Month-first free text"
mistake_why_en = "the live label displays DD.MM.YYYY"
mistake_why_zh = "实时标签显示 DD.MM.YYYY"
copy_en = "Use the official date control in DD.MM.YYYY order and copy the place of birth from the passport."
copy_zh = "用官方控件按 DD.MM.YYYY 顺序填写日期，并从护照抄写出生地。"

[[fields]]
n = "08"
key = "passport_details"
section_en = "Section 2 · Personal and passport data"
section_zh = "第 2 段 · 个人与护照资料"
example = "Series and number, issue date, expiration date"
mistake = "Old-passport details"
mistake_why_en = "the eVisa must be presented with the submitted passport"
mistake_why_zh = "电子签必须与提交的护照一起出示"
copy_en = "Copy the passport series and number, issue date and expiration date from the document used for entry."
copy_zh = "从入境所用护照抄写证件系列和号码、签发日期、到期日期。"

[[fields]]
n = "09"
key = "residence_contact"
section_en = "Section 3 · Residence and trip"
section_zh = "第 3 段 · 居住与行程"
example = "Full permanent address and reachable phone"
mistake = "Country name only"
mistake_why_en = "the live application requests an address and contact number"
mistake_why_zh = "实时申请要求地址和联系电话"
copy_en = "Enter the permanent residence address and a mobile or land-line number that can be reached."
copy_zh = "填写完整常住地址和可联系的手机或固定电话号码。"

[[fields]]
n = "10"
key = "work_and_stay"
section_en = "Section 3 · Residence and trip"
section_zh = "第 3 段 · 居住与行程"
example = "Employer and position; hotel in Tashkent"
mistake = "Uzbekistan only"
mistake_why_en = "the form asks for work or study and a preliminary place of residence"
mistake_why_zh = "表单要求工作或学习资料，以及预计住宿地"
copy_en = "Prepare the work or study and position details, plus the preliminary hotel or residence in Uzbekistan."
copy_zh = "准备工作或学习单位与职务，以及乌兹别克斯坦预计酒店或住宿地址。"

[[fields]]
n = "11"
key = "face_photo"
section_en = "Section 4 · Images and activation"
section_zh = "第 4 段 · 图片与激活"
example = "35 × 45 mm, 300 dpi, JPG or JPEG under 1024 KB"
mistake = "PNG or oversized image"
mistake_why_en = "the portal publishes format, size and ICAO checks"
mistake_why_zh = "门户公开了格式、大小和 ICAO 检查"
copy_en = "Prepare a 35 × 45 mm face photo at 300 dpi in JPG or JPEG, below 1024 KB, and follow the ICAO example shown by the portal."
copy_zh = "准备 35 × 45 毫米、300 dpi、低于 1024 KB 的 JPG 或 JPEG 人像，并按门户展示的 ICAO 示例处理。"

[[fields]]
n = "12"
key = "passport_scan"
section_en = "Section 4 · Images and activation"
section_zh = "第 4 段 · 图片与激活"
example = "Readable JPG or JPEG data page, no more than 500 KB"
mistake = "Blurred or oversized data page"
mistake_why_en = "the portal guidance sets readability and a 500 KB maximum"
mistake_why_zh = "门户说明要求可读且最大 500 KB"
copy_en = "Upload a readable copy of the passport data page. Keep the file at or below the published 500 KB limit."
copy_zh = "上传清晰可读的护照资料页副本，文件不超过官网公布的 500 KB。"

[[fields]]
n = "13"
key = "email_activation"
section_en = "Section 4 · Images and activation"
section_zh = "第 4 段 · 图片与激活"
example = "Reachable email controlled by the applicant"
mistake = "Losing access after payment"
mistake_why_en = "activation, result and the approved PDF use that address"
mistake_why_zh = "激活、结果和获批 PDF 都使用该邮箱"
copy_en = "Enter a reachable email, use the digital code to activate the application, and watch the same inbox for the PDF result."
copy_zh = "填写可访问邮箱，用数字码激活申请，并在同一邮箱接收最终 PDF。"
