# 12项准备资料，分4组；不是官方全表字段数或格式校验规则。

[[fields]]
n = "01"
key = "declaration_type"
section_en = "Declaration and transport"
section_zh = "申报与交通"
example = "Nil: no declarable goods / 无应申报物品"
mistake = "Skip the form / 直接不填"
mistake_why_en = "Nil is a declaration, not an exemption."
mistake_why_zh = "Nil 也是申报，不等于免填。"
copy_en = "Compare the Full and Nil descriptions with what you carry. Nil is for no declarable goods; it does not let you skip filing. This example describes a situation, not text to paste."
copy_zh = "按携带物品核对 Full 和 Nil 的说明。没有应申报物品走 Nil，也要申报。示例是情形对照，不是要粘贴的字段值。"

[[fields]]
n = "02"
key = "travel_mode"
section_en = "Declaration and transport"
section_zh = "申报与交通"
example = "Air: booked flight / 航空：所订航班"
mistake = "Road: invented flight / 陆路：编造航班"
mistake_why_en = "Transport details depend on how you travel."
mistake_why_zh = "交通工具资料取决于出行方式。"
copy_en = "Choose the actual travel mode and port. Prepare the corresponding flight, train, vessel or vehicle details. An air traveller checks the booking; a road traveller should not invent a flight number."
copy_zh = "选择真实出行方式与口岸，准备对应的航班、火车、船舶或车辆资料。航空旅客核对机票，陆路旅客不要编造航班号。"

[[fields]]
n = "03"
key = "travel_document"
section_en = "Identity"
section_zh = "身份资料"
example = "Document for this trip / 本次旅行证件"
mistake = "Old document number / 旧证件号码"
mistake_why_en = "Use the document you will present."
mistake_why_zh = "使用本次实际出示的证件。"
copy_en = "Prepare the document type, number and issuing country from your travel document, not an old application. This guide does not impose a passport-number length or require a South African ID from every foreign visitor."
copy_zh = "按本次旅行证件准备类型、号码和签发国家，不照搬旧申请。本指南不规定护照号长度，也不要求所有外国游客提供南非身份证。"

[[fields]]
n = "04"
key = "nationality"
section_en = "Identity"
section_zh = "身份资料"
example = "Nationality on document / 证件所载国籍"
mistake = "Country of residence / 居住国家"
mistake_why_en = "Residence does not establish nationality."
mistake_why_zh = "居住地不能直接代替国籍。"
copy_en = "Use the nationality in your travel document. Issuing country is a separate question. Do not substitute the country where you live merely because it appears in your address."
copy_zh = "按旅行证件填写国籍。签发国家是独立资料项，不要因为住址在某国就用该国代替国籍。"

[[fields]]
n = "05"
key = "traveller_name"
section_en = "Identity"
section_zh = "身份资料"
example = "Name on document / 证件姓名"
mistake = "Nickname / 昵称"
mistake_why_en = "A nickname does not match the document name."
mistake_why_zh = "昵称不能代替证件姓名。"
copy_en = "Prepare First Name and Surname as shown in your travel document. Check spelling, not a nickname. For a single name or characters the page cannot accept, ask SARS; those branches have not been verified for this guide."
copy_zh = "按旅行证件准备 First Name（名）与 Surname（姓），核对拼写，不用昵称。单名或页面不接受的字符请向 SARS 求助；本指南未验证这些分支。"

[[fields]]
n = "06"
key = "date_of_birth"
section_en = "Identity"
section_zh = "身份资料"
example = "1991/08/22"
mistake = "Trip date / 行程日期"
mistake_why_en = "This question asks when you were born."
mistake_why_zh = "此项问出生日期。"
copy_en = "Use your document's birth date. The current first screen shows CCYY/MM/DD, illustrated by 1991/08/22. Follow its date control; this example does not prove every accepted format. Do not enter your travel date here."
copy_zh = "使用证件出生日期。当前首屏提示 CCYY/MM/DD，示例为1991/08/22。按实际日期控件操作，示例不代表已验证全部可接受格式；不要填成旅行日期。"

[[fields]]
n = "07"
key = "contact_details"
section_en = "Contact and accommodation"
section_zh = "联系与住宿"
example = "Email you can receive / 可收信邮箱"
mistake = "Invented contact / 虚构联系方式"
mistake_why_en = "An invented address cannot receive your instructions."
mistake_why_zh = "虚构邮箱无法收到本人的申报指示。"
copy_en = "Prepare an accessible email and a mobile number if you have one. The rules allow a port email arranged by Customs in relevant cases; ask for help rather than inventing one. Occupation is supplied where applicable, not assumed mandatory for everyone."
copy_zh = "准备可收信邮箱；有手机时提供号码。适用情况下可按海关安排使用口岸邮箱，请求助，不要自编。职业按适用情况提供，不当作所有人统一必填。"

[[fields]]
n = "08"
key = "stay_address"
section_en = "Contact and accommodation"
section_zh = "联系与住宿"
example = "Arrival: South Africa stay / 入境：南非住宿"
mistake = "Departure: reuse SA stay / 离境：照搬南非住宿"
mistake_why_en = "Departure requires the stay in the destination country."
mistake_why_zh = "离境应准备目的地国家住宿地址。"
copy_en = "For arrival, prepare your South African accommodation address. For departure, rule 15.04(a)(iv) asks for the address where you will stay in the destination country. Check street, city and postal details against the booking. A fixed screen heading does not remove this difference."
copy_zh = "入境准备南非住宿地址；离境按15.04(a)(iv)准备目的地国家住宿地址。对照预订单核对街道、城市和邮政资料，不要因页面固定标题而忽略方向区别。"

[[fields]]
n = "09"
key = "travel_capacity"
section_en = "Journey, companions and goods"
section_zh = "行程、同行人与物品"
example = "Personal holiday / 个人度假"
mistake = "Invent a business entity / 编造代表机构"
mistake_why_en = "Entity details apply when travelling for an entity."
mistake_why_zh = "代表机构出行时才提供机构资料。"
copy_en = "Indicate whether you travel personally or for an entity, then your actual purpose. A personal holiday is the example. Prepare entity details if you represent one; do not invent a company to complete a conditional section."
copy_zh = "说明个人出行还是代表机构，并填写真实目的。示例为个人度假；代表机构时准备其资料，不要为补齐条件段落而编造公司。"

[[fields]]
n = "10"
key = "itinerary"
section_en = "Journey, companions and goods"
section_zh = "行程、同行人与物品"
example = "Current itinerary / 当前行程"
mistake = "Cancelled booking / 已取消订单"
mistake_why_en = "Use the journey you will take."
mistake_why_zh = "应按实际将乘坐的行程填写。"
copy_en = "Prepare origin, destination, dates and transit points where applicable. Use the current booking, not a cancelled one; do not invent a transit country for a direct journey. Inbound connections use the final leg directly to South Africa for the 24-hour filing window."
copy_zh = "准备出发地、目的地、日期和适用的途经地。核对当前订单，不用已取消的行程；直达行程不要编途经国家。入境转机按最后一段直达南非的出发时间计算24小时申报窗口。"

[[fields]]
n = "11"
key = "companions"
section_en = "Journey, companions and goods"
section_zh = "行程、同行人与物品"
example = "Each traveller covered / 每人有申报覆盖"
mistake = "One adult automatically covers all / 默认一人填完全家"
mistake_why_en = "Adding names does not prove all declarations are complete."
mistake_why_zh = "添加姓名不代表所有人已完成申报。"
copy_en = "If you have companions, prepare their names, document numbers and issuing countries. Each person needs declaration coverage, including children and infants. A parent or legal guardian may submit for a child; do not assume adding names completes every adult's declaration."
copy_zh = "有同行者时准备其姓名、证件号和签发国家。每人均须有申报覆盖，包括儿童和婴儿。父母或法定监护人可为孩子申报，不要默认添加姓名就完成所有成年人的申报。"

[[fields]]
n = "12"
key = "goods_currency"
section_en = "Journey, companions and goods"
section_zh = "行程、同行人与物品"
example = "Actual goods and funds / 实际物品和资金"
mistake = "Nil despite declarable goods / 有应申报物品却选Nil"
mistake_why_en = "The declaration must reflect what you carry."
mistake_why_zh = "申报须反映实际携带物品。"
copy_en = "Answer according to what you carry. Where prompted, prepare descriptions, quantities or amounts, values, source and serial numbers. Nil is inappropriate for declarable items. Check current SARS currency rules; this guide does not combine different thresholds into one number."
copy_zh = "按实际携带情况回答。触发问题时准备种类、数量或金额、价值、来源和序列号。有应申报物品不能选 Nil。货币规则请查 SARS 当前说明，不把不同阈值合成一个数字。"
