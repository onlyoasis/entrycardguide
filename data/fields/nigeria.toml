# 8项准备资料，分4组；登录后的全表未逐项核验，不提供预检。

[[fields]]
n = "01"
key = "journey_direction"
section_en = "Journey"
section_zh = "行程方向"
example = "Arrival: entering Nigeria / 入境：进入尼日利亚"
mistake = "Arrival used for exit / 出境仍选入境"
mistake_why_en = "Choose the service for this journey."
mistake_why_zh = "选择本次行程对应业务。"
copy_en = "Choose Arrival for entry and Departure for leaving Nigeria. These are separate services. The example is inbound; an earlier Landing Card does not automatically complete the later exit process."
copy_zh = "进入尼日利亚选 Arrival，离开选 Departure，这是两项业务。示例为入境，不要默认之前的入境卡已完成之后的出境手续。"

[[fields]]
n = "02"
key = "full_name"
section_en = "Travel documents"
section_zh = "旅行证件"
example = "Name on passport / 护照姓名"
mistake = "Nickname / 昵称"
mistake_why_en = "The account guidance asks for your passport name."
mistake_why_zh = "账户说明要求姓名与护照一致。"
copy_en = "Copy your name from the passport for this trip, not a nickname. The public account page separates first, middle and last names. Do not invent a middle name or remove spaces and hyphens without official instructions."
copy_zh = "从本次护照抄录姓名，不用昵称。公开账户页分名、中间名和姓，不编造中间名，不在没有官方指示时自行删除空格和连字符。"

[[fields]]
n = "03"
key = "passport_number"
section_en = "Travel documents"
section_zh = "旅行证件"
example = "Current passport number / 当前护照号码"
mistake = "Old passport number / 旧护照号码"
mistake_why_en = "Check the passport you will present."
mistake_why_zh = "核对本次实际出示的护照。"
copy_en = "Prepare the number from your travel passport and compare each character. Do not copy an old passport from a saved trip record. Public guidance names passport or visa details; this guide has not verified number lengths or every application branch."
copy_zh = "准备本次旅行护照号码并逐字符核对，不照搬旧行程保存的旧护照号。公开说明要求护照或签证资料；本指南未验证号码长度或全部申请分支。"

[[fields]]
n = "04"
key = "visa_number"
section_en = "Travel documents"
section_zh = "旅行证件"
example = "Applicable visa details / 本人适用签证资料"
mistake = "Invented visa number / 编造签证号"
mistake_why_en = "Do not invent a number for a visa-free route."
mistake_why_zh = "走免签路径也不能编造号码。"
copy_en = "Prepare visa details if they apply to your route. The portal mentions a visa or passport number. Visa-free and ECOWAS travellers should follow their actual category, not invent a visa. Visa exemption does not itself establish a card exemption."
copy_zh = "实际路径适用时准备签证资料。门户说明使用签证号或护照号。免签和 ECOWAS 旅客按真实类别操作，不编签证号；免签本身不等于免填卡。"

[[fields]]
n = "05"
key = "date_of_birth"
section_en = "Personal details"
section_zh = "个人资料"
example = "Birth date on passport / 护照出生日期"
mistake = "Date of issue / 签发日期"
mistake_why_en = "Birth and passport issuance are different dates."
mistake_why_zh = "出生日期与护照签发日期是两回事。"
copy_en = "Use the birth date on your passport, not its date of issue. Follow the date control in your application. The public retrieval page uses a date picker; that does not establish a universal typed format for all application screens."
copy_zh = "使用护照出生日期，不填成签发日期。按申请中的日期控件操作。公开找卡页使用日期选择器，不能据此断定全部申请页面要求某种手输格式。"

[[fields]]
n = "06"
key = "nationality"
section_en = "Personal details"
section_zh = "个人资料"
example = "Nationality on passport / 护照国籍"
mistake = "Current residence / 当前居住地"
mistake_why_en = "Where you live does not determine document nationality."
mistake_why_zh = "居住地不决定证件国籍。"
copy_en = "Match nationality to your travel document, not your residence. This is separate from country of issuance on Get Card. For dual nationality or unclear eligibility, confirm with NIS before assuming an exemption."
copy_zh = "国籍与旅行证件一致，不用居住地代替，也不与 Get Card 页独立的签发国问题混淆。双国籍或适用范围不明时先向 NIS 确认，不自行判断免填。"

[[fields]]
n = "07"
key = "email"
section_en = "Contact details"
section_zh = "联系方式"
example = "Email you can access / 可访问邮箱"
mistake = "Inaccessible old inbox / 无法访问的旧邮箱"
mistake_why_en = "You need access to the confirmation and card email."
mistake_why_zh = "需要能读取确认和卡片邮件。"
copy_en = "Use an inbox you can open while travelling. NIS says it emails successful confirmation and the card, which also allows reprinting. An old inbox you cannot access will not help you recover that message."
copy_zh = "使用旅行途中能打开的邮箱。NIS 说明成功确认和卡片会发邮件，可据此重新打印。无法访问的旧邮箱不便找回邮件。"

[[fields]]
n = "08"
key = "phone"
section_en = "Contact details"
section_zh = "联系方式"
example = "Your current contact / 本人当前联系方式"
mistake = "Copied sample number / 照抄示例号码"
mistake_why_en = "A sample number does not let officials reach you."
mistake_why_zh = "示例号码不能让工作人员联系到本人。"
copy_en = "Prepare a current number where you can be contacted. Follow the official input instructions; this guide has not verified prefix rules, length limits or mandatory status. Do not use a copied sample number as your own contact."
copy_zh = "准备当前能联系到本人的号码。按官方说明输入；本指南未验证区号规则、长度或统一必填性。不要把照抄的示例号码用作本人联系方式。"
