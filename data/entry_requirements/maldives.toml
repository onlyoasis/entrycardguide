[[items]]
topic = "validity"
basis = "other"
value_en = "At least 1 month"
value_zh = "至少 1 个月"
value_zh_hant = "至少 1 個月"
note_en = "Maldives Immigration does not say which date to count from. To be safe, count from the day you leave."
