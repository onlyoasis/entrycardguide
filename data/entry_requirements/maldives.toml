[[items]]
topic = "onward_ticket"
status = "required"
note_en = "You also need a prepaid, confirmed booking at a registered place to stay. A sponsorship approved by Maldives Immigration can replace the ticket, the booking and the funds."
note_zh = "还要有在登记住宿场所的已付款确认预订。持移民局批准的担保，可以代替机票、住宿预订和资金。"
note_zh_hant = "還要有在登記住宿場所的已付款確認預訂。持移民局批准的擔保，可以代替機票、住宿預訂和資金。"
source = "https://www.immigration.gov.mv/visa/tourist-visa"
quote = "A complete travel itinerary, including confirmed return journey tickets, a prepaid confirmed booking at a registered facility, and sufficient funds to cover the stay in the Maldives, or hold a sponsorship approved by Maldives Immigration."

