# United Kingdom — passport and documents for a short visit.
# Each [[items]] entry quotes the GOV.UK page in `source`. Checked 2026-10-23.
# No onward-ticket rule: GOV.UK asks for money that covers the journey home.

checked = "2026-10-23"

[[items]]
topic = "validity"
basis = "stay"
source = "https://www.gov.uk/standard-visitor"
