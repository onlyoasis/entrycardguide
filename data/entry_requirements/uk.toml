[[items]]
topic = "passport"
value_en = "Travel on the passport you used for the ETA"
value_zh = "入境用申请 ETA 时的那本护照"
value_zh_hant = "入境用申請 ETA 時的那本護照"
applies_en = "ETA"
applies_zh = "ETA"
applies_zh_hant = "ETA"
note_en = "The ETA is linked to the passport you applied with."
note_zh = "ETA 与申请时用的护照绑定。"
note_zh_hant = "ETA 與申請時用的護照綁定。"
source = "https://www.gov.uk/eta/apply"
