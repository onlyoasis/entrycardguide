[[items]]
topic = "validity"
basis = "other"
value_en = "At least 6 months left"
value_zh = "至少还剩 6 个月"
value_zh_hant = "至少還剩 6 個月"
note_en = "ICA does not say which date to count from. To be safe, count from the day you leave Singapore."
note_zh = "ICA 没写从哪天算起，稳妥起见按离开新加坡那天算。"
note_zh_hant = "ICA 沒寫從哪天算起，穩妥起見按離開新加坡那天算。"
source = "https://www.ica.gov.sg/enter-transit-depart/entering-singapore"
quote = "All travellers, except Singapore passport holders, must ensure their passport has a minimum validity of 6 months."

