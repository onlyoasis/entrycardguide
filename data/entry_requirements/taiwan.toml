# Taiwan — passport and documents for a short visit.
# Sources: Bureau of Consular Affairs (MOFA) visa-exemption page and the
# Regulations Governing Visa-Exempt Entry and Visa-on-Arrival. Checked 2026-10-23.

checked = "2026-10-23"

[[items]]
