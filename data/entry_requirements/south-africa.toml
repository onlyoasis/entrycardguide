note_zh = "列在入境口岸可能要求出示的材料里，同时列了住宿证明。"
note_zh_hant = "列在入境口岸可能要求出示的材料裡，同時列了住宿證明。"
source = "https://eta.dha.gov.za/faq"
quote = "Return or onward ticket"

