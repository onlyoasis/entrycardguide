source = "https://gov.uz/en/mfa/pages/o-zbekiston-respublikasi-vizasi"
quote = "A visa-free regime for up to five days in Uzbekistan has been introduced for citizens of the countries listed in Annex 2, provided that foreign citizens transit through international airports of the Republic of Uzbekistan and have a flight ticket to a third country issued by Uzbekistan Airways JSC."
