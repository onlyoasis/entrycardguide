note_en = "For a 90-day stay, that is 150 days left when you arrive. The ministry also advises 6 months from arrival. Citizens who may enter with a national ID card are exempt."
note_zh = "获准停留 90 天的，入境时护照要剩 150 天。外交部另外建议入境时剩 6 个月。可凭身份证入境的国家公民不受此限。"
note_zh_hant = "獲准停留 90 天的，入境時護照要剩 150 天。外交部另外建議入境時剩 6 個月。可憑身份證入境的國家公民不受此限。"
source = "https://www.mfa.gov.tr/passport-validity-requirements-while-entering-turkey-in-accordance-with-law-on-foreigners-and-international-protection.en.mfa"
quote = "foreigners wishing to enter Türkiye should carry a travel document (passport) with an expiration date at least 60 days beyond the “duration of stay” of their visa, e-Visa, visa exemption, or residence permit."

