# Philippines — passport and documents for a short visit.
# Sources: Philippine Embassy in Tokyo (DFA), visa-free entry page, Bureau of
# Immigration Operations Order SBM-2015-026, and the DFA eVisa visa policy page
# (a single-page app, read in a browser). Checked 2026-10-23.

checked = "2026-10-23"

[[items]]
topic = "validity"
basis = "departure"
months = 6
applies_en = "Visa-free entry"
applies_zh = "免签入境"
applies_zh_hant = "免簽入境"
note_en = "Counted from the end of your planned stay."
note_zh = "从计划停留期结束那天算起。"
note_zh_hant = "從計劃停留期結束那天算起。"
