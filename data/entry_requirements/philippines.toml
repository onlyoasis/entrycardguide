note_zh = "还要有已确认的酒店预订；这项免签只能从马尼拉 NAIA 机场和宿雾麦克坦机场入境。"
note_zh_hant = "還要有已確認的酒店預訂；這項免簽只能從馬尼拉 NAIA 機場和宿霧麥克坦機場入境。"
source = "https://evisa.gov.ph/page/policy"
quote = "A return or onward ticket to the next country of destination."

