[["thailand/how-to-fill"]]
q = "How many days before arrival can I fill in the Thailand Arrival Card (TDAC)?"
a = "Within 3 days before you arrive in Thailand. The official site rejects earlier submissions, so if you land on May 14, file on May 11 or later."
q_zh = "泰国入境卡（TDAC）提前几天填？"
q_zh_hant = "泰國入境卡（TDAC）提前幾天填？"
a_zh = "抵达泰国前 3 天内。再早提交，官方站会拒绝；比如 5 月 14 日抵达，5 月 11 日起再填。"
a_zh_hant = "抵達泰國前 3 天內。再早提交，官方站會拒絕；比如 5 月 14 日抵達，5 月 11 日起再填。"

[["thailand/how-to-fill"]]
q = "Do I need to print the Thailand Arrival Card QR code?"
a = "No. After you submit, the official site shows a QR code and emails the same code as a PDF. A screenshot, the PDF or the email on your phone is fine at immigration."
q_zh = "泰国入境卡要打印吗？"
q_zh_hant = "泰國入境卡要列印嗎？"
a_zh = "不用打印。提交后官网会显示二维码，邮件里也有同一份二维码 PDF。入境时出示截图、PDF 或邮件里的二维码都可以。"
a_zh_hant = "不用列印。提交後官網會顯示 QR Code，郵件裡也有同一份 QR Code PDF。入境時出示截圖、PDF 或郵件裡的 QR Code 都可以。"

[["thailand/how-to-fill"]]
q = "What arrival date goes on the TDAC for an overnight flight?"
a = "The local date you land in Thailand, in YYYY-MM-DD format. A flight that leaves on May 12 and lands in Bangkok on May 14 is entered as 2026-05-14."
q_zh = "红眼航班的泰国入境卡抵达日期怎么填？"
q_zh_hant = "紅眼航班的泰國入境卡抵達日期怎麼填？"
a_zh = "填真正落地泰国的日期，按泰国本地时间，格式 YYYY-MM-DD。5 月 12 日起飞、5 月 14 日落地曼谷，就填 2026-05-14。"
a_zh_hant = "填真正落地泰國的日期，按泰國本地時間，格式 YYYY-MM-DD。5 月 12 日起飛、5 月 14 日落地曼谷，就填 2026-05-14。"

[["malaysia/how-to-fill"]]
q = "When can I submit the Malaysia Arrival Card (MDAC)?"
a = "Within 3 days before your arrival in Malaysia. The MDAC site rejects submissions outside that window."
q_zh = "马来西亚入境卡（MDAC）提前几天填？"
q_zh_hant = "馬來西亞入境卡（MDAC）提前幾天填？"
a_zh = "抵达马来西亚前 3 天内。MDAC 官网会拒绝窗口外的提交。"
a_zh_hant = "抵達馬來西亞前 3 天內。MDAC 官網會拒絕窗口外的提交。"

[["malaysia/how-to-fill"]]
q = "Do I need to print the MDAC confirmation?"
a = "No. You do not need to print or show it: the officer scans your passport and your MDAC is already linked. Keep the email on your phone in case their system has issues."
q_zh = "马来西亚入境卡要打印吗？"
q_zh_hant = "馬來西亞入境卡要列印嗎？"
a_zh = "不需要打印，也不必出示确认信。官员扫护照时，你的 MDAC 已在系统里关联好。手机上留着确认邮件，以防系统出问题。"
a_zh_hant = "不需要列印，也不必出示確認信。官員掃護照時，你的 MDAC 已在系統裡關聯好。手機上留著確認郵件，以防系統出問題。"

[["malaysia/how-to-fill"]]
q = "What address do I enter on the Malaysia Arrival Card?"
a = "Where you will stay. A hotel name and city is enough, for example Mandarin Oriental Kuala Lumpur. For an Airbnb use the host's confirmed address; with several stops use the first night."
q_zh = "马来西亚入境卡地址怎么填？"
q_zh_hant = "馬來西亞入境卡地址怎麼填？"
a_zh = "填入住地。酒店名加城市就够，例如 Mandarin Oriental Kuala Lumpur；Airbnb 用房东确认的地址；多地停留填第一晚。"
a_zh_hant = "填入住地。酒店名加城市就夠，例如 Mandarin Oriental Kuala Lumpur；Airbnb 用房東確認的地址；多地停留填第一晚。"

[["malaysia/how-to-fill"]]
q = "How do I enter my name on the MDAC?"
a = "MDAC has one full-name field. Type your name in Latin letters in the order printed on your passport photo page, and do not reorder it."
q_zh = "马来西亚入境卡名字怎么填？"
q_zh_hant = "馬來西亞入境卡名字怎麼填？"
a_zh = "MDAC 只有一个全名字段。按护照资料页印刷的顺序填拉丁字母，不要按姓、名重新排列。"
a_zh_hant = "MDAC 只有一個全名欄位。按護照資料頁印刷的順序填拉丁字母，不要按姓、名重新排列。"

[["indonesia/how-to-fill"]]
q = "Can one person fill in the Indonesia e-CD for the whole family?"
a = "Yes. One adult fills the form for the whole family, and each additional person adds a section to the same submission."
q_zh = "印尼入境卡可以一个人帮全家填吗？"
q_zh_hant = "印尼入境卡可以一個人幫全家填嗎？"
a_zh = "可以。一名成年人为全家填，每位额外家人在同一份提交里加一段。"
a_zh_hant = "可以。一名成年人為全家填，每位額外家人在同一份提交里加一段。"

[["indonesia/how-to-fill"]]
q = "I did not get the e-CD QR code email. What should I do?"
a = "Check spam first. If it is still missing after an hour, submit again with a Gmail address as a backup; some mailboxes have lost these emails."
q_zh = "没收到印尼入境卡二维码邮件怎么办？"
q_zh_hant = "沒收到印尼入境卡 QR Code 郵件怎麼辦？"
a_zh = "先看垃圾箱。1 小时还没收到，就换 Gmail 再提交一份作为备份，有些邮箱会丢这类邮件。"
a_zh_hant = "先看垃圾箱。1 小時還沒收到，就換 Gmail 再提交一份作為備份，有些信箱會丟這類郵件。"

[["korea/how-to-fill"]]
q = "What is the official Korea e-Arrival Card website?"
a = "www.e-arrivalcard.go.kr, on the government .go.kr domain. Filing there is free."
q_zh = "韩国入境卡官网网址是什么？"
q_zh_hant = "韓國入境卡官網網址是什麼？"
a_zh = "www.e-arrivalcard.go.kr，在政府 .go.kr 域名下，填写免费。"
a_zh_hant = "www.e-arrivalcard.go.kr，在政府 .go.kr 域名下，填寫免費。"

[["korea/how-to-fill"]]
q = "Is the Korea e-Arrival Card the same as K-ETA?"
a = "No. K-ETA, visas, Q-Code and the e-Arrival Card are separate systems. If a page asks you to pay a K-ETA or visa fee, you are not just filing the free e-Arrival Card."
q_zh = "韩国入境卡和 K-ETA 是一回事吗？"
q_zh_hant = "韓國入境卡和 K-ETA 是一回事嗎？"
a_zh = "不是。K-ETA、签证、Q-Code 和 e-Arrival Card 是不同系统。如果页面要求你付 K-ETA 或签证费，你就不只是在填免费的电子入境卡。"
a_zh_hant = "不是。K-ETA、簽證、Q-Code 和 e-Arrival Card 是不同系統。如果頁面要求你付 K-ETA 或簽證費，你就不只是在填免費的電子入境卡。"

[["korea/how-to-fill"]]
q = "Which flight number goes on the Korea e-Arrival Card?"
a = "The operating flight number, for example KE82, not the airline name. On a codeshare, match the operating carrier."
q_zh = "韩国入境卡航班号怎么填？"
q_zh_hant = "韓國入境卡航班號怎麼填？"
a_zh = "填实际承运的航班号，例如 KE82，不要写航司名称；代码共享航班按实际承运航司填。"
a_zh_hant = "填實際承運的航班號，例如 KE82，不要寫航司名稱；代碼共享航班按實際承運航司填。"

[["korea/how-to-fill"]]
q = "How do I write my name on the Korea e-Arrival Card?"
a = "Use the Latin-letter name printed in your passport, for example KIM MINJUN, not a name in Korean or another non-Latin script."
q_zh = "韩国入境卡姓名怎么填？"
q_zh_hant = "韓國入境卡姓名怎麼填？"
a_zh = "填护照上的拉丁字母姓名，例如 KIM MINJUN，不要填韩文等非拉丁文字。"
a_zh_hant = "填護照上的拉丁字母姓名，例如 KIM MINJUN，不要填韓文等非拉丁文字。"

[["philippines/how-to-fill"]]
q = "What if my flight changes after I file eTravel?"
a = "Update or refile before travel, using the passport and itinerary you will actually use, then save the new QR code."
q_zh = "菲律宾入境卡填完航班改了怎么办？"
q_zh_hant = "菲律賓入境卡填完航班改了怎麼辦？"
a_zh = "出发前更新或重新提交，按你实际会使用的护照和行程填写，再保存新的二维码。"
a_zh_hant = "出發前更新或重新提交，按你實際會使用的護照和行程填寫，再保存新的 QR Code。"

[["philippines/how-to-fill"]]
q = "How should I keep the Philippines eTravel QR code?"
a = "Screenshot it right after you submit. You may be asked for it at check-in and on arrival, and a screenshot is safer than relying on airport Wi-Fi."
q_zh = "菲律宾入境卡二维码怎么保存？"
q_zh_hant = "菲律賓入境卡 QR Code 怎麼保存？"
a_zh = "提交后马上截图保存。值机和入境时都可能被要求查看，截图比依赖机场 Wi-Fi 稳。"
a_zh_hant = "提交後馬上截圖保存。值機和入境時都可能被要求查看，截圖比依賴機場 Wi-Fi 穩。"

[["philippines/how-to-fill"]]
q = "Is Philippines eTravel a visa?"
a = "No. eTravel is a free electronic travel declaration at etravel.gov.ph. It is not a visa."
q_zh = "菲律宾 eTravel 是签证吗？"
q_zh_hant = "菲律賓 eTravel 是簽證嗎？"
a_zh = "不是。eTravel 是免费的电子旅行申报，官网 etravel.gov.ph，它不是签证。"
a_zh_hant = "不是。eTravel 是免費的電子旅行申報，官網 etravel.gov.ph，它不是簽證。"

[["taiwan/how-to-fill"]]
q = "Do I need to print the Taiwan Arrival Card?"
a = "No. You get a confirmation email or file, but you do not have to show it: scanning your passport retrieves the TWAC record. Bring the same passport you used to submit."
q_zh = "台湾入境卡要打印吗？"
q_zh_hant = "臺灣入境卡要列印嗎？"
a_zh = "不用。系统会发送确认邮件或电子文件，但查验时不必出示，扫描护照即可调出 TWAC 资料。携带提交时用的同一本护照就行。"
a_zh_hant = "不用。系統會發送確認郵件或電子文件，但查驗時不必出示，掃描護照即可調出 TWAC 資料。攜帶提交時用的同一本護照就行。"

[["taiwan/how-to-fill"]]
q = "How many days before arrival can I submit the Taiwan Arrival Card?"
a = "Within 7 days before arrival."
q_zh = "台湾入境卡提前几天填？"
q_zh_hant = "臺灣入境卡提前幾天填？"
a_zh = "抵达前 7 天内提交。"
a_zh_hant = "抵達前 7 天內提交。"

[["taiwan/how-to-fill"]]
q = "Can I fill in the Taiwan Arrival Card for my family or group?"
a = "Yes. One person can file for up to 10 travellers in a single submission, and the group-file import supports up to 16."
q_zh = "台湾入境卡可以帮家人一起填吗？"
q_zh_hant = "臺灣入境卡可以幫家人一起填嗎？"
a_zh = "可以。一人可单笔为最多 10 名旅客填写，团体档案汇入支持最多 16 人。"
a_zh_hant = "可以。一人可單筆為最多 10 名旅客填寫，團體檔案匯入支持最多 16 人。"

[["india/how-to-fill"]]
q = "When do I submit the India e-Arrival Card?"
a = "Within 72 hours before arrival. Foreign travellers file it, including OCI cardholders; Indian passport holders do not."
q_zh = "印度入境卡提前几天填？"
q_zh_hant = "印度入境卡提前幾天填？"
a_zh = "抵达前 72 小时内提交。外国旅客都要填，OCI 持有人也一样；印度护照持有人不用填。"
a_zh_hant = "抵達前 72 小時內提交。外國旅客都要填，OCI 持有人也一樣；印度護照持有人不用填。"

[["india/how-to-fill"]]
q = "Does the India e-Arrival Card replace the e-Visa?"
a = "No. The confirmation does not replace a visa, e-Visa or OCI status. Completing either form does not complete the other."
q_zh = "印度入境卡能代替 e-Visa 吗？"
q_zh_hant = "印度入境卡能代替 e-Visa 嗎？"
a_zh = "不能。入境卡的确认不能替代签证、e-Visa 或 OCI 身份，两个表单各填各的。"
a_zh_hant = "不能。入境卡的確認不能替代簽證、e-Visa 或 OCI 身份，兩個表單各填各的。"

[["japan/how-to-fill"]]
q = "How do I prepare the Visit Japan Web QR codes?"
a = "Generate them before you travel and keep a screenshot. If the airport asks for paper, fill in the paper form instead."
q_zh = "日本入境卡（Visit Japan Web）二维码怎么准备？"
q_zh_hant = "日本入境卡（Visit Japan Web）QR Code 怎麼準備？"
