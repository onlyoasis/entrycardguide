# FAQ for pages whose content files should stay untouched (see
# layouts/partials/page-faq.html). Keyed by language-neutral page path.
# Fields: q / a (en), q_zh / a_zh (zh-Hans). `*_zh_hant` siblings are generated
# by `npm run sync:zh-hant` — do not edit. Answers restate facts the country's
# guides already publish (this page, or its hub / form page); anything new
# needs a source on one of those pages first.
# Questions follow Search Console queries for the page (2026-09-15..10-12).

[["uk/how-to-fill"]]
q = "What goes in address line 1 on the UK ETA?"
a = "Your home address: the place you live, not where you will stay in the UK. In a typical split, line 1 holds the house number and street, for example 12 Example Road, and a flat number goes on an additional line. Town, postal code and country go in their own boxes when the form provides them. Follow the labels shown in your application."
q_zh = "UK ETA 的 Address line 1 填什么？"
q_zh_hant = "UK ETA 的 Address line 1 填什麼？"
a_zh = "填你的家庭住址，也就是你实际居住的地方，不是这次在英国的住处。常见的写法是第 1 行写门牌号和街道，例如 12 Example Road，公寓号写在附加行；城镇、邮编和国家有单独的框就分开填。以申请页面上显示的字段名为准。"
a_zh_hant = "填你的家庭住址，也就是你實際居住的地方，不是這次在英國的住處。常見的寫法是第 1 行寫門牌號和街道，例如 12 Example Road，公寓號寫在附加行；城鎮、郵編和國家有單獨的框就分開填。以申請頁面上顯示的欄位名為準。"

[["uk/how-to-fill"]]
q = "What does \"provide the address where you live most of the time\" mean?"
a = "It asks for your home address, the place you usually live. Keep it separate from your accommodation for the UK visit."
q_zh = "“Provide the address where you live most of the time”是什么意思？"
q_zh_hant = "“Provide the address where you live most of the time”是什麼意思？"
a_zh = "它问的是你的家庭住址，也就是你平时居住的地方。不要填这次赴英期间的住宿地址。"
a_zh_hant = "它問的是你的家庭住址，也就是你平時居住的地方。不要填這次赴英期間的住宿地址。"

[["uk/how-to-fill"]]
q = "How much does the UK ETA cost?"
a = "The official fee is £20 for each person, including babies and children. There is no family discount. If a site asks for more, the difference is a commercial service fee."
q_zh = "UK ETA 多少钱？"
q_zh_hant = "UK ETA 多少錢？"
a_zh = "官方费用是每人 20 英镑，婴儿和儿童也一样，没有家庭优惠。如果某个网站收得更多，多出来的部分是商业服务费。"
a_zh_hant = "官方費用是每人 20 英鎊，嬰兒和兒童也一樣，沒有家庭優惠。如果某個網站收得更多，多出來的部分是商業服務費。"

