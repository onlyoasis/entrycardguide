[["thailand/how-to-fill"]]
q = "How many days before arrival can I fill in the Thailand Arrival Card (TDAC)?"
a = "Within 3 days before you arrive in Thailand. The official site rejects earlier submissions, so if you land on May 14, file on May 11 or later."
q_zh = "泰国入境卡（TDAC）提前几天填？"
q_zh_hant = "泰國入境卡（TDAC）提前幾天填？"
a_zh = "抵达泰国前 3 天内。再早提交，官方站会拒绝；比如 5 月 14 日抵达，5 月 11 日起再填。"
a_zh_hant = "抵達泰國前 3 天內。再早提交，官方站會拒絕；比如 5 月 14 日抵達，5 月 11 日起再填。"

[["thailand/how-to-fill"]]
q = "Do I need to print the Thailand Arrival Card QR code?"
a = "No. After you submit, the official site shows a QR code and emails the same code as a PDF. A screenshot, the PDF or the email on your phone is fine at immigration."
q_zh = "泰国入境卡要打印吗？"
q_zh_hant = "泰國入境卡要列印嗎？"
a_zh = "不用打印。提交后官网会显示二维码，邮件里也有同一份二维码 PDF。入境时出示截图、PDF 或邮件里的二维码都可以。"
a_zh_hant = "不用列印。提交後官網會顯示 QR Code，郵件裡也有同一份 QR Code PDF。入境時出示截圖、PDF 或郵件裡的 QR Code 都可以。"

[["thailand/how-to-fill"]]
q = "What arrival date goes on the TDAC for an overnight flight?"
a = "The local date you land in Thailand. A flight that leaves on May 12 and lands in Bangkok on May 14 is entered as May 14; the TDAC date box shows it as 2026/05/14."
q_zh = "红眼航班的泰国入境卡抵达日期怎么填？"
q_zh_hant = "紅眼航班的泰國入境卡抵達日期怎麼填？"
a_zh = "填真正落地泰国的日期，按泰国本地时间。5 月 12 日起飞、5 月 14 日落地曼谷，就选 5 月 14 日，TDAC 日期框显示为 2026/05/14。"
a_zh_hant = "填真正落地泰國的日期，按泰國本地時間。5 月 12 日起飛、5 月 14 日落地曼谷，就選 5 月 14 日，TDAC 日期框顯示為 2026/05/14。"

[["malaysia/how-to-fill"]]
q = "When can I submit the Malaysia Arrival Card (MDAC)?"
a = "Within 3 days before your arrival in Malaysia. The arrival-date calendar on the MDAC only offers today and the next two days."
q_zh = "马来西亚入境卡（MDAC）提前几天填？"
q_zh_hant = "馬來西亞入境卡（MDAC）提前幾天填？"
a_zh = "抵达马来西亚前 3 天内。MDAC 上的抵达日期日历只开放今天和之后两天。"
a_zh_hant = "抵達馬來西亞前 3 天內。MDAC 上的抵達日期日曆只開放今天和之後兩天。"

[["malaysia/how-to-fill"]]
q = "Do I need to print the MDAC confirmation?"
a = "No official page we found asks you to print it. The Immigration Department's posters do say to present your MDAC registration at the counter during the passport check, so keep the email or a screenshot on your phone."
q_zh = "马来西亚入境卡要打印吗？"
q_zh_hant = "馬來西亞入境卡要列印嗎？"
a_zh = "我们没找到要求打印的官方说明。不过移民局海报写明，入境时要在柜台核验护照时出示 MDAC 登记，所以手机上留好确认邮件或截图。"
a_zh_hant = "我們沒找到要求列印的官方說明。不過移民局海報寫明，入境時要在櫃檯核驗護照時出示 MDAC 登記，所以手機上留好確認郵件或截圖。"

[["malaysia/how-to-fill"]]
q = "What address do I enter on the Malaysia Arrival Card?"
a = "Where you will stay, in two lines of up to 100 characters. The first line needs at least three words, such as the street address from your booking or MANDARIN ORIENTAL KUALA LUMPUR; a single word like AIRBNB is refused. Then pick the State and City from the lists and type the 5-digit Postcode. For an Airbnb use the host's confirmed address; with several stops use the first night."
q_zh = "马来西亚入境卡地址怎么填？"
q_zh_hant = "馬來西亞入境卡地址怎麼填？"
a_zh = "填入住地，分两行，每行最多 100 字符。第一行至少三个词，例如订单上的街道地址或 MANDARIN ORIENTAL KUALA LUMPUR；只写 AIRBNB 这样一个词会被拒。然后从列表选州（State）和城市（City），填 5 位邮编。Airbnb 用房东确认的地址；多地停留填第一晚。"
a_zh_hant = "填入住地，分兩行，每行最多 100 字符。第一行至少三個詞，例如訂單上的街道地址或 MANDARIN ORIENTAL KUALA LUMPUR；只寫 AIRBNB 這樣一個詞會被拒。然後從列表選州（State）和城市（City），填 5 位郵編。Airbnb 用房東確認的地址；多地停留填第一晚。"

[["malaysia/how-to-fill"]]
q = "How do I enter my name on the MDAC?"
a = "MDAC has one Name box for your full name, up to 60 characters, letters and spaces only. Type it in the order printed on your passport photo page, and do not reorder it."
q_zh = "马来西亚入境卡名字怎么填？"
q_zh_hant = "馬來西亞入境卡名字怎麼填？"
a_zh = "MDAC 只有一个姓名框填全名，最多 60 字符，只能用字母和空格。按护照资料页印刷的顺序填，不要按姓、名重新排列。"
a_zh_hant = "MDAC 只有一個姓名框填全名，最多 60 字符，只能用字母和空格。按護照資料頁印刷的順序填，不要按姓、名重新排列。"

[["malaysia/how-to-fill"]]
q = "How do I check that my MDAC went through?"
a = "Open CHECK REGISTRATION on imigresen-online.imi.gov.my/mdac/main, enter your passport number, choose your nationality and type the PIN sent to your email, then drag the puzzle piece to verify. If the puzzle will not take the piece, press RESET."
q_zh = "马来西亚入境卡怎么查询是否提交成功？"
q_zh_hant = "馬來西亞入境卡怎麼查詢是否提交成功？"
a_zh = "在 imigresen-online.imi.gov.my/mdac/main 点 CHECK REGISTRATION，填护照号、选国籍，输入发到邮箱的 PIN，再拖动拼图验证。拼图拖不进去就点 RESET 换一张。"
a_zh_hant = "在 imigresen-online.imi.gov.my/mdac/main 點 CHECK REGISTRATION，填護照號、選國籍，輸入發到信箱的 PIN，再拖動拼圖驗證。拼圖拖不進去就點 RESET 換一張。"

[["malaysia/how-to-fill"]]
q = "I lost my MDAC PIN. What do I do?"
a = "Click Forgot your PIN? on the Check Registration page and enter your passport number and nationality. A new PIN goes to your registered email. The portal allows one reset a day."
q_zh = "马来西亚入境卡 PIN 忘了怎么办？"
q_zh_hant = "馬來西亞入境卡 PIN 忘了怎麼辦？"
a_zh = "在查询登记页点 Forgot your PIN?，填护照号和国籍，新 PIN 会发到你登记的邮箱。每天只能重置一次。"
a_zh_hant = "在查詢登記頁點 Forgot your PIN?，填護照號和國籍，新 PIN 會發到你登記的信箱。每天只能重置一次。"

[["malaysia/how-to-fill"]]
q = "Can I edit my MDAC after submitting it?"
a = "The portal has no edit option, and we found no official instructions for amending a submitted MDAC. For a correction, ask the Immigration Department through the MDAC contact link on the portal: eapp.imi.gov.my/spo."
q_zh = "马来西亚入境卡填错了怎么修改？"
q_zh_hant = "馬來西亞入境卡填錯了怎麼修改？"
a_zh = "MDAC 门户没有修改入口，我们也没找到官方公布的修改办法。需要更正的话，通过门户上的 MDAC 咨询渠道问移民局：eapp.imi.gov.my/spo。"
a_zh_hant = "MDAC 門戶沒有修改入口，我們也沒找到官方公佈的修改辦法。需要更正的話，通過門戶上的 MDAC 諮詢渠道問移民局：eapp.imi.gov.my/spo。"

[["indonesia/how-to-fill"]]
q = "Can one person fill in the Indonesia e-CD for the whole family?"
a = "Yes. One adult fills the form for the whole family, and each additional person adds a section to the same submission."
q_zh = "印尼入境卡可以一个人帮全家填吗？"
q_zh_hant = "印尼入境卡可以一個人幫全家填嗎？"
a_zh = "可以。一名成年人为全家填，每位额外家人在同一份提交里加一段。"
a_zh_hant = "可以。一名成年人為全家填，每位額外家人在同一份提交里加一段。"

[["indonesia/how-to-fill"]]
q = "I did not get the e-CD QR code email. What should I do?"
a = "Check spam first. If it is still missing after an hour, submit again with a Gmail address as a backup; some mailboxes have lost these emails."
q_zh = "没收到印尼入境卡二维码邮件怎么办？"
q_zh_hant = "沒收到印尼入境卡 QR Code 郵件怎麼辦？"
a_zh = "先看垃圾箱。1 小时还没收到，就换 Gmail 再提交一份作为备份，有些邮箱会丢这类邮件。"
a_zh_hant = "先看垃圾箱。1 小時還沒收到，就換 Gmail 再提交一份作為備份，有些信箱會丟這類郵件。"

[["korea/how-to-fill"]]
q = "Does the Korea e-Arrival Card website support Chinese?"
a = "Yes. The portal works in 7 languages: Korean, English, Simplified Chinese, Japanese, Thai, Vietnamese and Russian."
q_zh = "韩国入境卡官网支持中文吗？"
q_zh_hant = "韓國入境卡官網支持中文嗎？"
a_zh = "支持。门户有 7 种语言：韩语、英语、简体中文、日语、泰语、越南语、俄语。"
a_zh_hant = "支持。門戶有 7 種語言：韓語、英語、簡體中文、日語、泰語、越南語、俄語。"

[["korea/how-to-fill"]]
q = "How early can I fill in the Korea e-Arrival Card?"
a = "From 3 days before arrival, in Korea Standard Time. Landing on 31 January means you can file on 29, 30 or 31 January, or after landing before immigration. A card expires 72 hours after submission."
q_zh = "韩国入境卡提前几天填？"
q_zh_hant = "韓國入境卡提前幾天填？"
a_zh = "抵达前 3 天起，按韩国标准时间算。1 月 31 日抵达，可在 1 月 29、30、31 日提交，落地后过入境审查前也行。提交后 72 小时失效。"
a_zh_hant = "抵達前 3 天起，按韓國標準時間算。1 月 31 日抵達，可在 1 月 29、30、31 日提交，落地後過入境審查前也行。提交後 72 小時失效。"

[["korea/how-to-fill"]]
q = "Do I need to print or show the Korea e-Arrival Card? Is there a QR code?"
a = "No printout and nothing to show. The official guides describe an issue number and a PDF, also emailed, not a QR code you must present. If a detail was wrong, the officer may ask for the issue number, so keep the PDF on your phone."
q_zh = "韩国入境卡要打印吗？有二维码吗？"
q_zh_hant = "韓國入境卡要列印嗎？有 QR Code 嗎？"
a_zh = "不用打印，也不必出示。官方指南写的是签发编号和 PDF（同样内容发到邮箱），没有要求出示二维码。资料有误时审查官可能要签发编号，手机里留一份 PDF。"
a_zh_hant = "不用列印，也不必出示。官方指南寫的是簽發編號和 PDF（同樣內容發到信箱），沒有要求出示 QR Code。資料有誤時審查官可能要簽發編號，手機裡留一份 PDF。"

[["korea/how-to-fill"]]
q = "Can I change my Korea e-Arrival Card after submitting it?"
a = "Yes, before immigration. Open Check/Edit with your issue number or email verification to change your place of stay, purpose, occupation or departure date. The arrival date can only be changed within 3 days of the first submission."
q_zh = "韩国入境卡填错了怎么改？"
q_zh_hant = "韓國入境卡填錯了怎麼改？"
a_zh = "过入境审查前可以改。在“查询·修改”页用签发编号或邮件认证打开，滞留地、入境目的、职业、出境日期都能改；抵达日期只能在首次提交起 3 天内修改。"
a_zh_hant = "過入境審查前可以改。在“查詢·修改”頁用簽發編號或郵件認證打開，滯留地、入境目的、職業、出境日期都能改；抵達日期只能在首次提交起 3 天內修改。"

[["korea/how-to-fill"]]
q = "Is the Korea e-Arrival Card the same as K-ETA?"
a = "No. They are separate systems. A traveller with a K-ETA that is still valid does not file the e-Arrival Card, unless entering on a visa. If a page asks you to pay a K-ETA or visa fee, you are not just filing the free e-Arrival Card."
q_zh = "韩国入境卡和 K-ETA 是一回事吗？"
q_zh_hant = "韓國入境卡和 K-ETA 是一回事嗎？"
a_zh = "不是，两个系统各管各的。K-ETA 仍在有效期内就不用填电子入境卡，用签证入境的除外。如果页面要你付 K-ETA 或签证费，你就不只是在填免费的电子入境卡。"
a_zh_hant = "不是，兩個系統各管各的。K-ETA 仍在有效期內就不用填電子入境卡，用簽證入境的除外。如果頁面要你付 K-ETA 或簽證費，你就不只是在填免費的電子入境卡。"

[["korea/how-to-fill"]]
q = "Do transit passengers need a Korea e-Arrival Card, and what address do they enter?"
a = "Not if you transfer within 24 hours without entering Korea. A same-day transit passenger who passes immigration, for example to collect bags, files one and enters the airport's address, such as 272 Gonghang-ro, Jung-gu, Incheon (22382) for Incheon Terminal 1."
q_zh = "转机要填韩国入境卡吗？地址填什么？"
q_zh_hant = "轉機要填韓國入境卡嗎？地址填什麼？"
a_zh = "24 小时内转机、不入境韩国就不用填。当天转机但要过入境审查（比如出去取行李）的，要填，地址写所在机场，例如仁川机场 T1 是 272 Gonghang-ro, Jung-gu, Incheon (22382)。"
a_zh_hant = "24 小時內轉機、不入境韓國就不用填。當天轉機但要過入境審查（比如出去取行李）的，要填，地址寫所在機場，例如仁川機場 T1 是 272 Gonghang-ro, Jung-gu, Incheon (22382)。"

[["korea/how-to-fill"]]
q = "What phone number goes on the Korea e-Arrival Card?"
a = "The contact field sits with your place of stay and asks for a contact number in Korea. A valid Korean visa number can fill in the stay address and contact for you."
q_zh = "韩国入境卡的电话填什么？"
q_zh_hant = "韓國入境卡的電話填什麼？"
a_zh = "联系方式和滞留地址放在一起，输入框提示是“请输入韩国境内的联系方式”。持有效韩国签证的，输入签证号可以直接带出滞留地址和联系方式。"
a_zh_hant = "聯繫方式和滯留地址放在一起，輸入框提示是“請輸入韓國境內的聯繫方式”。持有效韓國簽證的，輸入簽證號可以直接帶出滯留地址和聯繫方式。"

[["korea/how-to-fill"]]
q = "How do I fill in occupation on the Korea e-Arrival Card?"
a = "Occupation is a required drop-down list. If nothing fits, choose Other and type it in; the official user guide's examples are athlete and religious worker. Each traveller in a family or group picks their own."
q_zh = "韩国入境卡职业怎么填？"
q_zh_hant = "韓國入境卡職業怎麼填？"
a_zh = "职业是必选的下拉菜单。没有合适的选项就选“其他”再手动填写，官方用户指南举的例子是运动员、宗教人士。全家或团体申报时，每个人的职业要各自选择。"
a_zh_hant = "職業是必選的下拉菜單。沒有合適的選項就選“其他”再手動填寫，官方用戶指南舉的例子是運動員、宗教人士。全家或團體申報時，每個人的職業要各自選擇。"

[["philippines/how-to-fill"]]
q = "What if my flight changes after I file eTravel?"
a = "Update or refile before travel, using the passport and itinerary you will actually use, then save the new QR code."
q_zh = "菲律宾入境卡填完航班改了怎么办？"
q_zh_hant = "菲律賓入境卡填完航班改了怎麼辦？"
a_zh = "出发前更新或重新提交，按你实际会使用的护照和行程填写，再保存新的二维码。"
a_zh_hant = "出發前更新或重新提交，按你實際會使用的護照和行程填寫，再保存新的 QR Code。"

[["philippines/how-to-fill"]]
q = "How should I keep the Philippines eTravel QR code?"
a = "Screenshot it right after you submit. You may be asked for it at check-in and on arrival, and a screenshot is safer than relying on airport Wi-Fi."
q_zh = "菲律宾入境卡二维码怎么保存？"
q_zh_hant = "菲律賓入境卡 QR Code 怎麼保存？"
a_zh = "提交后马上截图保存。值机和入境时都可能被要求查看，截图比依赖机场 Wi-Fi 稳。"
a_zh_hant = "提交後馬上截圖保存。值機和入境時都可能被要求查看，截圖比依賴機場 Wi-Fi 穩。"

[["philippines/how-to-fill"]]
q = "Is Philippines eTravel a visa?"
a = "No. eTravel is a free electronic travel declaration at etravel.gov.ph. It is not a visa."
q_zh = "菲律宾 eTravel 是签证吗？"
q_zh_hant = "菲律賓 eTravel 是簽證嗎？"
a_zh = "不是。eTravel 是免费的电子旅行申报，官网 etravel.gov.ph，它不是签证。"
a_zh_hant = "不是。eTravel 是免費的電子旅行申報，官網 etravel.gov.ph，它不是簽證。"

[["taiwan/how-to-fill"]]
q = "Do I need to print the Taiwan Arrival Card?"
a = "No. You get a confirmation email or file, but you do not have to show it: scanning your passport retrieves the TWAC record. Bring the same passport you used to submit."
q_zh = "台湾入境卡要打印吗？"
q_zh_hant = "臺灣入境卡要列印嗎？"
a_zh = "不用。系统会发送确认邮件或电子文件，但查验时不必出示，扫描护照即可调出 TWAC 资料。携带提交时用的同一本护照就行。"
a_zh_hant = "不用。系統會發送確認郵件或電子文件，但查驗時不必出示，掃描護照即可調出 TWAC 資料。攜帶提交時用的同一本護照就行。"

[["taiwan/how-to-fill"]]
q = "How many days before arrival can I submit the Taiwan Arrival Card?"
a = "Within 7 days before arrival."
q_zh = "台湾入境卡提前几天填？"
q_zh_hant = "臺灣入境卡提前幾天填？"
a_zh = "抵达前 7 天内提交。"
a_zh_hant = "抵達前 7 天內提交。"

[["taiwan/how-to-fill"]]
q = "Can I fill in the Taiwan Arrival Card for my family or group?"
a = "Yes. One person can file for up to 10 travellers in a single submission, and the group-file import supports up to 16."
q_zh = "台湾入境卡可以帮家人一起填吗？"
q_zh_hant = "臺灣入境卡可以幫家人一起填嗎？"
a_zh = "可以。一人可单笔为最多 10 名旅客填写，团体档案汇入支持最多 16 人。"
a_zh_hant = "可以。一人可單筆為最多 10 名旅客填寫，團體檔案匯入支持最多 16 人。"

[["india/how-to-fill"]]
q = "When do I submit the India e-Arrival Card?"
a = "Within 72 hours before arrival. Foreign travellers file it, including OCI cardholders; Indian passport holders do not."
q_zh = "印度入境卡提前几天填？"
q_zh_hant = "印度入境卡提前幾天填？"
a_zh = "抵达前 72 小时内提交。外国旅客都要填，OCI 持有人也一样；印度护照持有人不用填。"
a_zh_hant = "抵達前 72 小時內提交。外國旅客都要填，OCI 持有人也一樣；印度護照持有人不用填。"

[["india/how-to-fill"]]
q = "Does the India e-Arrival Card replace the e-Visa?"
a = "No. The confirmation does not replace a visa, e-Visa or OCI status. Completing either form does not complete the other."
q_zh = "印度入境卡能代替 e-Visa 吗？"
q_zh_hant = "印度入境卡能代替 e-Visa 嗎？"
a_zh = "不能。入境卡的确认不能替代签证、e-Visa 或 OCI 身份，两个表单各填各的。"
a_zh_hant = "不能。入境卡的確認不能替代簽證、e-Visa 或 OCI 身份，兩個表單各填各的。"

[["japan/how-to-fill"]]
q = "How do I prepare the Visit Japan Web QR codes?"
a = "Generate them before you travel and keep a screenshot. If the airport asks for paper, fill in the paper form instead."
q_zh = "日本入境卡（Visit Japan Web）二维码怎么准备？"
q_zh_hant = "日本入境卡（Visit Japan Web）QR Code 怎麼準備？"
a_zh = "出发前生成二维码并截图保存。如果机场要求纸质表，就填纸质表。"
a_zh_hant = "出發前生成 QR Code 並截圖保存。如果機場要求紙質表，就填紙質表。"

[["japan/how-to-fill"]]
q = "Is Visit Japan Web free, and where is the official site?"
a = "It is free. The official service page sits on the Digital Agency's .go.jp domain. Do not hand passport data to a lookalike that is not on .go.jp. It is not a visa."
q_zh = "Visit Japan Web 收费吗？官网是哪个？"
q_zh_hant = "Visit Japan Web 收費嗎？官網是哪個？"
a_zh = "免费。官方服务说明页在日本数字厅的 .go.jp 域名下；不要把护照资料交给非 .go.jp 的仿冒服务。它也不是签证。"
a_zh_hant = "免費。官方服務說明頁在日本數字廳的 .go.jp 域名下；不要把護照資料交給非 .go.jp 的仿冒服務。它也不是簽證。"

[["cambodia/how-to-fill"]]
q = "Does the Cambodia e-Arrival Card cost anything?"
a = "The arrival declaration at arrival.gov.kh is free. If you need a visa, the visa fee is separate."
q_zh = "柬埔寨入境卡收费吗？"
q_zh_hant = "柬埔寨入境卡收費嗎？"
a_zh = "在 arrival.gov.kh 填入境申报免费；如果你需要签证，签证费另算。"
a_zh_hant = "在 arrival.gov.kh 填入境申報免費；如果你需要簽證，簽證費另算。"

[["cambodia/how-to-fill"]]
q = "What should I save after filing Cambodia e-Arrival?"
a = "Save the confirmation page or QR code before you leave the page, and travel with the passport you used to file."
q_zh = "柬埔寨入境卡填完要保存什么？"
q_zh_hant = "柬埔寨入境卡填完要保存什麼？"
a_zh = "离开页面前保存确认页或二维码，并携带填写时使用的那本护照。"
a_zh_hant = "離開頁面前保存確認頁或 QR Code，並攜帶填寫時使用的那本護照。"

[["vietnam/how-to-fill"]]
q = "Do I need to print the Vietnam e-visa?"
a = "Yes. Print the e-visa PDF. Airline check-in counters ask for a printed copy and some refuse boarding without it; hand it to the officer with your passport on arrival."
q_zh = "越南电子签证要打印吗？"
q_zh_hant = "越南電子簽證要列印嗎？"
a_zh = "要。打印 e-visa PDF：机场值机柜台要看打印件，部分航司没有打印件不让登机；入境时把打印件和护照一起交给官员。"
a_zh_hant = "要。列印 e-visa PDF：機場值機櫃臺要看列印件，部分航司沒有列印件不讓登機；入境時把列印件和護照一起交給官員。"

[["vietnam/how-to-fill"]]
q = "How long does the Vietnam e-visa take?"
a = "3 working days as standard. The official site sells an express option for an extra USD $50 government fee with 1-working-day processing. The approval email carries the e-visa PDF."
q_zh = "越南电子签证多久出签？"
q_zh_hant = "越南電子簽證多久出籤？"
a_zh = "标准 3 个工作日。官网有加急选项，另付 50 美元政府费用，1 个工作日处理。批准邮件会附带 e-visa PDF。"
a_zh_hant = "標準 3 個工作日。官網有加急選項，另付 50 美元政府費用，1 個工作日處理。批准郵件會附帶 e-visa PDF。"

[["mexico/how-to-fill"]]
q = "Do I need to print the Mexico FMM-E?"
a = "Print the FMM-E PDF or keep it on your phone. Airlines may ask for it at check-in; at a land border you show it at the INM desk. Keep the stub you receive at the border until you exit."
q_zh = "墨西哥入境卡（FMM-E）要打印吗？"
q_zh_hant = "墨西哥入境卡（FMM-E）要列印嗎？"
a_zh = "打印或存在手机上都可以。航空入境时航司值机可能要看 PDF，陆路入境在 INM 柜台出示；边境给你的回执条要保留到出境。"
a_zh_hant = "列印或存在手機上都可以。航空入境時航司值機可能要看 PDF，陸路入境在 INM 櫃檯出示；邊境給你的回執條要保留到出境。"

[["mexico/how-to-fill"]]
q = "When should I fill in the Mexico FMM-E?"
a = "Any time before you arrive. Most travellers fill it within a week of departure."
q_zh = "墨西哥入境卡什么时候填？"
q_zh_hant = "墨西哥入境卡什麼時候填？"
a_zh = "入境前任何时间都可以，多数旅客在出发前一周内填写。"
a_zh_hant = "入境前任何時間都可以，多數旅客在出發前一週內填寫。"

[["dominican/how-to-fill"]]
q = "How early can I fill in the Dominican Republic E-Ticket?"
a = "Within 72 hours before arrival. DGM recommends 24 to 48 hours before. Earlier submissions are accepted, but your flight details may not be final yet."
q_zh = "多米尼加入境卡（E-Ticket）提前多久填？"
q_zh_hant = "多米尼加入境卡（E-Ticket）提前多久填？"
a_zh = "抵达前 72 小时内。DGM 推荐抵达前 24 至 48 小时；更早也接受，但航班信息可能还没敲定。"
a_zh_hant = "抵達前 72 小時內。DGM 推薦抵達前 24 至 48 小時；更早也接受，但航班資訊可能還沒敲定。"

[["dominican/how-to-fill"]]
q = "Does one E-Ticket QR code cover both entry and exit?"
a = "Do not assume it does. Complete both the entry and exit details the official service asks for, save the confirmation and QR code it generates, and keep an offline copy."
q_zh = "多米尼加 E-Ticket 一个二维码能管入境和离境吗？"
q_zh_hant = "多米尼加 E-Ticket 一個 QR Code 能管入境和離境嗎？"
a_zh = "不要这样假定。按要求填写入境和离境资料，保存官方页面生成的确认信息及二维码，旅行时保留离线副本。"
a_zh_hant = "不要這樣假定。按要求填寫入境和離境資料，保存官方頁面生成的確認資訊及 QR Code，旅行時保留離線副本。"

[["maldives/how-to-fill"]]
q = "When do I submit the Maldives Traveller Declaration (IMUGA)?"
a = "Within the 96 hours before arrival. One declaration covers one entry."
q_zh = "马尔代夫入境卡（IMUGA）提前几天填？"
q_zh_hant = "馬爾代夫入境卡（IMUGA）提前幾天填？"
a_zh = "抵达前 96 小时内提交。一份申报对应一次入境。"
a_zh_hant = "抵達前 96 小時內提交。一份申報對應一次入境。"

[["maldives/how-to-fill"]]
q = "Do I fill in a Maldives declaration when I leave?"
a = "No. Maldives Immigration dropped the departure declaration on 15 August 2024."
q_zh = "离开马尔代夫还要填申报表吗？"
q_zh_hant = "離開馬爾代夫還要填申報表嗎？"
a_zh = "不用。马尔代夫移民局自 2024 年 8 月 15 日起取消了离境申报。"
a_zh_hant = "不用。馬爾代夫移民局自 2024 年 8 月 15 日起取消了離境申報。"

[["jamaica/how-to-fill"]]
q = "How early can I submit the Jamaica C5 form?"
a = "Up to 30 days before travel. Check the passport, flight and customs answers before submitting, then keep the confirmation email."
q_zh = "牙买加入境卡（C5）提前多久填？"
q_zh_hant = "牙買加入境卡（C5）提前多久填？"
a_zh = "政府允许在出行日前最多 30 天提交。提交前核对护照、航班和海关答案，提交后保存确认邮件。"
a_zh_hant = "政府允許在出行日前最多 30 天提交。提交前核對護照、航班和海關答案，提交後保存確認郵件。"

[["new-zealand/how-to-fill"]]
q = "When can I submit the New Zealand Traveller Declaration (NZTD)?"
a = "Air travellers can submit from 24 hours before starting their journey to New Zealand. Sea travellers can submit from 24 hours before the ship leaves its last overseas port."
q_zh = "新西兰入境卡（NZTD）什么时候能填？"
q_zh_hant = "新西蘭入境卡（NZTD）什麼時候能填？"
a_zh = "空路旅客从启程赴新西兰前 24 小时起可以提交；海路旅客从船舶离开最后一个境外港口前 24 小时起可以提交。"
a_zh_hant = "空路旅客從啟程赴新西蘭前 24 小時起可以提交；海路旅客從船舶離開最後一個境外港口前 24 小時起可以提交。"

[["new-zealand/how-to-fill"]]
q = "Is the New Zealand arrival card (NZTD) free?"
a = "Yes. New Zealand Customs does not charge to complete or submit the NZTD. The NZeTA is a separate, paid authority."
q_zh = "新西兰入境卡（NZTD）收费吗？"
q_zh_hant = "新西蘭入境卡（NZTD）收費嗎？"
a_zh = "免费。新西兰海关不对填写或提交 NZTD 收费；NZeTA 是另一项，单独收费。"
a_zh_hant = "免費。新西蘭海關不對填寫或提交 NZTD 收費；NZeTA 是另一項，單獨收費。"

[["indonesia/how-to-fill"]]
q = "Is the Indonesia customs declaration (e-CD) part of All Indonesia?"
a = "Yes. The electronic customs declaration is one section of the All Indonesia arrival declaration on the official site allindonesia.imigrasi.go.id, run by the Directorate General of Immigration and the Directorate General of Customs and Excise. It is free."
q_zh = "印尼海关申报（e-CD）是 All Indonesia 的一部分吗？"
q_zh_hant = "印尼海關申報（e-CD）是 All Indonesia 的一部分嗎？"
a_zh = "是。电子海关申报是 All Indonesia 入境申报里的一部分，在官方网站 allindonesia.imigrasi.go.id 填写，由印尼移民总局和海关总局负责，免费。"
a_zh_hant = "是。電子海關申報是 All Indonesia 入境申報裡的一部分，在官方網站 allindonesia.imigrasi.go.id 填寫，由印尼移民總局和海關總局負責，免費。"

[["indonesia/how-to-fill"]]
q = "When can I submit the Indonesia customs declaration?"
a = "Within 3 days before arrival. Earlier than that, the official site rejects the submission."
q_zh = "印尼海关申报什么时候可以提交？"
q_zh_hant = "印尼海關申報什麼時候可以提交？"
a_zh = "抵达前 3 天内。更早提交会被官方网站拒绝。"
a_zh_hant = "抵達前 3 天內。更早提交會被官方網站拒絕。"

[["indonesia/how-to-fill"]]
q = "What happens at customs after I submit it?"
a = "You get a QR code. Most travelers scan it at the customs gate and use the green lane. If you answered yes to any customs question, the QR routes you to the red lane for a secondary check."
q_zh = "提交后到了海关会怎样？"
q_zh_hant = "提交後到了海關會怎樣？"
a_zh = "你会拿到一个二维码。大多数旅客在海关闸口扫码后走绿色通道；如果任何一道海关问题回答了“是”，二维码会把你分到红色通道接受二次检查。"
a_zh_hant = "你會拿到一個 QR Code。大多數旅客在海關閘口掃碼後走綠色通道；如果任何一道海關問題回答了“是”，QR Code 會把你分到紅色通道接受二次檢查。"

[["qatar/how-to-fill"]]
q = "Do I need a Hayya A1 visa to enter Qatar?"
a = "Not always. Start with the Qatar Tourism checker: GCC citizens need no visa, and if the live result says Enter visa-free, a qualifying traveller has no required paid Hayya tourist visa. Use the Hayya category the checker offers; do not choose A1 when the result says free entry."
q_zh = "去卡塔尔一定要办 Hayya A1 签证吗？"
q_zh_hant = "去卡塔爾一定要辦 Hayya A1 簽證嗎？"
a_zh = "不一定。先用 Qatar Tourism 的资格检查：海湾国家公民不需要签证；如果实时结果显示可免签入境，符合条件的旅客不需要付费的 Hayya 旅游签证。按检查结果给出的 Hayya 类别申请，结果显示免签时不要选 A1。"
a_zh_hant = "不一定。先用 Qatar Tourism 的資格檢查：海灣國家公民不需要簽證；如果實時結果顯示可免簽入境，符合條件的旅客不需要付費的 Hayya 旅遊簽證。按檢查結果給出的 Hayya 類別申請，結果顯示免簽時不要選 A1。"

[["qatar/how-to-fill"]]
q = "What does the Hayya A1 application ask for?"
a = "A passport valid for at least 3 months from arrival and a hotel reservation during the application. Qatar Tourism lists QAR 100 for the Hayya tourist visa, paid after approval."
q_zh = "Hayya A1 申请需要什么？"
q_zh_hant = "Hayya A1 申請需要什麼？"
a_zh = "护照从入境起至少还有 3 个月有效期，申请时要提供酒店预订。Qatar Tourism 公布的 Hayya 旅游签证费用是 100 卡塔尔里亚尔，获批后支付。"
a_zh_hant = "護照從入境起至少還有 3 個月有效期，申請時要提供酒店預訂。Qatar Tourism 公佈的 Hayya 旅遊簽證費用是 100 卡塔爾里亞爾，獲批後支付。"

[["jamaica/how-to-fill"]]
q = "What is the Departure Port on the Jamaica C5 form?"
a = "The port immediately before arrival in Jamaica, not where your whole trip started."
q_zh = "牙买加 C5 表的 Departure Port 填什么？"
q_zh_hant = "牙買加 C5 表的 Departure Port 填什麼？"
a_zh = "填抵达牙买加前一程的出发口岸，不是整趟旅程的出发地。"
a_zh_hant = "填抵達牙買加前一程的出發口岸，不是整趟旅程的出發地。"

[["jamaica/how-to-fill"]]
q = "How do I enter the flight number on the C5 form?"
a = "Select the airline first, then enter only the number portion from your booking. The number box is capped at 4 characters."
q_zh = "C5 表的航班号怎么填？"
q_zh_hant = "C5 表的航班號怎麼填？"
a_zh = "先选择航空公司，再只填订单里的航班数字部分。数字框最多 4 个字符。"
a_zh_hant = "先選擇航空公司，再只填訂單裡的航班數字部分。數字框最多 4 個字符。"

[["india/how-to-fill"]]
q = "What is the ISD code on the India e-Arrival Card?"
a = "The international calling code of the country or region your phone number belongs to. Enter it with a number where you can be reached; the same applies to an emergency contact number if you give one."
q_zh = "印度电子入境卡上的 ISD code 是什么？"
q_zh_hant = "印度電子入境卡上的 ISD code 是什麼？"
a_zh = "就是你手机号所属国家或地区的国际区号。连同能联系到你的号码一起填；如果填写紧急联系人号码，也要加国家或地区代码。"
a_zh_hant = "就是你手機號所屬國家或地區的國際區號。連同能聯繫到你的號碼一起填；如果填寫緊急聯繫人號碼，也要加國家或地區代碼。"

[["thailand/how-to-fill"]]
q = "Is the phone number required on the TDAC?"
a = "Yes, on the current form. It has two required boxes, Code and Phone No., and both take digits only, without + or spaces. The Code fills in from your Country/Territory of Residence."
q_zh = "TDAC 的电话号码必须填吗？"
q_zh_hant = "TDAC 的電話號碼必須填嗎？"
a_zh = "必须填。现在的表单分 Code（区号）和 Phone No.（号码）两栏，都是必填，只能填数字，不加 + 号和空格。区号会按你选的居住国自动带出。"
a_zh_hant = "必須填。現在的表單分 Code（區號）和 Phone No.（號碼）兩欄，都是必填，只能填數字，不加 + 號和空格。區號會按你選的居住國自動帶出。"

[["thailand/how-to-fill"]]
q = "What do I put for occupation on the TDAC?"
a = "Your job, in English. Occupation is a required free-text box, not a dropdown: letters, spaces and ordinary punctuation, no digits, up to 100 characters. The site turns it into capitals. Examples: TEACHER, SOFTWARE ENGINEER, RETIRED."
q_zh = "泰国入境卡职业怎么填？"
q_zh_hant = "泰國入境卡職業怎麼填？"
a_zh = "用英文写你的职业。职业是必填的自由文本框，不是下拉菜单：可以用字母、空格和常见标点，不能有数字，最多 100 个字符，系统会自动转成大写。例如 TEACHER、SOFTWARE ENGINEER、RETIRED。"
a_zh_hant = "用英文寫你的職業。職業是必填的自由文本框，不是下拉菜單：可以用字母、空格和常見標點，不能有數字，最多 100 個字符，系統會自動轉成大寫。例如 TEACHER、SOFTWARE ENGINEER、RETIRED。"

[["thailand/how-to-fill"]]
q = "What is Country/Territory of Residence on the TDAC?"
a = "The country where you live now, which can differ from your passport. Choose it before the phone number: it fills the phone Code box, and changing it later clears the phone and city fields. City/State of Residence opens after it; write the city in English."
q_zh = "泰国入境卡居住国怎么填？"
q_zh_hant = "泰國入境卡居住國怎麼填？"
a_zh = "填你现在常住的国家，可以和护照国籍不同。先选居住国再填电话：它会自动带出电话区号，之后再改会清空电话和居住城市。居住城市在选好国家后才能填，用英文写，例如 SHANGHAI。"
a_zh_hant = "填你現在常住的國家，可以和護照國籍不同。先選居住國再填電話：它會自動帶出電話區號，之後再改會清空電話和居住城市。居住城市在選好國家後才能填，用英文寫，例如 SHANGHAI。"

[["thailand/how-to-fill"]]
q = "What if no purpose of travel fits on the TDAC?"
a = "Choose OTHERS (PLEASE SPECIFY) from the Purpose of Travel list and type the purpose in English, letters and spaces only, up to 100 characters."
q_zh = "泰国入境卡旅行目的怎么选？"
q_zh_hant = "泰國入境卡旅行目的怎麼選？"
a_zh = "从 Purpose of Travel 下拉菜单选和这次行程相符的一项；都不合适就选 OTHERS (PLEASE SPECIFY)，再用英文写明目的，只能用字母和空格，最多 100 个字符。"
a_zh_hant = "從 Purpose of Travel 下拉菜單選和這次行程相符的一項；都不合適就選 OTHERS (PLEASE SPECIFY)，再用英文寫明目的，只能用字母和空格，最多 100 個字符。"

[["thailand/how-to-fill"]]
q = "How do I change my TDAC after submitting it?"
a = "Click Update Arrival Card on tdac.immigration.go.th and search with your TH Digital Arrival Card No., date of birth and nationality. You can update any time before travel, except full name, passport number, nationality and date of birth. If one of those is wrong, submit a new TDAC; the most recent submission is the valid one."
q_zh = "泰国入境卡提交后怎么修改？"
q_zh_hant = "泰國入境卡提交後怎麼修改？"
a_zh = "在 tdac.immigration.go.th 点 Update Arrival Card，用入境卡编号（TH Digital Arrival Card No.）、出生日期和国籍查出记录再改。出行前随时能改，但姓名、护照号、国籍和出生日期改不了；这几项填错就重新提交一份，系统以最近一次提交为准。"
a_zh_hant = "在 tdac.immigration.go.th 點 Update Arrival Card，用入境卡編號（TH Digital Arrival Card No.）、出生日期和國籍查出記錄再改。出行前隨時能改，但姓名、護照號、國籍和出生日期改不了；這幾項填錯就重新提交一份，系統以最近一次提交為準。"

[["thailand/how-to-fill"]]
q = "I entered the wrong phone number on my TDAC. What now?"
a = "Correct it with Update Arrival Card; the phone number is not one of the locked fields. The official FAQ does not describe a separate consequence for a wrong phone number, but it says details must be accurate before entry and that passengers with incorrect information may be refused entry at immigration's discretion."
q_zh = "泰国入境卡电话填错了怎么办？"
q_zh_hant = "泰國入境卡電話填錯了怎麼辦？"
a_zh = "用 Update Arrival Card 改过来就行，电话不在不能修改的字段里。官方 FAQ 没有单独说电话填错的后果，但写明入境前信息必须准确，信息有误的旅客可能被移民官酌情拒绝入境。"
a_zh_hant = "用 Update Arrival Card 改過來就行，電話不在不能修改的欄位裡。官方 FAQ 沒有單獨說電話填錯的後果，但寫明入境前資訊必須準確，資訊有誤的旅客可能被移民官酌情拒絕入境。"

[["aruba/how-to-fill"]]
q = "When should I fill out the Aruba ED Card?"
a = "Within seven days before travel, on the official site edcardaruba.aw run by Aruba Immigration. Most air arrivals then pay the USD 20 sustainability fee. Save the approved confirmation as both a digital and a printed copy."
q_zh = "阿鲁巴 ED Card 什么时候填？"
q_zh_hant = "阿魯巴 ED Card 什麼時候填？"
a_zh = "出行前 7 天内，在阿鲁巴移民局的官方网站 edcardaruba.aw 填写。多数航空抵达旅客随后要付 20 美元可持续发展费。获批确认要同时保存电子版和打印版。"
a_zh_hant = "出行前 7 天內，在阿魯巴移民局的官方網站 edcardaruba.aw 填寫。多數航空抵達旅客隨後要付 20 美元可持續發展費。獲批確認要同時保存電子版和列印版。"

[["curacao/how-to-fill"]]
q = "When should I fill out the Curaçao Digital Immigration Card?"
a = "Within seven days before departure, using the confirmed arrival date. If a flight is missed or cancelled, the card stays active for at least one day after the original date. Each traveller needs a card for each trip, and it is free."
q_zh = "库拉索电子入境卡什么时候填？"
q_zh_hant = "庫拉索電子入境卡什麼時候填？"
a_zh = "出发前 7 天内，按确认的抵达日期填写。航班误机或取消时，卡片在原抵达日后至少还会保持 1 天有效。每位旅客每次出行都要填一张，免费。"
a_zh_hant = "出發前 7 天內，按確認的抵達日期填寫。航班誤機或取消時，卡片在原抵達日後至少還會保持 1 天有效。每位旅客每次出行都要填一張，免費。"
