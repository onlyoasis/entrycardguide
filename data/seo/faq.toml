a_zh_hant = "出發前生成 QR Code 並截圖保存。如果機場要求紙質表，就填紙質表。"

[["japan/how-to-fill"]]
q = "Is Visit Japan Web free, and where is the official site?"
a = "It is free. The official service page sits on the Digital Agency's .go.jp domain. Do not hand passport data to a lookalike that is not on .go.jp. It is not a visa."
q_zh = "Visit Japan Web 收费吗？官网是哪个？"
q_zh_hant = "Visit Japan Web 收費嗎？官網是哪個？"
a_zh = "免费。官方服务说明页在日本数字厅的 .go.jp 域名下；不要把护照资料交给非 .go.jp 的仿冒服务。它也不是签证。"
a_zh_hant = "免費。官方服務說明頁在日本數字廳的 .go.jp 域名下；不要把護照資料交給非 .go.jp 的仿冒服務。它也不是簽證。"

[["cambodia/how-to-fill"]]
q = "Does the Cambodia e-Arrival Card cost anything?"
a = "The arrival declaration at arrival.gov.kh is free. If you need a visa, the visa fee is separate."
q_zh = "柬埔寨入境卡收费吗？"
q_zh_hant = "柬埔寨入境卡收費嗎？"
a_zh = "在 arrival.gov.kh 填入境申报免费；如果你需要签证，签证费另算。"
a_zh_hant = "在 arrival.gov.kh 填入境申報免費；如果你需要簽證，簽證費另算。"

[["cambodia/how-to-fill"]]
q = "What should I save after filing Cambodia e-Arrival?"
a = "Save the confirmation page or QR code before you leave the page, and travel with the passport you used to file."
q_zh = "柬埔寨入境卡填完要保存什么？"
q_zh_hant = "柬埔寨入境卡填完要保存什麼？"
a_zh = "离开页面前保存确认页或二维码，并携带填写时使用的那本护照。"
a_zh_hant = "離開頁面前保存確認頁或 QR Code，並攜帶填寫時使用的那本護照。"

[["vietnam/how-to-fill"]]
q = "Do I need to print the Vietnam e-visa?"
a = "Yes. Print the e-visa PDF. Airline check-in counters ask for a printed copy and some refuse boarding without it; hand it to the officer with your passport on arrival."
q_zh = "越南电子签证要打印吗？"
q_zh_hant = "越南電子簽證要列印嗎？"
a_zh = "要。打印 e-visa PDF：机场值机柜台要看打印件，部分航司没有打印件不让登机；入境时把打印件和护照一起交给官员。"
a_zh_hant = "要。列印 e-visa PDF：機場值機櫃臺要看列印件，部分航司沒有列印件不讓登機；入境時把列印件和護照一起交給官員。"

[["vietnam/how-to-fill"]]
q = "How long does the Vietnam e-visa take?"
a = "3 working days as standard. The official site sells an express option for an extra USD $50 government fee with 1-working-day processing. The approval email carries the e-visa PDF."
q_zh = "越南电子签证多久出签？"
q_zh_hant = "越南電子簽證多久出籤？"
a_zh = "标准 3 个工作日。官网有加急选项，另付 50 美元政府费用，1 个工作日处理。批准邮件会附带 e-visa PDF。"
a_zh_hant = "標準 3 個工作日。官網有加急選項，另付 50 美元政府費用，1 個工作日處理。批准郵件會附帶 e-visa PDF。"

[["mexico/how-to-fill"]]
q = "Do I need to print the Mexico FMM-E?"
a = "Print the FMM-E PDF or keep it on your phone. Airlines may ask for it at check-in; at a land border you show it at the INM desk. Keep the stub you receive at the border until you exit."
q_zh = "墨西哥入境卡（FMM-E）要打印吗？"
q_zh_hant = "墨西哥入境卡（FMM-E）要列印嗎？"
a_zh = "打印或存在手机上都可以。航空入境时航司值机可能要看 PDF，陆路入境在 INM 柜台出示；边境给你的回执条要保留到出境。"
a_zh_hant = "列印或存在手機上都可以。航空入境時航司值機可能要看 PDF，陸路入境在 INM 櫃檯出示；邊境給你的回執條要保留到出境。"

[["mexico/how-to-fill"]]
q = "When should I fill in the Mexico FMM-E?"
a = "Any time before you arrive. Most travellers fill it within a week of departure."
q_zh = "墨西哥入境卡什么时候填？"
q_zh_hant = "墨西哥入境卡什麼時候填？"
a_zh = "入境前任何时间都可以，多数旅客在出发前一周内填写。"
a_zh_hant = "入境前任何時間都可以，多數旅客在出發前一週內填寫。"

[["dominican/how-to-fill"]]
q = "How early can I fill in the Dominican Republic E-Ticket?"
a = "Within 72 hours before arrival. DGM recommends 24 to 48 hours before. Earlier submissions are accepted, but your flight details may not be final yet."
q_zh = "多米尼加入境卡（E-Ticket）提前多久填？"
q_zh_hant = "多米尼加入境卡（E-Ticket）提前多久填？"
a_zh = "抵达前 72 小时内。DGM 推荐抵达前 24 至 48 小时；更早也接受，但航班信息可能还没敲定。"
a_zh_hant = "抵達前 72 小時內。DGM 推薦抵達前 24 至 48 小時；更早也接受，但航班資訊可能還沒敲定。"

[["dominican/how-to-fill"]]
q = "Does one E-Ticket QR code cover both entry and exit?"
a = "Do not assume it does. Complete both the entry and exit details the official service asks for, save the confirmation and QR code it generates, and keep an offline copy."
q_zh = "多米尼加 E-Ticket 一个二维码能管入境和离境吗？"
q_zh_hant = "多米尼加 E-Ticket 一個 QR Code 能管入境和離境嗎？"
a_zh = "不要这样假定。按要求填写入境和离境资料，保存官方页面生成的确认信息及二维码，旅行时保留离线副本。"
a_zh_hant = "不要這樣假定。按要求填寫入境和離境資料，保存官方頁面生成的確認資訊及 QR Code，旅行時保留離線副本。"

[["maldives/how-to-fill"]]
q = "When do I submit the Maldives Traveller Declaration (IMUGA)?"
a = "Within the 96 hours before arrival. One declaration covers one entry."
q_zh = "马尔代夫入境卡（IMUGA）提前几天填？"
q_zh_hant = "馬爾代夫入境卡（IMUGA）提前幾天填？"
a_zh = "抵达前 96 小时内提交。一份申报对应一次入境。"
a_zh_hant = "抵達前 96 小時內提交。一份申報對應一次入境。"

[["maldives/how-to-fill"]]
q = "Do I fill in a Maldives declaration when I leave?"
a = "No. Maldives Immigration dropped the departure declaration on 15 August 2024."
q_zh = "离开马尔代夫还要填申报表吗？"
q_zh_hant = "離開馬爾代夫還要填申報表嗎？"
a_zh = "不用。马尔代夫移民局自 2024 年 8 月 15 日起取消了离境申报。"
a_zh_hant = "不用。馬爾代夫移民局自 2024 年 8 月 15 日起取消了離境申報。"

[["jamaica/how-to-fill"]]
q = "How early can I submit the Jamaica C5 form?"
a = "Up to 30 days before travel. Check the passport, flight and customs answers before submitting, then keep the confirmation email."
q_zh = "牙买加入境卡（C5）提前多久填？"
q_zh_hant = "牙買加入境卡（C5）提前多久填？"
a_zh = "政府允许在出行日前最多 30 天提交。提交前核对护照、航班和海关答案，提交后保存确认邮件。"
a_zh_hant = "政府允許在出行日前最多 30 天提交。提交前核對護照、航班和海關答案，提交後保存確認郵件。"

[["new-zealand/how-to-fill"]]
q = "When can I submit the New Zealand Traveller Declaration (NZTD)?"
a = "Air travellers can submit from 24 hours before starting their journey to New Zealand. Sea travellers can submit from 24 hours before the ship leaves its last overseas port."
q_zh = "新西兰入境卡（NZTD）什么时候能填？"
q_zh_hant = "新西蘭入境卡（NZTD）什麼時候能填？"
a_zh = "空路旅客从启程赴新西兰前 24 小时起可以提交；海路旅客从船舶离开最后一个境外港口前 24 小时起可以提交。"
a_zh_hant = "空路旅客從啟程赴新西蘭前 24 小時起可以提交；海路旅客從船舶離開最後一個境外港口前 24 小時起可以提交。"

[["new-zealand/how-to-fill"]]
q = "Is the New Zealand arrival card (NZTD) free?"
a = "Yes. New Zealand Customs does not charge to complete or submit the NZTD. The NZeTA is a separate, paid authority."
q_zh = "新西兰入境卡（NZTD）收费吗？"
q_zh_hant = "新西蘭入境卡（NZTD）收費嗎？"
a_zh = "免费。新西兰海关不对填写或提交 NZTD 收费；NZeTA 是另一项，单独收费。"
a_zh_hant = "免費。新西蘭海關不對填寫或提交 NZTD 收費；NZeTA 是另一項，單獨收費。"
