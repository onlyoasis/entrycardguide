# Search-result <title> / meta description overrides, keyed by the page's
# language-neutral Hugo path without the leading slash ("indonesia",
# "uk/how-to-fill"). layouts/partials/head.html reads them; the visible H1,
# breadcrumbs and navigation keep the content file's own `title`.
#
# Why a data file instead of editing front matter: en/zh pages take Lastmod
# from Git, and that date is rendered as "Last verified". Retitling a page is
# not a re-verification, so the content files stay untouched.
#
# Fields: title / description (en), title_zh / description_zh (zh-Hans).
# how-to-fill pages also take h1 / h1_zh (layouts/_default/how-to-fill.html).
# `*_zh_hant` siblings are generated by `npm run sync:zh-hant` — do not edit.
# The site brand suffix is appended by the template; do not include it here.
# Keep fees out of hub titles: amounts live in data/official_urls/*.toml.
#
# Keyword map (docs/plans/2026-10-14-country-longtail-keywords.md): one
# primary phrase per page so the three pages of a country stop competing.
#   form page   → "<country> arrival card official website" / "<国家>入境卡官网"
#   how-to-fill → "how to fill the <country> arrival card" / "<国家>入境卡怎么填"
#   hub         → overview: when to file, what to bring / "<国家>入境卡指南"
# Chinese searchers type the generic noun (入境卡, 电子签证), not the
# acronym, so zh titles lead with it and keep the form code second.

# ---- Country hubs: overview intent, no "official site" wording ----

